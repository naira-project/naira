        - name: plugin-fluxcd
          image: ${E2E_IMAGE}:fluxcd-${TAG}
          restartPolicy: Always
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "${PLUGIN_PORT}"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
