        - name: plugin-mlflow
          image: mlflow:${TAG}
          restartPolicy: Always
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "50052"
            - name: MLFLOW_BASE_URL
              value: http://mlflow.${NAMESPACE}.svc.cluster.local:5000
            - name: PATH_PREFIX
              value: mlflow
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
