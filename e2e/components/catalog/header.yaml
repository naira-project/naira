# envsubst template — substituted variables: ${NAMESPACE} ${ENV_ID} ${TAG} ${PLUGIN_ADDRESSES}
#
# First fragment of the catalog Deployment. scripts/create-environment.sh
# concatenates this with one plugin-<name>.yaml per entry in the scenario's
# PLUGINS list, then footer.yaml, and applies the result as one manifest —
# see e2e/README.md for why the Deployment is split this way (only PLUGINS
# actually run as sidecars; everything else here — Namespace, Secret, SA,
# RBAC — is shared/always-applied, since it's declarative and costs nothing
# unused).
#
# Parameterized copy of deploy/dev/stacks/core/infra/kubernetes/catalog.yaml for
# per-PR E2E environments. Every namespace reference (including the Namespace
# object itself and the ClusterRoleBinding subjects) is templated, and all
# ClusterRole/ClusterRoleBinding names are suffixed with ${ENV_ID} to avoid
# collisions between concurrent PR environments on a shared cluster.
apiVersion: v1
kind: Namespace
metadata:
  name: ${NAMESPACE}
  labels:
    naira.io/environment: e2e
    naira.io/env-id: ${ENV_ID}
    naira.io/managed-by: environment-script
---
apiVersion: v1
kind: Secret
metadata:
  name: catalog-secrets
  namespace: ${NAMESPACE}
type: Opaque
stringData:
  OPENMETADATA_ADMIN_PASSWORD: admin
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: catalog
  namespace: ${NAMESPACE}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: catalog-appidentities-${ENV_ID}
  labels:
    naira.io/env-id: ${ENV_ID}
rules:
  - apiGroups: ["naira.io"]
    resources: ["appidentities"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: plugin-depl-calls-svc-${ENV_ID}
  labels:
    naira.io/env-id: ${ENV_ID}
rules:
  - apiGroups: [""]
    resources: ["namespaces", "services"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: plugin-depl-uses-litellm-${ENV_ID}
  labels:
    naira.io/env-id: ${ENV_ID}
rules:
  - apiGroups: [""]
    resources: ["namespaces", "secrets"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: plugin-fluxcd-${ENV_ID}
  labels:
    naira.io/env-id: ${ENV_ID}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
  - apiGroups: ["kustomize.toolkit.fluxcd.io"]
    resources: ["kustomizations"]
    verbs: ["get", "list"]
  - apiGroups: ["helm.toolkit.fluxcd.io"]
    resources: ["helmreleases"]
    verbs: ["get", "list"]
  - apiGroups: ["source.toolkit.fluxcd.io"]
    resources: ["gitrepositories"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: plugin-depl-calls-svc-${ENV_ID}
  labels:
    naira.io/env-id: ${ENV_ID}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: plugin-depl-calls-svc-${ENV_ID}
subjects:
  - kind: ServiceAccount
    name: catalog
    namespace: ${NAMESPACE}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: plugin-depl-uses-litellm-${ENV_ID}
  labels:
    naira.io/env-id: ${ENV_ID}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: plugin-depl-uses-litellm-${ENV_ID}
subjects:
  - kind: ServiceAccount
    name: catalog
    namespace: ${NAMESPACE}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: catalog-appidentities-${ENV_ID}
  labels:
    naira.io/env-id: ${ENV_ID}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: catalog-appidentities-${ENV_ID}
subjects:
  - kind: ServiceAccount
    name: catalog
    namespace: ${NAMESPACE}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: plugin-fluxcd-${ENV_ID}
  labels:
    naira.io/env-id: ${ENV_ID}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: plugin-fluxcd-${ENV_ID}
subjects:
  - kind: ServiceAccount
    name: catalog
    namespace: ${NAMESPACE}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: ${NAMESPACE}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog
  template:
    metadata:
      labels:
        app: catalog
    spec:
      serviceAccountName: catalog
      initContainers:
