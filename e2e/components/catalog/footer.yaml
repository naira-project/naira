      containers:
        - name: catalog
          image: catalog:${TAG}
          imagePullPolicy: IfNotPresent
          # Mounted as a directory (not via subPath onto a single file) so
          # catalog's whole plugin-config volume uses the standard,
          # symlink-swap ConfigMap update mechanism. PLUGIN_CONFIG_FILE
          # points catalog at the file inside it.
          volumeMounts:
            - name: plugin-config
              mountPath: /etc/catalog-config
              readOnly: true
          env:
            - name: PLUGIN_CONFIG_FILE
              value: /etc/catalog-config/plugins.yaml
            - name: PORT
              value: "8090"
            - name: KEYCLOAK_BASE_URL
              value: http://keycloak.${NAMESPACE}.svc.cluster.local:8080
            - name: KEYCLOAK_REALM
              value: naira
            - name: KEYCLOAK_ISSUER
              value: http://keycloak.${NAMESPACE}.svc.cluster.local:8080/realms/naira
          ports:
            - containerPort: 8090
              name: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: plugin-config
          configMap:
            name: catalog-plugin-config
---
apiVersion: v1
kind: Service
metadata:
  name: catalog
  namespace: ${NAMESPACE}
spec:
  selector:
    app: catalog
  ports:
    - name: http
      port: 8090
      targetPort: http
  type: ClusterIP
