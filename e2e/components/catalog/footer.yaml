        # Appended to header.yaml's initContainers list (already open at
        # this point — no initContainers: key here, or it would silently
        # replace that list wholesale instead of extending it).
        #
        # A CI run showed catalog starting with zero plugins registered,
        # silently — /etc/catalog/plugins.yaml was empty at the moment
        # catalog read it, despite the ConfigMap existing server-side by
        # then and both local runs mounting it correctly. Most likely a
        # kubelet volume-sync race on a brand-new pod. Rather than let
        # catalog start against a stale/empty view, wait here for the
        # mount to actually contain what the ConfigMap was rendered with —
        # kubelet's periodic ConfigMap resync (~1 min) self-heals a stale
        # initial mount within this window if that's the cause.
        - name: wait-for-plugin-config
          image: busybox:1.36
          volumeMounts:
            - name: plugin-config
              mountPath: /etc/catalog/plugins.yaml
              subPath: plugins.yaml
              readOnly: true
          # The HAS_PLUGINS check below is resolved by envsubst at
          # manifest-render time, same as every other variable in this
          # file — not read from the container's own environment, so no
          # env: block is needed to pass it in.
          command:
            - sh
            - -c
            - |
              if [ "${HAS_PLUGINS}" != "true" ]; then
                exit 0
              fi
              for i in $(seq 1 60); do
                if grep -q "address:" /etc/catalog/plugins.yaml; then
                  echo "plugins.yaml ready:"
                  cat /etc/catalog/plugins.yaml
                  exit 0
                fi
                sleep 1
              done
              echo "plugins.yaml still has no plugin entries after 60s:" >&2
              cat /etc/catalog/plugins.yaml >&2
              exit 1
      containers:
        - name: catalog
          image: catalog:${TAG}
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: plugin-config
              mountPath: /etc/catalog/plugins.yaml
              subPath: plugins.yaml
              readOnly: true
          env:
            - name: PORT
              value: "8090"
            - name: KEYCLOAK_BASE_URL
              value: http://keycloak.${NAMESPACE}.svc.cluster.local:8080
            - name: KEYCLOAK_REALM
              value: naira
            - name: KEYCLOAK_ISSUER
              value: http://keycloak.${NAMESPACE}.svc.cluster.local:8080/realms/naira
          ports:
            - containerPort: 8090
              name: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: plugin-config
          configMap:
            name: catalog-plugin-config
---
apiVersion: v1
kind: Service
metadata:
  name: catalog
  namespace: ${NAMESPACE}
spec:
  selector:
    app: catalog
  ports:
    - name: http
      port: 8090
      targetPort: http
  type: ClusterIP
