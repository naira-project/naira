# envsubst template — substituted variables: ${NAMESPACE}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mlflow-data
  namespace: ${NAMESPACE}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: ${NAMESPACE}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
    spec:
      initContainers:
        - name: init-mlflow-storage
          image: busybox:1.36
          command:
            - sh
            - -c
            - mkdir -p /mlflow-data/backend /mlflow-data/artifacts
          volumeMounts:
            - name: mlflow-data
              mountPath: /mlflow-data
      containers:
        - name: mlflow
          image: ghcr.io/mlflow/mlflow:v3.1.4
          imagePullPolicy: IfNotPresent
          args:
            - mlflow
            - server
            - --host
            - 0.0.0.0
            - --port
            - "5000"
            - --backend-store-uri
            - sqlite:////mlflow-data/backend/mlflow.db
            - --artifacts-destination
            - /mlflow-data/artifacts
            - --serve-artifacts
          ports:
            - containerPort: 5000
              name: http
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1
              memory: 1Gi
          volumeMounts:
            - name: mlflow-data
              mountPath: /mlflow-data
      volumes:
        - name: mlflow-data
          persistentVolumeClaim:
            claimName: mlflow-data
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
  namespace: ${NAMESPACE}
spec:
  selector:
    app: mlflow
  ports:
    - name: http
      port: 5000
      targetPort: http
  type: ClusterIP
