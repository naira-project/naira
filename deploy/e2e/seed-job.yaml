# envsubst template — substituted variables: ${NAMESPACE} ${ENV_ID} ${TAG}
#
# `full` profile: every instance is fresh and empty, so the seed scripts run
# with their default entity names (kind-standalone-demo, demo-model,
# naira_sample) — no ENV_ID-prefixed naming needed. See the RFC's "Clean Slate"
# section for why that's specific to this profile.
apiVersion: batch/v1
kind: Job
metadata:
  name: seed-${ENV_ID}
  namespace: ${NAMESPACE}
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: seed
          image: seed:${TAG}
          imagePullPolicy: IfNotPresent
          env:
            - name: MLFLOW_TRACKING_URI
              value: http://mlflow.${NAMESPACE}.svc.cluster.local:5000
            - name: OPENMETADATA_HOST_PORT
              value: http://openmetadata.${NAMESPACE}.svc.cluster.local:8585
            - name: CATALOG_URL
              value: http://catalog.${NAMESPACE}.svc.cluster.local:8090
            - name: KEYCLOAK_URL
              value: http://keycloak.${NAMESPACE}.svc.cluster.local:8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
