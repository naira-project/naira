# envsubst template — substituted variables: ${NAMESPACE} ${ENV_ID} ${TAG}
#
# Parameterized copy of deploy/dev/stacks/core/infra/kubernetes/catalog.yaml for
# per-PR E2E environments. Every namespace reference (including the Namespace
# object itself and the ClusterRoleBinding subjects) is templated, and all
# ClusterRole/ClusterRoleBinding names are suffixed with ${ENV_ID} to avoid
# collisions between concurrent PR environments on a shared cluster.
apiVersion: v1
kind: Namespace
metadata:
  name: ${NAMESPACE}
  labels:
    naira.io/environment: e2e
    naira.io/env-id: ${ENV_ID}
    naira.io/managed-by: environment-script
---
apiVersion: v1
kind: Secret
metadata:
  name: catalog-secrets
  namespace: ${NAMESPACE}
type: Opaque
stringData:
  LITELLM_API_KEY: sk-local-litellm
  OPENMETADATA_ADMIN_PASSWORD: admin
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: catalog
  namespace: ${NAMESPACE}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: catalog-appidentities-${ENV_ID}
  labels:
    naira.io/env-id: ${ENV_ID}
rules:
  - apiGroups: ["naira.io"]
    resources: ["appidentities"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: plugin-depl-calls-svc-${ENV_ID}
  labels:
    naira.io/env-id: ${ENV_ID}
rules:
  - apiGroups: [""]
    resources: ["namespaces", "services"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: plugin-depl-uses-litellm-${ENV_ID}
  labels:
    naira.io/env-id: ${ENV_ID}
rules:
  - apiGroups: [""]
    resources: ["namespaces", "secrets"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: plugin-fluxcd-${ENV_ID}
  labels:
    naira.io/env-id: ${ENV_ID}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
  - apiGroups: ["kustomize.toolkit.fluxcd.io"]
    resources: ["kustomizations"]
    verbs: ["get", "list"]
  - apiGroups: ["helm.toolkit.fluxcd.io"]
    resources: ["helmreleases"]
    verbs: ["get", "list"]
  - apiGroups: ["source.toolkit.fluxcd.io"]
    resources: ["gitrepositories"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: plugin-depl-calls-svc-${ENV_ID}
  labels:
    naira.io/env-id: ${ENV_ID}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: plugin-depl-calls-svc-${ENV_ID}
subjects:
  - kind: ServiceAccount
    name: catalog
    namespace: ${NAMESPACE}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: plugin-depl-uses-litellm-${ENV_ID}
  labels:
    naira.io/env-id: ${ENV_ID}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: plugin-depl-uses-litellm-${ENV_ID}
subjects:
  - kind: ServiceAccount
    name: catalog
    namespace: ${NAMESPACE}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: catalog-appidentities-${ENV_ID}
  labels:
    naira.io/env-id: ${ENV_ID}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: catalog-appidentities-${ENV_ID}
subjects:
  - kind: ServiceAccount
    name: catalog
    namespace: ${NAMESPACE}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: plugin-fluxcd-${ENV_ID}
  labels:
    naira.io/env-id: ${ENV_ID}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: plugin-fluxcd-${ENV_ID}
subjects:
  - kind: ServiceAccount
    name: catalog
    namespace: ${NAMESPACE}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: ${NAMESPACE}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog
  template:
    metadata:
      labels:
        app: catalog
    spec:
      serviceAccountName: catalog
      initContainers:
        - name: plugin-litellm
          image: litellm:${TAG}
          restartPolicy: Always
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "50051"
            - name: LITELLM_BASE_URL
              value: http://litellm.${NAMESPACE}.svc.cluster.local:4000
            - name: LITELLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: catalog-secrets
                  key: LITELLM_API_KEY
            - name: PATH_PREFIX
              value: litellm
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
        - name: plugin-mlflow
          image: mlflow:${TAG}
          restartPolicy: Always
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "50052"
            - name: MLFLOW_BASE_URL
              value: http://mlflow.${NAMESPACE}.svc.cluster.local:5000
            - name: PATH_PREFIX
              value: mlflow
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
        - name: plugin-depl-calls-svc
          image: depl-calls-svc:${TAG}
          restartPolicy: Always
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "50053"
            - name: DEPL_CALLS_SVC_KUBECONFIG
              value: ""
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
        - name: plugin-depl-uses-litellm
          image: depl-uses-litellm:${TAG}
          restartPolicy: Always
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "50054"
            - name: DEPL_USES_LITELLM_KUBECONFIG
              value: ""
            - name: DEPL_USES_LITELLM_NAMED_HOSTS
              value: "litellm=http://litellm.${NAMESPACE}:4000"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
        - name: plugin-fluxcd
          image: fluxcd:${TAG}
          restartPolicy: Always
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "50055"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
        - name: plugin-openmetadata
          image: openmetadata:${TAG}
          restartPolicy: Always
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "50056"
            - name: OPENMETADATA_BASE_URL
              value: http://openmetadata.${NAMESPACE}.svc.cluster.local:8585
            - name: OPENMETADATA_ADMIN_EMAIL
              value: admin@open-metadata.org
            - name: OPENMETADATA_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: catalog-secrets
                  key: OPENMETADATA_ADMIN_PASSWORD
            - name: PATH_PREFIX
              value: openmetadata
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      containers:
        - name: catalog
          image: catalog:${TAG}
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "8090"
            - name: KEYCLOAK_BASE_URL
              value: http://keycloak.${NAMESPACE}.svc.cluster.local:8080
            - name: KEYCLOAK_REALM
              value: naira
            - name: KEYCLOAK_ISSUER
              value: http://keycloak.${NAMESPACE}.svc.cluster.local:8080/realms/naira
            - name: PLUGIN_ADDRESSES
              value: "litellm=localhost:50051,mlflow=localhost:50052,depl-calls-svc=localhost:50053,depl-uses-litellm=localhost:50054,fluxcd=localhost:50055,openmetadata=localhost:50056"
          ports:
            - containerPort: 8090
              name: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: catalog
  namespace: ${NAMESPACE}
spec:
  selector:
    app: catalog
  ports:
    - name: http
      port: 8090
      targetPort: http
  type: ClusterIP
