# ── kube-prometheus-stack values for local kind dev environment ───────────────
# Provides: Prometheus Operator, Prometheus, Grafana, kube-state-metrics, node-exporter
# Disabled: Alertmanager, Thanos, Windows Exporter, Prometheus Adapter

# ── Prometheus ──────────────────────────────────────────────────────────────────
prometheus:
  prometheusSpec:
    # Discover ALL ServiceMonitors, not just those with Helm release labels.
    # This lets us add custom ServiceMonitors (e.g. for vLLM) without Helm labels.
    serviceMonitorSelectorNilUsesHelmValues: false

    # How long to keep raw metric data before discarding it.
    retention: 7d

    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 1Gi

    # Persistent volume for metric storage — avoids data loss on pod restart.
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi

  # Prometheus UI reachable only via kubectl port-forward.
  ingress:
    enabled: false

  service:
    type: ClusterIP


# ── Grafana ─────────────────────────────────────────────────────────────────────
# Pre-configured with admin/admin login.
# The chart auto-provisions a datasource pointing to the in-cluster Prometheus.
grafana:
  enabled: true
  adminPassword: admin
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  ingress:
    enabled: false
  service:
    type: ClusterIP

# ── kube-state-metrics ──────────────────────────────────────────────────────────
# Translates Kubernetes API objects state into metrics: deployments, pods, nodes, 
# services, namespaces, etc. Powers dashboards showing "how many pods are running"
# or "what's the deployment status"
kubeStateMetrics:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 100m
      memory: 256Mi

# ── node-exporter ───────────────────────────────────────────────────────────────
# Runs on every node and exposes hardware / OS metrics: CPU usage, memory,
# disk I/O, network traffic, load averages. Gives a node-level view of
# resource utilisation.
nodeExporter:
  enabled: true
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 50m
      memory: 64Mi

# ── Prometheus Operator ─────────────────────────────────────────────────────────
# Watches ServiceMonitor CRDs and translate them into Prometheus configuration.
prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

# ── Disabled ────────────────────────────────────────────────

# Handles alerts fired by Prometheus (e.g. routing to email/Slack/etc.).
alertmanager:
  enabled: false

# Would be needed if we wanted to autoscale deployments based on Prometheus metrics
prometheusAdapter:
  enabled: false

# Long-term, cross-cluster metrics storage and querying.
thanos:
  enabled: false

# Windows node-exporter
windows:
  enabled: false
