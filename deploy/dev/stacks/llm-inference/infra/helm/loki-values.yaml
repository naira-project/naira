# ── Loki values for local kind dev environment ────────────────────────────────
# Single-binary Loki on the local filesystem: one pod, no object storage, no
# caches. Alloy (alloy-values.yaml) pushes pod logs here, and the Grafana that
# ships with kube-prometheus-stack queries it through the "loki" datasource
# (see grafana.additionalDataSources in prometheus-values.yaml).

deploymentMode: SingleBinary

loki:
  # Single tenant; Grafana and Alloy talk to Loki without an X-Scope-OrgID.
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  # Retention is enforced by the compactor, so it must be enabled for
  # retention_period to delete anything.
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
  limits_config:
    retention_period: 72h
  pattern_ingester:
    enabled: false

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# The scalable targets are unused in SingleBinary mode.
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0

# Not needed for a single dev tenant: Grafana and Alloy use the loki Service directly.
gateway:
  enabled: false
chunksCache:
  enabled: false
resultsCache:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
minio:
  enabled: false
