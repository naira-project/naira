# ── Grafana Alloy values for local kind dev environment ───────────────────────
# Tails container logs through the Kubernetes API and pushes them to Loki
# (loki-values.yaml). Reading via the API instead of /var/log on each node lets
# a single Deployment cover the whole cluster, which is enough for kind.
#
# Every stream is labelled with namespace, pod, container and app (the pod's
# `app` label). The UI's "View Logs" link filters on namespace + app, so
# workloads that should be reachable from an Inference Endpoint must set an
# `app` label matching their Service name (as llamacpp.yaml and litellm.yaml do).

controller:
  type: deployment
  replicas: 1

alloy:
  # UI/clustering are not needed for a single replica.
  clustering:
    enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  configMap:
    content: |-
      discovery.kubernetes "pods" {
        role = "pod"
      }

      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app"]
          target_label  = "app"
        }
      }

      loki.source.kubernetes "pods" {
        targets    = discovery.relabel.pods.output
        forward_to = [loki.write.default.receiver]
      }

      loki.write "default" {
        endpoint {
          url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
        }
      }
