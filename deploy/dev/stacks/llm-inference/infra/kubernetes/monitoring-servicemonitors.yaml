# ── ServiceMonitors for Prometheus auto-discovery ────────────────────────────
# Each block tells Prometheus which services to scrape
---
# Selects any service in the 'inference' namespace with a port named 'http'.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: llm-inference
  namespace: monitoring
spec:
  selector: {}
  namespaceSelector:
    matchNames:
      - vllm
      - llamacpp
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s

---
# ── LiteLLM proxy ────────────────────────────────────────────────────────────
# LiteLLM requires the proxy master key as a bearer token on every route,
# including /metrics, so Prometheus needs the same key litellm-secrets holds
# in the litellm namespace. Prometheus Operator only resolves ServiceMonitor
# secret refs from the ServiceMonitor's own namespace, so the token is
# duplicated here in the monitoring namespace — keep it in sync with
# LITELLM_MASTER_KEY in deploy/dev/stacks/llm-inference/infra/kubernetes/litellm.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: litellm-proxy-scrape-token
  namespace: monitoring
type: Opaque
stringData:
  token: sk-local-litellm
---
# LiteLLM also exposes Prometheus metrics at /metrics on its HTTP port.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: litellm-proxy
  namespace: monitoring
spec:
  selector: {}
  namespaceSelector:
    matchNames:
      - litellm
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
      authorization:
        credentials:
          name: litellm-proxy-scrape-token
          key: token
