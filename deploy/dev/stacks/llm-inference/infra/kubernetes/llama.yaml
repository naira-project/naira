# ── llama-server (llama.cpp) inference deployments ──────────────────────────
apiVersion: v1
kind: Namespace
metadata:
  name: inference
---
# ═══════════════════════════════════════════════════════════════════════════════
# Qwen2.5-0.5B
# ═══════════════════════════════════════════════════════════════════════════════
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-qwen25-05b
  namespace: inference
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llama-qwen25-05b
  template:
    metadata:
      labels:
        app: llama-qwen25-05b
    spec:
      enableServiceLinks: false
      containers:
        - name: llama-server
          image: ghcr.io/ggml-org/llama.cpp:server
          args:
            - "-hfr"
            - "Qwen/Qwen2.5-0.5B-Instruct-GGUF"
            - "-hff"
            - "qwen2.5-0.5b-instruct-q4_k_m.gguf"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8080"
            - "--metrics"
            - "--no-ui"
            - "-c"
            - "2048"
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              memory: "512Mi"
              cpu: "300m"
            limits:
              memory: "1Gi"
              cpu: "2"
---
apiVersion: v1
kind: Service
metadata:
  name: llama-qwen25-05b
  namespace: inference
  labels:
    app: llama-qwen25-05b
spec:
  selector:
    app: llama-qwen25-05b
  ports:
    - name: http
      port: 8080
      targetPort: http
  type: ClusterIP
---
# ═══════════════════════════════════════════════════════════════════════════════
# Dummy / Tiny Llama3
# ═══════════════════════════════════════════════════════════════════════════════
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-dummy-model
  namespace: inference
spec:
  replicas: 2
  selector:
    matchLabels:
      app: llama-dummy-model
  template:
    metadata:
      labels:
        app: llama-dummy-model
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      enableServiceLinks: false
      containers:
        - name: llama-server
          image: ghcr.io/ggml-org/llama.cpp:server
          args:
            - "-hf"
            - "tensorblock/tiny-llama3-test-GGUF:Q2_K"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8080"
            - "--metrics"
            - "--no-webui"
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: llama-dummy-model
  namespace: inference
  labels:
    app: llama-dummy-model
spec:
  selector:
    app: llama-dummy-model
  ports:
    - name: http
      port: 8080
      targetPort: http
  type: ClusterIP