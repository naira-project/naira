# ── llama-server (llama.cpp) inference deployments ──────────────────────────
# Each Deployment runs a small GGUF model on CPU with Prometheus metrics
# exposed at /metrics (enabled via --metrics flag).
# ──────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Namespace
metadata:
  name: inference
---
# ═══════════════════════════════════════════════════════════════════════════════
# Qwen2.5-0.5B  — 0.5B parameters, ~350 MB RAM
# ═══════════════════════════════════════════════════════════════════════════════
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-qwen25-0.5b
  namespace: inference
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llama-qwen25-0.5b
  template:
    metadata:
      labels:
        app: llama-qwen25-0.5b
    spec:
      enableServiceLinks: false
      volumes:
        - name: model-storage
          emptyDir: {}
      initContainers:
        - name: download-model
          image: curlimages/curl:latest
          command:
            - sh
            - -c
            - |
              MODEL_FILE="/models/qwen2.5-0.5b-instruct-q4_k_m.gguf"
              if [ ! -f "$MODEL_FILE" ]; then
                echo "Downloading Qwen2.5-0.5B-Instruct Q4_K_M..."
                curl -fSL -o "$MODEL_FILE" \
                  "https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf"
                echo "Download complete."
              else
                echo "Model already present, skipping download."
              fi
          volumeMounts:
            - name: model-storage
              mountPath: /models
      containers:
        - name: llama-server
          image: ghcr.io/ggml-org/llama.cpp:server
          args:
            - -m
            - /models/qwen2.5-0.5b-instruct-q4_k_m.gguf
            - --host
            - "0.0.0.0"
            - --port
            - "8080"
            - --metrics
            - --no-webui
            - -ngl
            - "0"
            - -c
            - "2048"
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: model-storage
              mountPath: /models
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
          resources:
            requests:
              memory: "512Mi"
              cpu: "300m"
            limits:
              memory: "1Gi"
              cpu: "2"
---
apiVersion: v1
kind: Service
metadata:
  name: llama-qwen25-05b
  namespace: inference
spec:
  selector:
    app: llama-qwen25-0.5b
  ports:
    - name: http
      port: 8080
      targetPort: http
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-dummy-model
  namespace: inference
spec:
  replicas: 2
  selector:
    matchLabels:
      app: llama-dummy
  template:
    metadata:
      labels:
        app: llama-dummy
    spec:
      containers:
      - name: llama-server
        image: ghcr.io/ggml-org/llama.cpp:server
        args:
          - "-hf"
          - "tensorblock/tiny-llama3-test-GGUF:Q2_K"
          - "--host"
          - "0.0.0.0"
          - "--port"
          - "8080"
          - "--metrics"
        ports:
        - containerPort: 8080
          name: http-metrics
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: llama-dummy-model
  namespace: inference
spec:
  selector:
    app: llama-dummy
  ports:
    - name: http
      port: 8080
      targetPort: http-metrics
  type: ClusterIP