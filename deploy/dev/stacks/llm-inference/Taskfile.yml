version: '3'

includes:
  postgres:
    taskfile: ./tasks/postgres.yml
    dir: .
  litellm:
    taskfile: ./tasks/litellm.yml
    dir: .
  llama:
    taskfile: ./tasks/llama.yml
    dir: .
  monitoring:
    taskfile: ./tasks/monitoring.yml
    dir: .

tasks:
  deploy:
    desc: Deploy the LLM Inference stack (postgres + litellm + llama + monitoring)
    cmds:
      - task: postgres:deploy
      - task: litellm:deploy
      - task: llama:deploy
      - task: monitoring:deploy

  deploy:litellm:
    desc: Deploy only LiteLLM (postgres + litellm)
    cmds:
      - task: postgres:deploy
      - task: litellm:deploy

  undeploy:
    desc: Remove the full LLM Inference stack from kind
    cmds:
      - task: monitoring:undeploy
      - task: llama:undeploy
      - task: litellm:undeploy
      - task: postgres:undeploy

  undeploy:litellm:
    desc: Remove only LiteLLM and its database
    cmds:
      - task: litellm:undeploy
      - task: postgres:undeploy
