version: '3'

includes:
  litellm-svc:
    taskfile: ./tasks/litellm.yml
    dir: .
  llamacpp:
    taskfile: ./tasks/llamacpp.yml
    dir: .
  monitoring:
    taskfile: ./tasks/monitoring.yml
    dir: .
  vllm:
    taskfile: ./tasks/vllm.yml
    dir: .

tasks:
  deploy:
    desc: Deploy the LLM Inference stack (litellm + llamacpp + monitoring)
    cmds:
      - task: :core:postgres:deploy
      - task: litellm:deploy
      - task: llamacpp:deploy
      - task: monitoring:deploy

  undeploy:
    desc: Remove the full LLM Inference stack from kind
    cmds:
      - task: monitoring:undeploy
      - task: llamacpp:undeploy
      - task: litellm:undeploy

  litellm:deploy:
    desc: Deploy only LiteLLM using the shared PostgreSQL service
    cmds:
      - task: :core:postgres:deploy
      - task: litellm-svc:deploy

  litellm:undeploy:
    desc: Remove only LiteLLM
    cmds:
      - task: litellm-svc:undeploy

  litellm:port-forward:
    desc: Expose LiteLLM on localhost:4000
    cmds:
      - task: litellm-svc:port-forward
