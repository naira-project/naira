version: '3'

includes:
  postgres:
    taskfile: ./tasks/postgres.yml
    dir: .
  litellm:
    taskfile: ./tasks/litellm.yml
    dir: .
  vllm:
    taskfile: ./tasks/vllm.yml
    dir: .
  llama:
    taskfile: ./tasks/llama.yml
    dir: .
  monitoring:
    taskfile: ./tasks/monitoring.yml
    dir: .

tasks:
  default:
    desc: Show available LLM Inference stack tasks
    cmds:
      - task --list

  deploy:
    desc: Deploy the full LLM Inference stack (postgres + litellm + vllm + llama + monitoring)
    cmds:
      - task: postgres:deploy
      - task: litellm:deploy
      - task: vllm:deploy
      - task: llama:deploy
      - task: monitoring:deploy

  deploy:litellm:
    desc: Deploy only LiteLLM (postgres + litellm)
    cmds:
      - task: postgres:deploy
      - task: litellm:deploy

  deploy:vllm:
    desc: Deploy only vLLM inference services
    cmds:
      - task: vllm:deploy

  deploy:llama:
    desc: Deploy only llama.cpp inference services
    cmds:
      - task: llama:deploy

  undeploy:
    desc: Remove the full LLM Inference stack from kind
    cmds:
      - task: monitoring:undeploy
      - task: llama:undeploy
      - task: vllm:undeploy
      - task: litellm:undeploy
      - task: postgres:undeploy

  undeploy:litellm:
    desc: Remove only LiteLLM and its database
    cmds:
      - task: litellm:undeploy
      - task: postgres:undeploy

  undeploy:vllm:
    desc: Remove only vLLM inference services
    cmds:
      - task: vllm:undeploy

  undeploy:llama:
    desc: Remove only llama.cpp inference services
    cmds:
      - task: llama:undeploy
