version: '3'

vars:
  CLUSTER_NAME: naira-idp
  PLUGINS_BASE: ../../../../plugins/cmd
  PLUGINS:
    - name: mlflow
      dir: '{{.PLUGINS_BASE}}/mlflow'
      image: mlflow:local
    - name: litellm
      dir: '{{.PLUGINS_BASE}}/litellm'
      image: litellm:local
    - name: openai-api-models
      dir: '{{.PLUGINS_BASE}}/openai_api_models'
      image: openai-api-models:local
    - name: depl-calls-svc
      dir: '{{.PLUGINS_BASE}}/depl_calls_svc'
      image: depl-calls-svc:local
    - name: depl-uses-litellm
      dir: '{{.PLUGINS_BASE}}/depl_uses_litellm'
      image: depl-uses-litellm:local
    - name: fluxcd
      dir: '{{.PLUGINS_BASE}}/fluxcd'
      image: fluxcd:local
    - name: openmetadata
      dir: '{{.PLUGINS_BASE}}/openmetadata'
      image: openmetadata:local

tasks:
  image:build:
    internal: true
    desc: Build all catalog plugin images
    cmds:
      - for: { var: PLUGINS }
        task: :docker:build
        vars: { IMAGE: '{{.ITEM.image}}', DIR: '{{.ITEM.dir}}' }

  image:load:
    internal: true
    desc: Load all catalog plugin images into kind
    deps: [image:build]
    cmds:
      - for: { var: PLUGINS }
        task: :docker:load
        vars: { IMAGE: '{{.ITEM.image}}', CLUSTER_NAME: '{{.CLUSTER_NAME}}' }