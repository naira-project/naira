apiVersion: v1
kind: Namespace
metadata:
  name: idp-system
---
apiVersion: v1
kind: Secret
metadata:
  name: catalog-secrets
  namespace: idp-system
type: Opaque
stringData:
  LITELLM_API_KEY: sk-local-litellm
  OPENMETADATA_ADMIN_PASSWORD: admin
---
# The tech radar is rendered read-only from this admin-managed config.
# Schema reference: plugins/cmd/tech_radar/README.md; annotated example kept
# valid by the plugin's unit tests: plugins/cmd/tech_radar/sample_config.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: tech-radar-config
  namespace: idp-system
data:
  radar.yaml: |
    schema_version: 1            # required; only 1 accepted
    radar:
      id: naira                  # optional, default "default"
      title: Naira Tech Radar    # required
      edition: 2026-09           # required; free-form edition label
      owner: platform-team       # required
    quadrants:                   # required; exactly 4; order = display order
      - id: models
        name: Models
      - id: agentic
        name: Agentic Patterns
      - id: knowledge
        name: Knowledge Techniques
      - id: others
        name: Others
    rings:                       # required; 1-6; order = innermost to outermost
      - id: adopt
        name: Adopt
        description: Proven; default choice for new work.
      - id: trial
        name: Trial
        description: Worth pursuing on projects that can absorb risk.
      - id: assess
        name: Assess
        description: Explore to understand impact.
      - id: hold
        name: Hold
        description: Do not start new work with this.
    entries:
      # --- Models ---
      - id: claude-sonnet
        name: Claude Sonnet
        quadrant: models         # must match a quadrant id
        ring: adopt              # must match a ring id
        moved: in                # in | out | none; default none
        owner: ml-platform
        rationale: >
          Default general-purpose model; served through the central gateway.
      - id: claude-haiku
        name: Claude Haiku
        quadrant: models
        ring: adopt
        owner: ml-platform
        rationale: >
          Fast, low-cost model for classification, routing, and high-volume tasks.
      - id: gpt-5
        name: GPT-5
        quadrant: models
        ring: trial
        moved: in
        owner: ml-platform
        rationale: >
          Evaluated as secondary frontier model for coding-heavy workloads.
      - id: gemini-2-5-pro
        name: Gemini 2.5 Pro
        quadrant: models
        ring: trial
        owner: ml-platform
        rationale: >
          Strong long-context and multimodal capabilities; trialing for document analysis.
      - id: llama-4
        name: Llama 4
        quadrant: models
        ring: assess
        owner: ml-platform
        rationale: >
          Open-weight option for on-prem and data-sensitive workloads; assessing quality gap.
      - id: qwen-3
        name: Qwen 3
        quadrant: models
        ring: assess
        moved: in
        owner: ml-platform
        rationale: >
          Competitive open-weight family, strong multilingual support; assessing licensing fit.
      - id: gpt-3-5-turbo
        name: GPT-3.5 Turbo
        quadrant: models
        ring: hold
        moved: out
        owner: ml-platform
        rationale: >
          Legacy model; migrate remaining integrations to current-generation models.
      # --- Agentic Patterns ---
      - id: mcp
        name: Model Context Protocol
        quadrant: agentic
        ring: adopt
        moved: in
        owner: ai-board
        rationale: >
          De-facto standard for connecting models to tools and data; default integration path.
      - id: tool-calling
        name: Structured Tool Calling
        quadrant: agentic
        ring: adopt
        owner: ai-board
        rationale: >
          Schema-validated function calling is the baseline for all model-to-system integration.
      - id: react-agents
        name: ReAct Agents
        quadrant: agentic
        ring: trial
        owner: ai-board
        rationale: >
          Promising for tool-using workflows; evaluate on internal projects first.
      - id: plan-and-execute
        name: Plan-and-Execute Agents
        quadrant: agentic
        ring: trial
        owner: ai-board
        rationale: >
          Separating planning from execution improves reliability on long-horizon tasks.
      - id: multi-agent-orchestration
        name: Multi-Agent Orchestration
        quadrant: agentic
        ring: assess
        moved: in
        owner: ai-board
        rationale: >
          Subagent fan-out shows promise for review and research tasks; cost and debuggability unclear.
      - id: computer-use
        name: Computer-Use Agents
        quadrant: agentic
        ring: assess
        owner: ai-board
        rationale: >
          Browser and desktop automation via vision; assessing sandboxing and reliability.
      - id: unsupervised-autonomy
        name: Unsupervised Autonomous Agents
        quadrant: agentic
        ring: hold
        owner: ai-board
        rationale: >
          Agents without human checkpoints or budget limits; too risky for production today.
      # --- Knowledge Techniques ---
      - id: hybrid-retrieval
        name: Hybrid Retrieval
        quadrant: knowledge
        ring: trial
        moved: in
        owner: ai-board
        rationale: >
          Combines dense and sparse retrieval; measurable answer-quality gains in pilots.
      - id: reranking
        name: Cross-Encoder Reranking
        quadrant: knowledge
        ring: adopt
        owner: ai-board
        rationale: >
          Cheap precision boost on top of any retriever; standard part of the RAG pipeline.
      - id: graph-rag
        name: GraphRAG
        quadrant: knowledge
        ring: assess
        owner: ai-board
        rationale: >
          Knowledge-graph-backed retrieval for multi-hop questions; indexing cost is high.
      - id: semantic-chunking
        name: Semantic Chunking
        quadrant: knowledge
        ring: trial
        owner: ai-board
        rationale: >
          Structure-aware chunking outperforms fixed-size splitting on internal corpora.
      - id: agentic-retrieval
        name: Agentic Retrieval
        quadrant: knowledge
        ring: assess
        moved: in
        owner: ai-board
        rationale: >
          Letting the model iteratively search and refine queries; latency and cost under review.
      - id: prompt-caching
        name: Prompt Caching
        quadrant: knowledge
        ring: adopt
        moved: in
        owner: ml-platform
        rationale: >
          Large latency and cost wins for repeated context; enabled by default at the gateway.
      - id: naive-rag
        name: Naive RAG
        quadrant: knowledge
        ring: hold
        moved: out
        owner: ai-board
        rationale: >
          Superseded by hybrid retrieval; migrate existing pipelines.
      # --- Others ---
      - id: litellm
        name: LiteLLM Gateway
        quadrant: others
        ring: adopt
        owner: platform-team
        rationale: >
          Central model gateway for routing, quotas, and key management across providers.
      - id: vllm
        name: vLLM
        quadrant: others
        ring: adopt
        owner: platform-team
        rationale: >
          Default serving engine for self-hosted open-weight models on GPU nodes.
      - id: mlflow
        name: MLflow
        quadrant: others
        ring: adopt
        owner: platform-team
        rationale: >
          Established tracking and model registry; integrated into the catalog.
      - id: langfuse
        name: Langfuse
        quadrant: others
        ring: trial
        moved: in
        owner: platform-team
        rationale: >
          LLM observability with traces and evals; trialing as the standard tracing backend.
      - id: kserve
        name: KServe
        quadrant: others
        ring: assess
        owner: platform-team
        rationale: >
          Kubernetes-native inference platform; assessing overlap with the vLLM setup.
      - id: otel-genai
        name: OpenTelemetry GenAI Conventions
        quadrant: others
        ring: trial
        owner: platform-team
        rationale: >
          Vendor-neutral semantic conventions for LLM telemetry; aligns with existing OTel stack.
      - id: langchain
        name: LangChain
        quadrant: others
        ring: hold
        moved: out
        owner: ai-board
        rationale: >
          Abstraction overhead outweighs benefits; prefer direct SDKs plus MCP.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: catalog
  namespace: idp-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: catalog-appidentities
rules:
  - apiGroups: ["naira.io"]
    resources: ["appidentities"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: plugin-depl-calls-svc
rules:
  - apiGroups: [""]
    resources: ["namespaces", "services"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: plugin-depl-uses-litellm
rules:
  - apiGroups: [""]
    resources: ["namespaces", "secrets"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: plugin-fluxcd
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
  - apiGroups: ["kustomize.toolkit.fluxcd.io"]
    resources: ["kustomizations"]
    verbs: ["get", "list"]
  - apiGroups: ["helm.toolkit.fluxcd.io"]
    resources: ["helmreleases"]
    verbs: ["get", "list"]
  - apiGroups: ["source.toolkit.fluxcd.io"]
    resources: ["gitrepositories"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: plugin-depl-calls-svc
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: plugin-depl-calls-svc
subjects:
  - kind: ServiceAccount
    name: catalog
    namespace: idp-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: plugin-depl-uses-litellm
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: plugin-depl-uses-litellm
subjects:
  - kind: ServiceAccount
    name: catalog
    namespace: idp-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: catalog-appidentities
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: catalog-appidentities
subjects:
  - kind: ServiceAccount
    name: catalog
    namespace: idp-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: plugin-fluxcd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: plugin-fluxcd
subjects:
  - kind: ServiceAccount
    name: catalog
    namespace: idp-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: catalog-plugin-config
  namespace: idp-system
data:
  plugins.yaml: |
    plugins:
      litellm:
        address: localhost:50051
        schedule: "0 0 * * *"
      mlflow:
        address: localhost:50052
        schedule: "0 0 * * *"
      depl-calls-svc:
        address: localhost:50053
        schedule: "0 * * * *"
      depl-uses-litellm:
        address: localhost:50054
        schedule: "0 * * * *"
      fluxcd:
        address: localhost:50055
        schedule: "*/1 * * * *"
      openmetadata:
        address: localhost:50056
      tech-radar:
        address: localhost:50057
      mcp-servers:
        address: localhost:50058
      openai-api-models:
        address: localhost:50059
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: idp-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog
  template:
    metadata:
      labels:
        app: catalog
    spec:
      serviceAccountName: catalog
      initContainers:
        - name: plugin-litellm
          image: litellm:local
          restartPolicy: Always
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "50051"
            - name: LITELLM_BASE_URL
              value: http://litellm.litellm.svc.cluster.local:4000
            - name: LITELLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: catalog-secrets
                  key: LITELLM_API_KEY
            - name: PATH_PREFIX
              value: litellm
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
        - name: plugin-mlflow
          image: mlflow:local
          restartPolicy: Always
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "50052"
            - name: MLFLOW_BASE_URL
              value: http://mlflow.mlflow.svc.cluster.local:5000
            - name: PATH_PREFIX
              value: mlflow
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
        - name: plugin-depl-calls-svc
          image: depl-calls-svc:local
          restartPolicy: Always
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "50053"
            - name: DEPL_CALLS_SVC_KUBECONFIG
              value: ""
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
        - name: plugin-depl-uses-litellm
          image: depl-uses-litellm:local
          restartPolicy: Always
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "50054"
            - name: DEPL_USES_LITELLM_KUBECONFIG
              value: ""
            - name: DEPL_USES_LITELLM_NAMED_HOSTS
              value: "litellm=http://litellm.litellm:4000"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
        - name: plugin-fluxcd
          image: fluxcd:local
          restartPolicy: Always
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "50055"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
        - name: plugin-openmetadata
          image: openmetadata:local
          restartPolicy: Always
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "50056"
            - name: OPENMETADATA_BASE_URL
              value: http://openmetadata.openmetadata.svc.cluster.local:8585
            - name: OPENMETADATA_ADMIN_EMAIL
              value: admin@open-metadata.org
            - name: OPENMETADATA_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: catalog-secrets
                  key: OPENMETADATA_ADMIN_PASSWORD
            - name: PATH_PREFIX
              value: openmetadata
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
        - name: plugin-mcp-servers
          image: mcp-servers:local
          restartPolicy: Always
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "50058"
            - name: MCP_ENDPOINTS
              value: mock-knowledge-base=http://mcp-mock.mcp-mock.svc.cluster.local:8080/mcp
            - name: PATH_PREFIX
              value: mcp
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
        - name: plugin-tech-radar
          image: tech-radar:local
          restartPolicy: Always
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "50057"
            - name: TECH_RADAR_CONFIG_PATH
              value: /etc/naira/techradar/radar.yaml
          # Mounted as a directory (no subPath) so ConfigMap updates reach the
          # running pod and take effect on the next plugin sync.
          volumeMounts:
            - name: tech-radar-config
              mountPath: /etc/naira/techradar
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
        - name: plugin-openai-api-models
          image: openai-api-models:local
          restartPolicy: Always
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "50059"
            - name: OPENAI_API_MODELS_BASE_URL
              value: http://litellm.litellm.svc.cluster.local:4000
            - name: PATH_PREFIX
              value: openai_litellm
            - name: OPENAI_API_MODELS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: catalog-secrets
                  key: LITELLM_API_KEY
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      containers:
        - name: catalog
          image: catalog:local
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: plugin-config
              mountPath: /etc/catalog/plugins.yaml
              subPath: plugins.yaml
              readOnly: true
          env:
            - name: PORT
              value: "8090"
            - name: KEYCLOAK_BASE_URL
              value: http://keycloak.keycloak.svc.cluster.local:8080
            - name: KEYCLOAK_REALM
              value: naira
            - name: KEYCLOAK_ISSUER
              value: http://localhost:8080/realms/naira
          ports:
            - containerPort: 8090
              name: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: plugin-config
          configMap:
            name: catalog-plugin-config
        - name: tech-radar-config
          configMap:
            name: tech-radar-config
---
apiVersion: v1
kind: Service
metadata:
  name: catalog
  namespace: idp-system
spec:
  selector:
    app: catalog
  ports:
    - name: http
      port: 8090
      targetPort: http
  type: ClusterIP
