apiVersion: v1
kind: Namespace
metadata:
  name: idp-system
---
apiVersion: v1
kind: Secret
metadata:
  name: catalog-secrets
  namespace: idp-system
type: Opaque
stringData:
  LITELLM_API_KEY: sk-local-litellm
  OPENMETADATA_ADMIN_PASSWORD: admin
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: catalog
  namespace: idp-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: catalog-appidentities
rules:
  - apiGroups: ["naira.io"]
    resources: ["appidentities"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: plugin-depl-calls-svc
rules:
  - apiGroups: [""]
    resources: ["namespaces", "services"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: plugin-depl-uses-litellm
rules:
  - apiGroups: [""]
    resources: ["namespaces", "secrets"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: plugin-fluxcd
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
  - apiGroups: ["kustomize.toolkit.fluxcd.io"]
    resources: ["kustomizations"]
    verbs: ["get", "list"]
  - apiGroups: ["helm.toolkit.fluxcd.io"]
    resources: ["helmreleases"]
    verbs: ["get", "list"]
  - apiGroups: ["source.toolkit.fluxcd.io"]
    resources: ["gitrepositories"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: plugin-depl-calls-svc
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: plugin-depl-calls-svc
subjects:
  - kind: ServiceAccount
    name: catalog
    namespace: idp-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: plugin-depl-uses-litellm
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: plugin-depl-uses-litellm
subjects:
  - kind: ServiceAccount
    name: catalog
    namespace: idp-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: catalog-appidentities
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: catalog-appidentities
subjects:
  - kind: ServiceAccount
    name: catalog
    namespace: idp-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: plugin-fluxcd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: plugin-fluxcd
subjects:
  - kind: ServiceAccount
    name: catalog
    namespace: idp-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: idp-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog
  template:
    metadata:
      labels:
        app: catalog
    spec:
      serviceAccountName: catalog
      initContainers:
        - name: plugin-litellm
          image: litellm:local
          restartPolicy: Always
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "50051"
            - name: LITELLM_BASE_URL
              value: http://litellm.litellm.svc.cluster.local:4000
            - name: LITELLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: catalog-secrets
                  key: LITELLM_API_KEY
            - name: PATH_PREFIX
              value: litellm
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
        - name: plugin-mlflow
          image: mlflow:local
          restartPolicy: Always
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "50052"
            - name: MLFLOW_BASE_URL
              value: http://mlflow.mlflow.svc.cluster.local:5000
            - name: PATH_PREFIX
              value: mlflow
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
        - name: plugin-depl-calls-svc
          image: depl-calls-svc:local
          restartPolicy: Always
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "50053"
            - name: DEPL_CALLS_SVC_KUBECONFIG
              value: ""
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
        - name: plugin-depl-uses-litellm
          image: depl-uses-litellm:local
          restartPolicy: Always
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "50054"
            - name: DEPL_USES_LITELLM_KUBECONFIG
              value: ""
            - name: DEPL_USES_LITELLM_NAMED_HOSTS
              value: "litellm=http://litellm.litellm:4000"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
        - name: plugin-fluxcd
          image: fluxcd:local
          restartPolicy: Always
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "50055"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
        - name: plugin-openmetadata
          image: openmetadata:local
          restartPolicy: Always
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "50056"
            - name: OPENMETADATA_BASE_URL
              value: http://openmetadata.openmetadata.svc.cluster.local:8585
            - name: OPENMETADATA_ADMIN_EMAIL
              value: admin@open-metadata.org
            - name: OPENMETADATA_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: catalog-secrets
                  key: OPENMETADATA_ADMIN_PASSWORD
            - name: PATH_PREFIX
              value: openmetadata
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
        - name: plugin-github
          image: github:local
          restartPolicy: Always
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "50057"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
        - name: plugin-depl-from-repo
          image: depl-from-repo:local
          restartPolicy: Always
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "50058"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
        - name: plugin-github2
          image: github:local
          restartPolicy: Always
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "50059"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
        - name: plugin-github3
          image: github:local
          restartPolicy: Always
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "50060"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
        - name: plugin-github4
          image: github:local
          restartPolicy: Always
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "50061"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      containers:
        - name: catalog
          image: catalog:local
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "8090"
            - name: KEYCLOAK_BASE_URL
              value: http://keycloak.keycloak.svc.cluster.local:8080
            # KEYCLOAK_REALM variable must be changed in tasks/keycloak.yml
            - name: KEYCLOAK_REALM
              value: naira
            - name: KEYCLOAK_ISSUER
              value: http://localhost:8080/realms/naira
            - name: PLUGIN_ADDRESSES
              value: "litellm=localhost:50051,mlflow=localhost:50052,depl-calls-svc=localhost:50053,depl-uses-litellm=localhost:50054,fluxcd=localhost:50055,openmetadata=localhost:50056,github=localhost:50057,depl-from-repo=localhost:50058"
          ports:
            - containerPort: 8090
              name: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: catalog
  namespace: idp-system
spec:
  selector:
    app: catalog
  ports:
    - name: http
      port: 8090
      targetPort: http
  type: ClusterIP