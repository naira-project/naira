apiVersion: v1
kind: Namespace
metadata:
  name: idp-system
---
apiVersion: v1
kind: Secret
metadata:
  name: catalog-secrets
  namespace: idp-system
type: Opaque
stringData:
  LITELLM_API_KEY: sk-local-litellm
  OPENMETADATA_ADMIN_PASSWORD: admin
---
# The tech radar is rendered read-only from this admin-managed config.
# Schema reference: plugins/cmd/tech_radar/README.md; annotated example kept
# valid by the plugin's unit tests: plugins/cmd/tech_radar/sample_config.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: tech-radar-config
  namespace: idp-system
data:
  radar.yaml: |
    schema_version: 1            # required; only 1 accepted
    radar:
      id: naira                  # optional, default "default"
      title: Naira Tech Radar    # required
      edition: 2026-09           # required; free-form edition label
      owner: platform-team       # required
    quadrants:                   # required; exactly 4; order = display order
      - id: models
        name: Models
      - id: agentic
        name: Agentic Patterns
      - id: knowledge
        name: Knowledge Techniques
      - id: others
        name: Others
    rings:                       # required; 1-6; order = innermost to outermost
      - id: adopt
        name: Adopt
        description: Proven; default choice for new work.
      - id: trial
        name: Trial
        description: Worth pursuing on projects that can absorb risk.
      - id: assess
        name: Assess
        description: Explore to understand impact.
      - id: hold
        name: Hold
        description: Do not start new work with this.
    entries:
      - id: claude-sonnet
        name: Claude Sonnet
        quadrant: models         # must match a quadrant id
        ring: adopt              # must match a ring id
        moved: in                # in | out | none; default none
        owner: ml-platform
        rationale: >
          Default general-purpose model; served through the central gateway.
      - id: react-agents
        name: ReAct Agents
        quadrant: agentic
        ring: trial
        owner: ai-board
        rationale: >
          Promising for tool-using workflows; evaluate on internal projects first.
      - id: hybrid-retrieval
        name: Hybrid Retrieval
        quadrant: knowledge
        ring: assess
        moved: in
        owner: ai-board
        rationale: >
          Combines dense and sparse retrieval; explore impact on answer quality.
      - id: naive-rag
        name: Naive RAG
        quadrant: knowledge
        ring: hold
        moved: out
        owner: ai-board
        rationale: >
          Superseded by hybrid retrieval; migrate existing pipelines.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: catalog
  namespace: idp-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: catalog-appidentities
rules:
  - apiGroups: ["naira.io"]
    resources: ["appidentities"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: plugin-depl-calls-svc
rules:
  - apiGroups: [""]
    resources: ["namespaces", "services"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: plugin-depl-uses-litellm
rules:
  - apiGroups: [""]
    resources: ["namespaces", "secrets"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: plugin-fluxcd
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
  - apiGroups: ["kustomize.toolkit.fluxcd.io"]
    resources: ["kustomizations"]
    verbs: ["get", "list"]
  - apiGroups: ["helm.toolkit.fluxcd.io"]
    resources: ["helmreleases"]
    verbs: ["get", "list"]
  - apiGroups: ["source.toolkit.fluxcd.io"]
    resources: ["gitrepositories"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: plugin-depl-calls-svc
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: plugin-depl-calls-svc
subjects:
  - kind: ServiceAccount
    name: catalog
    namespace: idp-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: plugin-depl-uses-litellm
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: plugin-depl-uses-litellm
subjects:
  - kind: ServiceAccount
    name: catalog
    namespace: idp-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: catalog-appidentities
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: catalog-appidentities
subjects:
  - kind: ServiceAccount
    name: catalog
    namespace: idp-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: plugin-fluxcd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: plugin-fluxcd
subjects:
  - kind: ServiceAccount
    name: catalog
    namespace: idp-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: idp-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog
  template:
    metadata:
      labels:
        app: catalog
    spec:
      serviceAccountName: catalog
      initContainers:
        - name: plugin-litellm
          image: litellm:local
          restartPolicy: Always
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "50051"
            - name: LITELLM_BASE_URL
              value: http://litellm.litellm.svc.cluster.local:4000
            - name: LITELLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: catalog-secrets
                  key: LITELLM_API_KEY
            - name: PATH_PREFIX
              value: litellm
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
        - name: plugin-mlflow
          image: mlflow:local
          restartPolicy: Always
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "50052"
            - name: MLFLOW_BASE_URL
              value: http://mlflow.mlflow.svc.cluster.local:5000
            - name: PATH_PREFIX
              value: mlflow
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
        - name: plugin-depl-calls-svc
          image: depl-calls-svc:local
          restartPolicy: Always
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "50053"
            - name: DEPL_CALLS_SVC_KUBECONFIG
              value: ""
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
        - name: plugin-depl-uses-litellm
          image: depl-uses-litellm:local
          restartPolicy: Always
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "50054"
            - name: DEPL_USES_LITELLM_KUBECONFIG
              value: ""
            - name: DEPL_USES_LITELLM_NAMED_HOSTS
              value: "litellm=http://litellm.litellm:4000"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
        - name: plugin-fluxcd
          image: fluxcd:local
          restartPolicy: Always
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "50055"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
        - name: plugin-openmetadata
          image: openmetadata:local
          restartPolicy: Always
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "50056"
            - name: OPENMETADATA_BASE_URL
              value: http://openmetadata.openmetadata.svc.cluster.local:8585
            - name: OPENMETADATA_ADMIN_EMAIL
              value: admin@open-metadata.org
            - name: OPENMETADATA_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: catalog-secrets
                  key: OPENMETADATA_ADMIN_PASSWORD
            - name: PATH_PREFIX
              value: openmetadata
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
        - name: plugin-mcp-servers
          image: mcp-servers:local
          restartPolicy: Always
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "50058"
            - name: MCP_ENDPOINTS
              value: mock-knowledge-base=http://mcp-mock.mcp-mock.svc.cluster.local:8080/mcp
            - name: PATH_PREFIX
              value: mcp
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
        - name: plugin-tech-radar
          image: tech-radar:local
          restartPolicy: Always
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "50057"
            - name: TECH_RADAR_CONFIG_PATH
              value: /etc/naira/techradar/radar.yaml
          # Mounted as a directory (no subPath) so ConfigMap updates reach the
          # running pod and take effect on the next plugin sync.
          volumeMounts:
            - name: tech-radar-config
              mountPath: /etc/naira/techradar
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: tech-radar-config
          configMap:
            name: tech-radar-config
      containers:
        - name: catalog
          image: catalog:local
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "8090"
            - name: KEYCLOAK_BASE_URL
              value: http://keycloak.keycloak.svc.cluster.local:8080
            - name: KEYCLOAK_REALM
              value: naira
            - name: KEYCLOAK_ISSUER
              value: http://localhost:8080/realms/naira
            - name: PLUGIN_ADDRESSES
              value: "litellm=localhost:50051,mlflow=localhost:50052,depl-calls-svc=localhost:50053,depl-uses-litellm=localhost:50054,fluxcd=localhost:50055,openmetadata=localhost:50056,tech-radar=localhost:50057,mcp-servers=localhost:50058"
          ports:
            - containerPort: 8090
              name: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: catalog
  namespace: idp-system
spec:
  selector:
    app: catalog
  ports:
    - name: http
      port: 8090
      targetPort: http
  type: ClusterIP