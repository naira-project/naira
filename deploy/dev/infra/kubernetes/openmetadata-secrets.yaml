# https://docs.open-metadata.org/v1.12.x/quick-start/local-kubernetes-deployment
# Create the namespace and the kubernetes secrets that contain the MySQL and Airflow passwords.
apiVersion: v1
kind: Namespace
metadata:
  name: openmetadata
---
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secrets
  namespace: openmetadata
type: Opaque
stringData:
  openmetadata-mysql-password: openmetadata_password
---
apiVersion: v1
kind: Secret
metadata:
  name: airflow-secrets
  namespace: openmetadata
type: Opaque
stringData:
  openmetadata-airflow-password: admin
