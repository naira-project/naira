apiVersion: ui.platform-mesh.io/v1alpha1
kind: ContentConfiguration
metadata:
  name: naira-catalog
  labels:
    ui.platform-mesh.io/entity: core_platform-mesh_io_account
spec:
  inlineConfiguration:
    contentType: json
    content: |-
      {
        "name": "naira",
        "luigiConfigFragment": {
          "data": {
            "nodes": [
              {
                "pathSegment": "dashboard-naira",
