                "loadingIndicator": { "enabled": false },
                "children": [
                  {
                    "pathSegment": ":id",
                    "label": "Model Details",
                    "entityType": "main.core_platform-mesh_io_account",
                    "hideFromNav": true,
                    "url": "https://ui.portal.localhost:8443/index.html/#/model-registry/:id",
                    "loadingIndicator": { "enabled": false }
