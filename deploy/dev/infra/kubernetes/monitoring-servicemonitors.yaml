# ── ServiceMonitors for Prometheus auto-discovery ────────────────────────────
# Each block tells Prometheus which services to scrape and how to label the data.
#
# Design principle: no custom label conventions.  We select by namespace + port
# name only, so this works with any existing Kubernetes service.

---
# ── vLLM inference engine ────────────────────────────────────────────────────
# vLLM exposes Prometheus metrics natively at GET /metrics on the API port.
# Selects any service in the 'inference' namespace with a port named 'http'.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: vllm-inference
  namespace: monitoring
spec:
  # No matchLabels — we don't impose labeling conventions
  namespaceSelector:
    matchNames:
      - inference
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
      relabelings:
        # Attach the deployment name as a Prometheus label for easier querying
        - sourceLabels: [__meta_kubernetes_pod_label_app]
          targetLabel: deployment
          action: replace

---
# ── LiteLLM proxy ────────────────────────────────────────────────────────────
# LiteLLM also exposes Prometheus metrics at /metrics on its HTTP port.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: litellm-proxy
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames:
      - litellm
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
