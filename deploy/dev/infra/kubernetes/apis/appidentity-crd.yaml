apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: appidentities.naira.io
spec:
  group: naira.io
  names:
    kind: AppIdentity
    plural: appidentities
    singular: appidentity
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                team:
                  type: string
                litellmVirtualKey:
                  type: string
