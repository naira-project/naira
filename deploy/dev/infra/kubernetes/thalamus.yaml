apiVersion: v1
kind: Namespace
metadata:
  name: thalamus
---
apiVersion: thalamus.cloud/v1alpha1
kind: Model
metadata:
  name: gemma-4-26b-a4b-it
  namespace: thalamus
spec:
  serving:
    engine:
      image: vllm/vllm-openai:v0.9.0
      args:
        - "--max-model-len=8192"
        - "--tensor-parallel-size=2"
      resources:
        requests:
          nvidia.com/gpu: "2"
        limits:
          nvidia.com/gpu: "2"
    epp:
      image: us-central1-docker.pkg.dev/k8s-staging-images/llm-d/epp:v0.3.0
  weights:
    type: hf
    hf:
      repoId: google/gemma-4-26B-A4B-it
      tokenSecret:
        name: hf-token
        key: token
  scheduling:
    nodeSelector:
      cloud.google.com/gke-accelerator: nvidia-h100-80gb
