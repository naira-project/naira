apiVersion: v1
kind: Namespace
metadata:
  name: inference
---
# ── Chat template for opt-125m (base model, no default chat template) ───────
apiVersion: v1
kind: ConfigMap
metadata:
  name: vllm-chat-template
  namespace: inference
data:
  chat-template.jinja: |
    {% for message in messages %}
    {% if message['role'] == 'system' %}System: {{ message['content'] }}
    {% elif message['role'] == 'user' %}User: {{ message['content'] }}
    {% elif message['role'] == 'assistant' %}Assistant: {{ message['content'] }}
    {% endif %}
    {% endfor %}
    Assistant:
---
# ── vLLM serving facebook/opt-125m (125M params, CPU-friendly) ──────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-opt125m
  namespace: inference
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-opt125m
  template:
    metadata:
      labels:
        app: vllm-opt125m
        naira.io/inference: "true"
        naira.io/model: "opt-125m"
    spec:
      enableServiceLinks: false
      volumes:
      - name: chat-template
        configMap:
          name: vllm-chat-template
      containers:
      - name: vllm
        image: vllm/vllm-openai-cpu:latest-arm64
        args:
        - facebook/opt-125m
        - --served-model-name
        - opt-125m
        - --chat-template
        - /etc/vllm/chat-template.jinja
        env:
        - name: VLLM_CPU_KVCACHE_SPACE
          value: "1"
        ports:
        - containerPort: 8000
          name: http
        volumeMounts:
        - name: chat-template
          mountPath: /etc/vllm/chat-template.jinja
          subPath: chat-template.jinja
          readOnly: true
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 60
          periodSeconds: 15
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 120
          periodSeconds: 30
          timeoutSeconds: 10
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "4Gi"
            cpu: "1"
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-opt125m
  namespace: inference
  labels:
    naira.io/inference: "true"
    naira.io/model: "opt-125m"
spec:
  selector:
    app: vllm-opt125m
  ports:
  - name: http
    port: 8001
    targetPort: http
  type: ClusterIP
