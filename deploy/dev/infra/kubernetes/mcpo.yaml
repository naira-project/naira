apiVersion: v1
kind: Namespace
metadata:
  name: idp-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mcpo-config
  namespace: idp-system
data:
  config.json: |
    {
      "mcpServers": {
        "naira-catalog": {
          "type": "streamablehttp",
          "url": "http://catalog.idp-system.svc.cluster.local:8090/mcp"
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcpo
  namespace: idp-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcpo
  template:
    metadata:
      labels:
        app: mcpo
    spec:
      containers:
        - name: mcpo
          image: ghcr.io/open-webui/mcpo:main
          imagePullPolicy: IfNotPresent
          args:
            - --config
            - /config/config.json
            - --port
            - "8000"
          ports:
            - containerPort: 8000
              name: http
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: config
          configMap:
            name: mcpo-config
---
apiVersion: v1
kind: Service
metadata:
  name: mcpo
  namespace: idp-system
spec:
  selector:
    app: mcpo
  ports:
    - name: http
      port: 8000
      targetPort: http
  type: ClusterIP
