apiVersion: v1
kind: Namespace
metadata:
  name: idp-system
---
apiVersion: v1
kind: Secret
metadata:
  name: data-catalog-secrets
  namespace: idp-system
type: Opaque
stringData:
  OPENMETADATA_PASSWORD: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-catalog
  namespace: idp-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: data-catalog
  template:
    metadata:
      labels:
        app: data-catalog
    spec:
      containers:
        - name: data-catalog
          image: data-catalog:local
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "8081"
            - name: OPENMETADATA_BASE_URL
              value: http://openmetadata.openmetadata.svc.cluster.local:8585
            - name: OPENMETADATA_USERNAME
              value: "admin@open-metadata.org"
            - name: OPENMETADATA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: data-catalog-secrets
                  key: OPENMETADATA_PASSWORD
          ports:
            - containerPort: 8081
              name: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: data-catalog
  namespace: idp-system
spec:
  selector:
    app: data-catalog
  ports:
    - name: http
      port: 8081
      targetPort: http
  type: ClusterIP
