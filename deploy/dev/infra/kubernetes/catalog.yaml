apiVersion: v1
kind: Namespace
metadata:
  name: idp-system
---
apiVersion: v1
kind: Secret
metadata:
  name: catalog-secrets
  namespace: idp-system
type: Opaque
stringData:
  LITELLM_API_KEY: sk-local-litellm
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: catalog
  namespace: idp-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: catalog-appidentities
rules:
  - apiGroups: ["naira.io"]
    resources: ["appidentities"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: catalog-appidentities
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: catalog-appidentities
subjects:
  - kind: ServiceAccount
    name: catalog
    namespace: idp-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: idp-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog
  template:
    metadata:
      labels:
        app: catalog
    spec:
      serviceAccountName: catalog
      containers:
        - name: catalog
          image: catalog:local
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "8090"
            - name: MLFLOW_BASE_URL
              value: http://mlflow.mlflow.svc.cluster.local:5000
            - name: LITELLM_BASE_URL
              value: http://litellm.litellm.svc.cluster.local:4000
            - name: LITELLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: catalog-secrets
                  key: LITELLM_API_KEY
            - name: KEYCLOAK_BASE_URL
              value: http://keycloak.platform-mesh-system.svc.cluster.local:80/keycloak
            - name: KEYCLOAK_REALM
              value: naira
            - name: FGA_API_URL
              value: http://openfga-2.default.svc.cluster.local:8080
          ports:
            - containerPort: 8090
              name: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: catalog
  namespace: idp-system
spec:
  selector:
    app: catalog
  ports:
    - name: http
      port: 8090
      targetPort: http
  type: ClusterIP