apiVersion: v1
kind: Namespace
metadata:
  name: idp-system
---
apiVersion: v1
kind: Secret
metadata:
  name: catalog-secrets
  namespace: idp-system
type: Opaque
stringData:
  LITELLM_API_KEY: sk-local-litellm
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: catalog
  namespace: idp-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: catalog-appidentities
rules:
  - apiGroups: ["naira.io"]
    resources: ["appidentities"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: catalog-appidentities
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: catalog-appidentities
subjects:
  - kind: ServiceAccount
    name: catalog
    namespace: idp-system
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: catalog-plugins-pvc
  namespace: idp-system
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: idp-system
spec:
  replicas: 1
  strategy:
    type: Recreate # to clean volume and processes first before new pod
  selector:
    matchLabels:
      app: catalog
  template:
    metadata:
      labels:
        app: catalog
    spec:
      serviceAccountName: catalog
      initContainers:
        - name: install-plugin-litellm
          image: litellm:local
          command: ["cp", "/app/litellm", "/plugins/litellm"]
          volumeMounts:
            - name: plugins-volume
              mountPath: /plugins
        - name: install-plugin-mlflow
          image: mlflow:local
          command: ["cp", "/app/mlflow", "/plugins/mlflow"]
          volumeMounts:
            - name: plugins-volume
              mountPath: /plugins
      containers:
        - name: catalog
          image: catalog:local
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "8090"
            - name: MLFLOW_BASE_URL
              value: http://mlflow.mlflow.svc.cluster.local:5000
            - name: LITELLM_BASE_URL
              value: http://litellm.litellm.svc.cluster.local:4000
            - name: LITELLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: catalog-secrets
                  key: LITELLM_API_KEY
          ports:
            - containerPort: 8090
              name: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: plugins-volume
              mountPath: /var/lib/naira/plugins
      volumes:
        - name: plugins-volume
          persistentVolumeClaim:
            claimName: catalog-plugins-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: catalog
  namespace: idp-system
spec:
  selector:
    app: catalog
  ports:
    - name: http
      port: 8090
      targetPort: http
  type: ClusterIP