version: '3'

includes:
  cluster:
    taskfile: ./tasks/cluster.yml
    dir: .
  docker:
    taskfile: ./tasks/docker.yml
    dir: .
  plugins:
    taskfile: ./tasks/plugins.yml
    dir: .
  postgres:
    taskfile: ./tasks/postgres.yml
    dir: .
  litellm:
    taskfile: ./tasks/litellm.yml
    dir: .
  mlflow:
    taskfile: ./tasks/mlflow.yml
    dir: .
  catalog:
    taskfile: ./tasks/catalog.yml
    dir: .
  ui:
    taskfile: ./tasks/ui.yml
    dir: .
  portal:
    taskfile: ./tasks/portal.yml
    dir: .
  openmetadata:
    taskfile: ./tasks/openmetadata.yml
    dir: .

tasks:
  default:
    desc: Show available development-environment tasks
    cmds:
      - task --list

  check:
    desc: Verify required local tools exist
    cmds:
      - kind version
      - kubectl version --client
      - helm version
      - task --version
      - python3 --version
      - go version
      - docker version
      - buf --version

  platform:deploy:
    desc: Deploy MLflow, LiteLLM, OpenMetadata, Catalog, UI, and Portal to kind
    cmds:
      - task: cluster:create
      - task: mlflow:deploy
      - task: postgres:deploy
      - task: litellm:deploy
      - task: openmetadata:deploy
      - task: catalog:deploy
      - task: ui:deploy
      - task: portal:deploy

  platform:undeploy:
    desc: Remove MLflow, LiteLLM, OpenMetadata, Catalog, UI, and Portal from kind
    cmds:
      - task: portal:undeploy
      - task: openmetadata:undeploy
      - task: catalog:undeploy
      - task: keycloak:undeploy
      - task: openfga:undeploy
      - task: litellm:undeploy
      - task: postgres:undeploy
      - task: mlflow:undeploy
      - task: ui:undeploy

  forward:all:
    desc: Port-forward all services (MLflow, LiteLLM, OpenMetadata, Catalog, UI, Portal)
    silent: true
    vars:
      PORTAL_LOCAL_PORT: '3000'
      UI_LOCAL_PORT: '3001'
      MLFLOW_LOCAL_PORT: '5000'
      LITELLM_LOCAL_PORT: '4000'
      OPENMETADATA_LOCAL_PORT: '8585'
      CATALOG_LOCAL_PORT: '8090'
    cmds:
      - |
        echo "Port-forwarding all services..."
        echo "----------------------------------------------------------------"
        echo "Portal:         http://localhost:{{.PORTAL_LOCAL_PORT}}"
        echo "UI:             http://localhost:{{.UI_LOCAL_PORT}}"
        echo "MLflow:         http://localhost:{{.MLFLOW_LOCAL_PORT}}"
        echo "LiteLLM:        http://localhost:{{.LITELLM_LOCAL_PORT}}"
        echo "Keycloak:       http://localhost:{{.KEYCLOAK_LOCAL_PORT}} (local mode only)"
        echo "OpenMetadata:   http://localhost:{{.OPENMETADATA_LOCAL_PORT}}"
        echo "Catalog:        http://localhost:{{.CATALOG_LOCAL_PORT}}"
        echo "----------------------------------------------------------------"
      - task: forward:all:tunnels

  portal:image:build:
    desc: Build the portal Docker image
    cmds:
      - docker build -t {{.PORTAL_IMAGE}} {{.PORTAL_DIR}}

  portal:image:load:
    desc: Load the portal image into kind
    deps:
      - portal:image:build
    cmds:
      - kind load docker-image {{.PORTAL_IMAGE}} --name {{.CLUSTER_NAME}}

  portal:deploy:
    desc: Deploy the portal to kind
    deps:
      - cluster:create
    cmds:
      - task: portal:apply

  portal:apply:
    internal: true
    cmds:
      - task: portal:image:load
      - task: keycloak:apply
      - |
        if [ "{{.KEYCLOAK_MODE}}" != "local" ]; then
          kubectl create configmap platform-mesh-ca -n {{.PORTAL_NAMESPACE}} \
            --from-literal=ca.crt="$(kubectl get secret domain-certificate -n platform-mesh-system -o jsonpath='{.data.ca\.crt}' | base64 -d)" \
            --dry-run=client -o yaml | kubectl apply -f -
        fi
      - |
        if [ "{{.KEYCLOAK_MODE}}" = "local" ]; then
          AUTH_SERVER_URL="http://localhost:{{.KEYCLOAK_LOCAL_PORT}}/realms/{{.KEYCLOAK_REALM}}/protocol/openid-connect/auth"
          TOKEN_URL="http://keycloak.{{.KEYCLOAK_NAMESPACE}}.svc.cluster.local:{{.KEYCLOAK_REMOTE_PORT}}/realms/{{.KEYCLOAK_REALM}}/protocol/openid-connect/token"
          TRAEFIK_CLUSTER_IP="127.0.0.1"
        else
          AUTH_SERVER_URL="https://portal.localhost:8443/keycloak/realms/{{.KEYCLOAK_REALM}}/protocol/openid-connect/auth"
          TOKEN_URL="https://portal.localhost:8443/keycloak/realms/{{.KEYCLOAK_REALM}}/protocol/openid-connect/token"
          TRAEFIK_CLUSTER_IP=$(kubectl get svc traefik -n default -o jsonpath='{.spec.clusterIP}' 2>/dev/null || echo "127.0.0.1")
        fi
        sed -e "s/__TRAEFIK_CLUSTER_IP__/${TRAEFIK_CLUSTER_IP}/" \
            -e "s/__KEYCLOAK_REALM__/{{.KEYCLOAK_REALM}}/g" \
            -e "s|__AUTH_SERVER_URL_KEYCLOAK__|${AUTH_SERVER_URL}|" \
            -e "s|__TOKEN_URL_KEYCLOAK__|${TOKEN_URL}|" \
            {{.PORTAL_MANIFEST}} | kubectl apply -f -
      - kubectl -n {{.PORTAL_NAMESPACE}} rollout status deploy/portal --timeout=180s
      - kubectl -n {{.PORTAL_NAMESPACE}} get pods

  portal:undeploy:
    desc: Remove the portal from kind
    cmds:
      - kubectl delete -f {{.PORTAL_MANIFEST}} --ignore-not-found

  portal:port-forward:
    desc: Expose the portal on localhost:3000
    cmds:
      - kubectl -n {{.PORTAL_NAMESPACE}} port-forward {{.PORTAL_SERVICE}} {{.PORTAL_LOCAL_PORT}}:{{.PORTAL_REMOTE_PORT}}
  
   # Reusable "Macro" Tasks
  _docker:build:
    internal: true
    cmds:
      - docker build -t {{.IMAGE}} -f {{.DIR}}/Dockerfile ../../
      - task: forward:all:tunnels

  forward:all:tunnels:
    internal: true
    deps: [mlflow:port-forward, litellm:port-forward, openmetadata:port-forward, catalog:port-forward, ui:port-forward, portal:port-forward, keycloak:port-forward]

  seed:all:
    desc: Seed sample data in MLflow and OpenMetadata (requires port-forward)
    cmds:
      - task: mlflow:seed
      - task: openmetadata:seed