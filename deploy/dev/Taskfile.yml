version: '3'

vars:
  KEYCLOAK_REALM: naira
  KEYCLOAK_NAMESPACE: keycloak
  KEYCLOAK_LOCAL_PORT: '8080'
  KEYCLOAK_CLIENT_SECRET: '{{.KEYCLOAK_CLIENT_SECRET | default "naira-local-dev-secret"}}'

includes:
  core:
    taskfile: ./stacks/core/Taskfile.yml
    dir: ./stacks/core
  llm-inference:
    taskfile: ./stacks/llm-inference/Taskfile.yml
    dir: ./stacks/llm-inference
  mlops:
    taskfile: ./stacks/mlops/Taskfile.yml
    dir: ./stacks/mlops

tasks:
  default:
    desc: Show available development-environment tasks
    cmds:
      - task --list

  check:
    desc: Verify required local tools exist
    cmds:
      - kind version
      - kubectl version --client
      - helm version
      - task --version
      - python3 --version
      - go version
      - docker version
      - buf --version

  # Platform deployment
  platform:deploy:
    desc: Deploy core + LLM Inference stack (llama.cpp, litellm, monitoring) to kind
    cmds:
      - task: core:deploy
      - task: llm-inference:deploy

  platform:undeploy:
    desc: Remove the full platform from kind
    cmds:
      - task: llm-inference:undeploy
      - task: mlops:undeploy
      - task: core:undeploy

  # Cluster management
  cluster:delete:
    desc: Remove the kind cluster entirely
    cmds:
      - task: core:cluster:delete

  # Port-forwarding
  forward:all:
    desc: Port-forward all services
    silent: true
    deps:
      - forward:core
      - forward:mlops
      - forward:llm-inference

  forward:core:
    desc: Port-forward core services (catalog, portal, ui)
    silent: true
    deps:
      - forward:core:urls
      - core:catalog:port-forward
      - core:portal:port-forward
      - core:ui:port-forward

  forward:core:urls:
    internal: true
    silent: true
    cmds:
      - |
        echo "Core service URLs:"
        echo "  Portal:  http://localhost:3000"
        echo "  UI:      http://localhost:3001"
        echo "  Catalog: http://localhost:8090"

  forward:mlops:
    desc: Port-forward MLOps services (mlflow, openmetadata)
    silent: true
    deps:
      - forward:mlops:urls
      - mlops:mlflow:port-forward
      - mlops:openmetadata:port-forward

  forward:mlops:urls:
    internal: true
    silent: true
    cmds:
      - |
        echo "MLOps service URLs:"
        echo "  MLflow:       http://localhost:5000"
        echo "  OpenMetadata: http://localhost:8585"

  forward:llm-inference:
    desc: Port-forward LLM Inference services (litellm, llama, monitoring)
    silent: true
    deps:
      - forward:llm-inference:urls
      - llm-inference:litellm:port-forward
      - llm-inference:llamacpp:port-forward
      - llm-inference:monitoring:port-forward
      - llm-inference:vllm:port-forward

  forward:llm-inference:urls:
    internal: true
    silent: true
    cmds:
      - |
        echo "LLM inference service URLs:"
        echo "  LiteLLM:    http://localhost:4000"
        echo "  Prometheus: http://localhost:9090"
        echo "  Grafana:    http://localhost:3002  (admin/admin)"

  # Seeding sample data
  seed:all:
    desc: Seed sample data in MLflow and OpenMetadata (requires port-forward)
    cmds:
      - task: mlops:mlflow:seed
      - task: mlops:openmetadata:seed
