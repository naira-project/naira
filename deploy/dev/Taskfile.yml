version: '3'

vars:
  CLUSTER_NAME: naira-idp
  PORTAL_DIR: ../../naira-openmfp-portal
  UI_DIR: ../../ui-poc
  UI_IMAGE: ui:local
  UI_NAMESPACE: idp-system
  UI_MANIFEST: infra/kubernetes/ui.yaml
  UI_SERVICE: svc/ui
  UI_LOCAL_PORT: '3001'
  UI_REMOTE_PORT: '80'
  MLFLOW_NAMESPACE: mlflow
  KIND_CONFIG: infra/kind/kind-config.yaml
  MLFLOW_MANIFEST: infra/kubernetes/mlflow.yaml
  MLFLOW_SERVICE: svc/mlflow
  MLFLOW_LOCAL_PORT: '5000'
  MLFLOW_REMOTE_PORT: '5000'
  LITELLM_NAMESPACE: litellm
  LITELLM_MANIFEST: infra/kubernetes/litellm.yaml
  LITELLM_SERVICE: svc/litellm
  LITELLM_LOCAL_PORT: '4000'
  LITELLM_REMOTE_PORT: '4000'
  LITELLM_MASTER_KEY: sk-local-litellm
  POSTGRES_NAMESPACE: litellm-db
  POSTGRES_MANIFEST: infra/kubernetes/postgres.yaml
  CATALOG_DIR: ../../catalog
  CATALOG_IMAGE: catalog:local
  PLUGINS_BASE: ../../plugins/cmd
  MLFLOW_PLUGIN_DIR: '{{.PLUGINS_BASE}}/mlflow'
  MLFLOW_PLUGIN_IMAGE: mlflow:local
  LITELLM_PLUGIN_DIR: '{{.PLUGINS_BASE}}/litellm'
  LITELLM_PLUGIN_IMAGE: litellm:local
  DEPL_CALLS_SVC_PLUGIN_DIR: '{{.PLUGINS_BASE}}/depl_calls_svc'
  DEPL_CALLS_SVC_PLUGIN_IMAGE: depl-calls-svc:local
  DEPL_USES_LITELLM_PLUGIN_DIR: '{{.PLUGINS_BASE}}/depl_uses_litellm'
  DEPL_USES_LITELLM_PLUGIN_IMAGE: depl-uses-litellm:local
  FLUXCD_PLUGIN_DIR: '{{.PLUGINS_BASE}}/fluxcd'
  FLUXCD_PLUGIN_IMAGE: fluxcd:local
  OPENMETADATA_PLUGIN_DIR: '{{.PLUGINS_BASE}}/openmetadata'
  OPENMETADATA_PLUGIN_IMAGE: openmetadata:local
  OPENMETADATA_NAMESPACE: openmetadata
  OPENMETADATA_HELM_REPO_NAME: open-metadata
  OPENMETADATA_HELM_REPO_URL: https://helm.open-metadata.org/
  OPENMETADATA_DEPS_RELEASE: openmetadata-dependencies
  OPENMETADATA_DEPS_CHART: open-metadata/openmetadata-dependencies
  OPENMETADATA_DEPS_VALUES: infra/helm/openmetadata-deps-values.yaml
  OPENMETADATA_RELEASE: openmetadata
  OPENMETADATA_CHART: open-metadata/openmetadata
  OPENMETADATA_VALUES: infra/helm/openmetadata-values.yaml
  OPENMETADATA_SECRETS_MANIFEST: infra/kubernetes/openmetadata-secrets.yaml
  OPENMETADATA_SERVICE: svc/openmetadata
  OPENMETADATA_LOCAL_PORT: '8585'
  OPENMETADATA_REMOTE_PORT: '8585'
  CATALOG_NAMESPACE: idp-system
  CATALOG_MANIFEST: infra/kubernetes/catalog.yaml
  CATALOG_SERVICE: svc/catalog
  CATALOG_LOCAL_PORT: '8090'
  CATALOG_REMOTE_PORT: '8090'
  PORTAL_IMAGE: portal:local
  PORTAL_NAMESPACE: idp-system
  PORTAL_MANIFEST: infra/kubernetes/portal.yaml
  PORTAL_SERVICE: svc/portal
  PORTAL_LOCAL_PORT: '3000'
  PORTAL_REMOTE_PORT: '3000'
  LOCAL_WORK_DIR: ../../../..
  MLFLOW_TOOL_DIR: tools/mlflow
  MLFLOW_REGISTER_SCRIPT: '{{.MLFLOW_TOOL_DIR}}/register_dummy_model.py'
  MLFLOW_REQUIREMENTS: '{{.MLFLOW_TOOL_DIR}}/requirements.txt'
  MLFLOW_VENV_DIR: '{{.LOCAL_WORK_DIR}}/venvs/mlflow-registry'
  OPENMETADATA_TOOL_DIR: tools/openmetadata
  OPENMETADATA_SEED_SCRIPT: '{{.OPENMETADATA_TOOL_DIR}}/seed_sample_tables.py'
  OPENMETADATA_REQUIREMENTS: '{{.OPENMETADATA_TOOL_DIR}}/requirements.txt'
  OPENMETADATA_VENV_DIR: '{{.LOCAL_WORK_DIR}}/venvs/openmetadata-seed'
  THALAMUS_PLUGIN_DIR: '{{.PLUGINS_BASE}}/thalamus'
  THALAMUS_PLUGIN_IMAGE: thalamus:local
  THALAMUS_MANIFEST: infra/kubernetes/thalamus.yaml
  THALAMUS_CRD_URL: https://raw.githubusercontent.com/cobaltcore-dev/thalamus/132c032777dc9022f0fc85e7289aebca90317065/helm/thalamus-crds/templates/thalamus.cloud_models.yaml
  DEPL_USES_THALAMUS_PLUGIN_DIR: '{{.PLUGINS_BASE}}/depl_uses_thalamus'
  DEPL_USES_THALAMUS_PLUGIN_IMAGE: depl-uses-thalamus:local
  THALAMUS_NAMESPACE: thalamus
  THALAMUS_GATEWAY_SERVICE: svc/inference-gateway
  THALAMUS_GATEWAY_LOCAL_PORT: '8091'
  THALAMUS_GATEWAY_REMOTE_PORT: '80'
  THALAMUS_WEBUI_NAMESPACE: open-webui
  THALAMUS_WEBUI_SERVICE: svc/open-webui
  THALAMUS_WEBUI_LOCAL_PORT: '8092'
  THALAMUS_WEBUI_REMOTE_PORT: '80'

tasks:
  default:
    desc: Show available development-environment tasks
    cmds:
      - task --list

  check:
    desc: Verify required local tools exist
    cmds:
      - kind version
      - kubectl version --client
      - helm version
      - helmfile --version
      - task --version
      - python3 --version
      - go version
      - docker version
      - buf --version

  cluster:create:
    desc: Create the local kind cluster
    cmds:
      - |
        if kind get clusters | grep -qx '{{.CLUSTER_NAME}}'; then
          echo 'kind cluster {{.CLUSTER_NAME}} already exists'
        else
          kind delete cluster --name {{.CLUSTER_NAME}} >/dev/null 2>&1 || true
          kind create cluster --name {{.CLUSTER_NAME}} --config {{.KIND_CONFIG}}
        fi

  cluster:delete:
    desc: Delete the local kind cluster
    cmds:
      - kind delete cluster --name {{.CLUSTER_NAME}}

  mlflow:deploy:
    desc: Deploy MLflow to kind
    deps:
      - cluster:create
    cmds:
      - task: mlflow:apply

  mlflow:apply:
    internal: true
    cmds:
      - kubectl apply -f {{.MLFLOW_MANIFEST}}
      - kubectl -n {{.MLFLOW_NAMESPACE}} rollout status deploy/mlflow --timeout=180s
      - kubectl -n {{.MLFLOW_NAMESPACE}} get pods
      - kubectl -n {{.MLFLOW_NAMESPACE}} get pvc

  mlflow:undeploy:
    desc: Remove MLflow from kind
    cmds:
      - kubectl delete -f {{.MLFLOW_MANIFEST}} --ignore-not-found

  mlflow:port-forward:
    desc: Expose MLflow on localhost:5000
    cmds:
      - kubectl -n {{.MLFLOW_NAMESPACE}} port-forward {{.MLFLOW_SERVICE}} {{.MLFLOW_LOCAL_PORT}}:{{.MLFLOW_REMOTE_PORT}}

  mlflow:seed:
    desc: Seed a sample model in MLflow
    cmds:
      - |
        mkdir -p '{{.LOCAL_WORK_DIR}}/venvs'
      - |
        python3 -m venv '{{.MLFLOW_VENV_DIR}}'
      - |
        '{{.MLFLOW_VENV_DIR}}/bin/pip' install --upgrade pip
      - |
        '{{.MLFLOW_VENV_DIR}}/bin/pip' install -r '{{.MLFLOW_REQUIREMENTS}}'
      - |
        MLFLOW_TRACKING_URI=http://127.0.0.1:{{.MLFLOW_LOCAL_PORT}} '{{.MLFLOW_VENV_DIR}}/bin/python' '{{.MLFLOW_REGISTER_SCRIPT}}'

  postgres:deploy:
    desc: Deploy PostgreSQL for LiteLLM to kind
    deps:
      - cluster:create
    cmds:
      - task: postgres:apply

  postgres:apply:
    internal: true
    cmds:
      - kubectl apply -f {{.POSTGRES_MANIFEST}}
      - kubectl -n {{.POSTGRES_NAMESPACE}} rollout status deploy/postgres --timeout=180s
      - kubectl -n {{.POSTGRES_NAMESPACE}} get pods

  postgres:undeploy:
    desc: Remove PostgreSQL for LiteLLM from kind
    cmds:
      - kubectl delete -f {{.POSTGRES_MANIFEST}} --ignore-not-found

  litellm:deploy:
    desc: Deploy LiteLLM to kind
    deps:
      - postgres:deploy
    cmds:
      - task: litellm:apply

  litellm:apply:
    internal: true
    cmds:
      - kubectl apply -f {{.LITELLM_MANIFEST}}
      - kubectl -n {{.LITELLM_NAMESPACE}} rollout status deploy/litellm --timeout=900s
      - kubectl -n {{.LITELLM_NAMESPACE}} get pods

  litellm:undeploy:
    desc: Remove LiteLLM from kind
    cmds:
      - kubectl delete -f {{.LITELLM_MANIFEST}} --ignore-not-found

  litellm:port-forward:
    desc: Expose LiteLLM on localhost:4000
    cmds:
      - kubectl -n {{.LITELLM_NAMESPACE}} port-forward {{.LITELLM_SERVICE}} {{.LITELLM_LOCAL_PORT}}:{{.LITELLM_REMOTE_PORT}}

  openmetadata:deploy:
    desc: Deploy OpenMetadata (and its dependencies) to kind
    deps:
      - cluster:create
    cmds:
      - task: openmetadata:apply

  openmetadata:apply:
    internal: true
    cmds:
      - helm repo add {{.OPENMETADATA_HELM_REPO_NAME}} {{.OPENMETADATA_HELM_REPO_URL}} --force-update
      - helm repo update {{.OPENMETADATA_HELM_REPO_NAME}}
      - kubectl create namespace {{.OPENMETADATA_NAMESPACE}} --dry-run=client -o yaml | kubectl apply -f -
      - kubectl apply -f {{.OPENMETADATA_SECRETS_MANIFEST}}
      - helm upgrade --install {{.OPENMETADATA_DEPS_RELEASE}} {{.OPENMETADATA_DEPS_CHART}} --namespace {{.OPENMETADATA_NAMESPACE}} --create-namespace --values {{.OPENMETADATA_DEPS_VALUES}} --wait --timeout 15m
      - helm upgrade --install {{.OPENMETADATA_RELEASE}} {{.OPENMETADATA_CHART}} --namespace {{.OPENMETADATA_NAMESPACE}} --values {{.OPENMETADATA_VALUES}} --wait --timeout 15m
      - kubectl -n {{.OPENMETADATA_NAMESPACE}} rollout status deploy/openmetadata --timeout=600s
      - kubectl -n {{.OPENMETADATA_NAMESPACE}} get pods

  openmetadata:undeploy:
    desc: Remove OpenMetadata (and its dependencies) from kind
    cmds:
      - |
        if helm status {{.OPENMETADATA_RELEASE}} -n {{.OPENMETADATA_NAMESPACE}} >/dev/null 2>&1; then
          helm uninstall {{.OPENMETADATA_RELEASE}} -n {{.OPENMETADATA_NAMESPACE}}
        fi
      - |
        if helm status {{.OPENMETADATA_DEPS_RELEASE}} -n {{.OPENMETADATA_NAMESPACE}} >/dev/null 2>&1; then
          helm uninstall {{.OPENMETADATA_DEPS_RELEASE}} -n {{.OPENMETADATA_NAMESPACE}}
        fi
      - kubectl delete -f {{.OPENMETADATA_SECRETS_MANIFEST}} --ignore-not-found
      - kubectl delete namespace {{.OPENMETADATA_NAMESPACE}} --ignore-not-found

  openmetadata:port-forward:
    desc: Expose OpenMetadata on localhost:8585
    cmds:
      - kubectl -n {{.OPENMETADATA_NAMESPACE}} port-forward {{.OPENMETADATA_SERVICE}} {{.OPENMETADATA_LOCAL_PORT}}:{{.OPENMETADATA_REMOTE_PORT}}

  openmetadata:seed:
    desc: Seed sample tables in OpenMetadata (requires openmetadata:port-forward)
    cmds:
      - |
        mkdir -p '{{.LOCAL_WORK_DIR}}/venvs'
      - |
        python3 -m venv '{{.OPENMETADATA_VENV_DIR}}'
      - |
        '{{.OPENMETADATA_VENV_DIR}}/bin/pip' install --upgrade pip
      - |
        '{{.OPENMETADATA_VENV_DIR}}/bin/pip' install -r '{{.OPENMETADATA_REQUIREMENTS}}'
      - |
        OPENMETADATA_HOST_PORT=http://127.0.0.1:{{.OPENMETADATA_LOCAL_PORT}} '{{.OPENMETADATA_VENV_DIR}}/bin/python' '{{.OPENMETADATA_SEED_SCRIPT}}'

  mlflow:image:build:
    desc: Build the mlflow Docker image
    cmds:
      - task: _docker:build
        vars: { IMAGE: '{{.MLFLOW_PLUGIN_IMAGE}}', DIR: '{{.MLFLOW_PLUGIN_DIR}}' }

  mlflow:image:load:
    desc: Load the mlflow plugin image into kind
    deps:
      - mlflow:image:build
    cmds:
      - task: _docker:load
        vars: { IMAGE: '{{.MLFLOW_PLUGIN_IMAGE}}' }

  litellm:image:build:
    desc: Build the litellm Docker image
    cmds:
      - task: _docker:build
        vars: { IMAGE: '{{.LITELLM_PLUGIN_IMAGE}}', DIR: '{{.LITELLM_PLUGIN_DIR}}' }

  litellm:image:load:
    desc: Load the litellm plugin image into kind
    deps:
      - litellm:image:build
    cmds:
      - task: _docker:load
        vars: { IMAGE: '{{.LITELLM_PLUGIN_IMAGE}}' }

  depl-calls-svc:image:build:
    desc: Build the depl-calls-svc plugin Docker image
    cmds:
      - task: _docker:build
        vars: { IMAGE: '{{.DEPL_CALLS_SVC_PLUGIN_IMAGE}}', DIR: '{{.DEPL_CALLS_SVC_PLUGIN_DIR}}' }

  depl-calls-svc:image:load:
    desc: Load the depl-calls-svc plugin image into kind
    deps:
      - depl-calls-svc:image:build
    cmds:
      - task: _docker:load
        vars: { IMAGE: '{{.DEPL_CALLS_SVC_PLUGIN_IMAGE}}' }

  depl-uses-litellm:image:build:
    desc: Build the depl-uses-litellm plugin Docker image
    cmds:
      - task: _docker:build
        vars: { IMAGE: '{{.DEPL_USES_LITELLM_PLUGIN_IMAGE}}', DIR: '{{.DEPL_USES_LITELLM_PLUGIN_DIR}}' }

  depl-uses-litellm:image:load:
    desc: Load the depl-uses-litellm plugin image into kind
    deps:
      - depl-uses-litellm:image:build
    cmds:
      - task: _docker:load
        vars: { IMAGE: '{{.DEPL_USES_LITELLM_PLUGIN_IMAGE}}' }

  thalamus:apply:
    internal: true
    cmds:
      - kubectl apply -f {{.THALAMUS_MANIFEST}}

  thalamus:undeploy:
    desc: Remove thalamus CRD and dummy models from kind
    cmds:
      - kubectl delete -f {{.THALAMUS_MANIFEST}} --ignore-not-found
      - kubectl delete -f {{.THALAMUS_CRD_URL}} --ignore-not-found

  depl-uses-thalamus:image:build:
    desc: Build the depl-uses-thalamus plugin Docker image
    cmds:
      - task: _docker:build
        vars: { IMAGE: '{{.DEPL_USES_THALAMUS_PLUGIN_IMAGE}}', DIR: '{{.DEPL_USES_THALAMUS_PLUGIN_DIR}}' }

  depl-uses-thalamus:image:load:
    desc: Load the depl-uses-thalamus plugin image into kind
    deps:
      - depl-uses-thalamus:image:build
    cmds:
      - task: _docker:load
        vars: { IMAGE: '{{.DEPL_USES_THALAMUS_PLUGIN_IMAGE}}' }

  thalamus:image:build:
    desc: Build the thalmaus plugin Docker image
    cmds:
      - task: _docker:build
        vars: { IMAGE: '{{.THALAMUS_PLUGIN_IMAGE}}', DIR: '{{.THALAMUS_PLUGIN_DIR}}' }

  thalamus:image:load:
    desc: Load the thalamus plugin image into kind
    deps:
      - thalamus:image:build
    cmds:
      - task: _docker:load
        vars: { IMAGE: '{{.THALAMUS_PLUGIN_IMAGE}}' }

  fluxcd:image:build:
    desc: Build the fluxcd plugin Docker image
    cmds:
      - task: _docker:build
        vars: { IMAGE: '{{.FLUXCD_PLUGIN_IMAGE}}', DIR: '{{.FLUXCD_PLUGIN_DIR}}' }

  fluxcd:image:load:
    desc: Load the fluxcd plugin image into kind
    deps:
      - fluxcd:image:build
    cmds:
      - task: _docker:load
        vars: { IMAGE: '{{.FLUXCD_PLUGIN_IMAGE}}' }

  openmetadata:image:build:
    desc: Build the openmetadata plugin Docker image
    cmds:
      - task: _docker:build
        vars: { IMAGE: '{{.OPENMETADATA_PLUGIN_IMAGE}}', DIR: '{{.OPENMETADATA_PLUGIN_DIR}}' }

  openmetadata:image:load:
    desc: Load the openmetadata plugin image into kind
    deps:
      - openmetadata:image:build
    cmds:
      - task: _docker:load
        vars: { IMAGE: '{{.OPENMETADATA_PLUGIN_IMAGE}}' }

  catalog:image:build:
    desc: Build the catalog Docker image
    cmds:
      - task: _docker:build
        vars: { IMAGE: '{{.CATALOG_IMAGE}}', DIR: '{{.CATALOG_DIR}}' }

  catalog:image:load:
    desc: Load the catalog image into kind
    deps:
      - catalog:image:build
    cmds:
      - task: _docker:load
        vars: { IMAGE: '{{.CATALOG_IMAGE}}' }

  catalog:deploy:
    desc: Deploy the catalog to kind
    deps:
      - cluster:create
    cmds:
      - task: catalog:apply

  catalog:apply:
    internal: true
    cmds:
      - task: catalog:image:load
      - task: mlflow:image:load
      - task: litellm:image:load
      - task: depl-calls-svc:image:load
      - task: depl-uses-litellm:image:load
      - task: thalamus:image:load
      - task: depl-uses-thalamus:image:load
      - task: fluxcd:image:load
      - task: openmetadata:image:load
      - kubectl apply -f {{.CATALOG_MANIFEST}}
      - kubectl -n {{.CATALOG_NAMESPACE}} rollout status deploy/catalog --timeout=180s
      - kubectl -n {{.CATALOG_NAMESPACE}} get pods

  catalog:undeploy:
    desc: Remove the catalog from kind
    cmds:
      - kubectl delete -f {{.CATALOG_MANIFEST}} --ignore-not-found

  catalog:port-forward:
    desc: Expose the catalog on localhost:8090
    cmds:
      - kubectl -n {{.CATALOG_NAMESPACE}} port-forward {{.CATALOG_SERVICE}} {{.CATALOG_LOCAL_PORT}}:{{.CATALOG_REMOTE_PORT}}

  ui:image:build:
    desc: Build the UI Docker image
    cmds:
      - docker build -t {{.UI_IMAGE}} {{.UI_DIR}}

  ui:image:load:
    desc: Load the UI image into kind
    deps:
      - ui:image:build
    cmds:
      - task: _docker:load
        vars: { IMAGE: '{{.UI_IMAGE}}' }

  ui:deploy:
    desc: Deploy the UI to kind
    deps:
      - cluster:create
    cmds:
      - task: ui:apply

  ui:apply:
    internal: true
    cmds:
      - task: ui:image:load
      - kubectl apply -f {{.UI_MANIFEST}}
      - kubectl -n {{.UI_NAMESPACE}} rollout status deploy/ui --timeout=180s
      - kubectl -n {{.UI_NAMESPACE}} get pods

  ui:undeploy:
    desc: Remove the UI from kind
    cmds:
      - kubectl delete -f {{.UI_MANIFEST}} --ignore-not-found

  ui:port-forward:
    desc: Expose the UI on localhost:3001
    cmds:
      - kubectl -n {{.UI_NAMESPACE}} port-forward {{.UI_SERVICE}} {{.UI_LOCAL_PORT}}:{{.UI_REMOTE_PORT}}

  portal:image:build:
    desc: Build the portal Docker image
    cmds:
      - docker build -t {{.PORTAL_IMAGE}} {{.PORTAL_DIR}}

  portal:image:load:
    desc: Load the portal image into kind
    deps:
      - portal:image:build
    cmds:
      - kind load docker-image {{.PORTAL_IMAGE}} --name {{.CLUSTER_NAME}}

  portal:deploy:
    desc: Deploy the portal to kind
    deps:
      - cluster:create
    cmds:
      - task: portal:apply

  portal:apply:
    internal: true
    cmds:
      - task: portal:image:load
      - kubectl apply -f {{.PORTAL_MANIFEST}}
      - kubectl -n {{.PORTAL_NAMESPACE}} rollout status deploy/portal --timeout=180s
      - kubectl -n {{.PORTAL_NAMESPACE}} get pods

  portal:undeploy:
    desc: Remove the portal from kind
    cmds:
      - kubectl delete -f {{.PORTAL_MANIFEST}} --ignore-not-found

  portal:port-forward:
    desc: Expose the portal on localhost:3000
    cmds:
      - kubectl -n {{.PORTAL_NAMESPACE}} port-forward {{.PORTAL_SERVICE}} {{.PORTAL_LOCAL_PORT}}:{{.PORTAL_REMOTE_PORT}}

  platform:deploy:
    desc: Deploy MLflow, LiteLLM, OpenMetadata, Catalog, UI, and Portal to kind
    cmds:
      - task: cluster:create
      - task: mlflow:apply
      - task: postgres:apply
      - task: litellm:apply
      #- task: openmetadata:apply
      - task: thalamus:apply
      - task: catalog:apply
      - task: ui:apply
      - task: portal:apply

  platform:undeploy:
    desc: Remove MLflow, LiteLLM, OpenMetadata, Catalog, UI, and Portal from kind
    cmds:
      - task: portal:undeploy
      - task: catalog:undeploy
      - task: thalamus:undeploy
      - task: litellm:undeploy
      - task: postgres:undeploy
      - task: openmetadata:undeploy
      - task: mlflow:undeploy
      - task: ui:undeploy

  forward:all:
    desc: Port-forward all services (MLflow, LiteLLM, Catalog, UI, Portal)
    silent: true
    cmds:
      - |
        echo "Port-forwarding all services..."
        echo "----------------------------------------------------------------"
        echo "Portal:         http://localhost:{{.PORTAL_LOCAL_PORT}}"
        echo "UI:             http://localhost:{{.UI_LOCAL_PORT}}"
        echo "MLflow:         http://localhost:{{.MLFLOW_LOCAL_PORT}}"
        echo "LiteLLM:        http://localhost:{{.LITELLM_LOCAL_PORT}}"
        echo "OpenMetadata:   http://localhost:{{.OPENMETADATA_LOCAL_PORT}}"
        echo "Catalog:        http://localhost:{{.CATALOG_LOCAL_PORT}}"
        echo "----------------------------------------------------------------"
      - task: forward:all:tunnels

  forward:all:tunnels:
    internal: true
    deps: [mlflow:port-forward, litellm:port-forward, catalog:port-forward, ui:port-forward, portal:port-forward]
  
   # Reusable "Macro" Tasks
  _docker:build:
    internal: true
    cmds:
      - docker build -t {{.IMAGE}} -f {{.DIR}}/Dockerfile ../../

  _docker:load:
    internal: true
    cmds:
      - kind load docker-image {{.IMAGE}} --name {{.CLUSTER_NAME}}

  thalamus:deploy:
    desc: Deploy Thalamus (inference gateway + Open WebUI) alongside the existing platform stack
    deps:
      - cluster:create
    cmds:
      - task: thalamus:install-local
      - task: thalamus:apply
  
  thalamus:install-local:
    desc: Install Thalamus locally through Helm charts
    cmds: 
      - kubectl create namespace thalamus
      - kubectl create secret generic hf-token \
          --from-literal=HF_TOKEN="$HF_TOKEN" \
          --namespace thalamus
      - helmfile --file helm/helmfile.yaml.gotmpl apply \
          --state-values-file helm/example.values.cpu.yaml

  forward:thalamus:
    desc: Port-forward Thalamus 
    deps: [thalamus:port-forward:gateway, thalamus:port-forward:webui]

  thalamus:port-forward:gateway:
    internal: true
    cmds:
      - kubectl -n {{.THALAMUS_NAMESPACE}} port-forward {{.THALAMUS_GATEWAY_SERVICE}} {{.THALAMUS_GATEWAY_LOCAL_PORT}}:{{.THALAMUS_GATEWAY_REMOTE_PORT}}

  thalamus:port-forward:webui:
    internal: true
    cmds:
      - kubectl -n {{.THALAMUS_WEBUI_NAMESPACE}} port-forward {{.THALAMUS_WEBUI_SERVICE}} {{.THALAMUS_WEBUI_LOCAL_PORT}}:{{.THALAMUS_WEBUI_REMOTE_PORT}}

  thalamus:port-forward:
    desc: Expose the Thalamus inference gateway and Open WebUI on localhost
    silent: true
    cmds:
      - |
        echo "Thalamus Gateway: http://localhost:{{.THALAMUS_GATEWAY_LOCAL_PORT}}"
        echo "Open WebUI:       http://localhost:{{.THALAMUS_WEBUI_LOCAL_PORT}}"
      - task: thalamus:port-forward:tunnels

  thalamus:port-forward:tunnels:
    internal: true
    deps: [thalamus:port-forward:gateway, thalamus:port-forward:webui]

  openwebui:forward:
    desc: Port-forward everything needed to use Open WebUI with the Thalamus model and the Naira catalog tools (MCP via OpenAPI)
    silent: true
    cmds:
      - |
        echo "Port-forwarding Open WebUI stack..."
        echo "----------------------------------------------------------------"
        echo "Open WebUI:       http://localhost:{{.THALAMUS_WEBUI_LOCAL_PORT}}"
        echo "Thalamus Gateway: http://localhost:{{.THALAMUS_GATEWAY_LOCAL_PORT}}"
        echo "Catalog (tools):  http://localhost:{{.CATALOG_LOCAL_PORT}}/openapi.json"
        echo "----------------------------------------------------------------"
      - task: openwebui:forward:tunnels

  openwebui:forward:tunnels:
    internal: true
    deps: [thalamus:port-forward:gateway, thalamus:port-forward:webui, catalog:port-forward]
