version: '3'

includes:
  core:
    taskfile: ./stacks/core/Taskfile.yml
    dir: ./stacks/core
  llm-inference:
    taskfile: ./stacks/llm-inference/Taskfile.yml
    dir: ./stacks/llm-inference
  mlops:
    taskfile: ./stacks/mlops/Taskfile.yml
    dir: ./stacks/mlops

tasks:
  default:
    desc: Show available development-environment tasks
    cmds:
      - task --list

  check:
    desc: Verify required local tools exist
    cmds:
      - kind version
      - kubectl version --client
      - helm version
      - task --version
      - python3 --version
      - go version
      - docker version
      - buf --version

  # ── Full platform deployment ──────────────────────────────────────────

  platform:deploy:
    desc: Deploy the full platform (core + mlops + llm-inference) to kind
    cmds:
      - task: core:deploy
      - task: mlops:deploy
      - task: llm-inference:deploy

  platform:undeploy:
    desc: Remove the full platform from kind
    cmds:
      - task: llm-inference:undeploy
      - task: mlops:undeploy
      - task: core:undeploy

  # ── Stack combinations ────────────────────────────────────────────────

  platform:deploy:core-mlops:
    desc: Deploy core + mlops stacks (Portal, Catalog, UI, MLflow, OpenMetadata)
    cmds:
      - task: core:deploy
      - task: mlops:deploy

  platform:deploy:core-llm-inference:
    desc: Deploy core + llm-inference stacks (Portal, Catalog, UI, LiteLLM, vLLM, Monitoring)
    cmds:
      - task: core:deploy
      - task: llm-inference:deploy

  platform:deploy:core-mlops-litellm:
    desc: Deploy core + mlops + LiteLLM only (Portal, Catalog, UI, MLflow, OpenMetadata, LiteLLM)
    cmds:
      - task: core:deploy
      - task: mlops:deploy
      - task: llm-inference:deploy:litellm

  # ── Cluster management ────────────────────────────────────────────────

  cluster:delete:
    desc: Remove the kind cluster entirely
    cmds:
      - task: core:cluster:delete

  # ── Port-forwarding ───────────────────────────────────────────────────

  forward:all:
    desc: Port-forward all services
    silent: true
    vars:
      PORTAL_LOCAL_PORT: '3000'
      UI_LOCAL_PORT: '3001'
      MLFLOW_LOCAL_PORT: '5000'
      LITELLM_LOCAL_PORT: '4000'
      OPENMETADATA_LOCAL_PORT: '8585'
      CATALOG_LOCAL_PORT: '8090'
      PROMETHEUS_LOCAL_PORT: '9090'
      GRAFANA_LOCAL_PORT: '3002'
    cmds:
      - |
        echo "Port-forwarding all services..."
        echo "----------------------------------------------------------------"
        echo "Portal:         http://localhost:{{.PORTAL_LOCAL_PORT}}"
        echo "UI:             http://localhost:{{.UI_LOCAL_PORT}}"
        echo "MLflow:         http://localhost:{{.MLFLOW_LOCAL_PORT}}"
        echo "LiteLLM:        http://localhost:{{.LITELLM_LOCAL_PORT}}"
        echo "OpenMetadata:   http://localhost:{{.OPENMETADATA_LOCAL_PORT}}"
        echo "Catalog:        http://localhost:{{.CATALOG_LOCAL_PORT}}"
        echo "Prometheus:     http://localhost:{{.PROMETHEUS_LOCAL_PORT}}"
        echo "Grafana:        http://localhost:{{.GRAFANA_LOCAL_PORT}}  (admin/admin)"
        echo "----------------------------------------------------------------"
      - task: forward:all:tunnels

  forward:all:tunnels:
    internal: true
    deps:
      - core:forward
      - mlops:forward
      - llm-inference:forward

  # ── Seeding sample data ───────────────────────────────────────────────

  seed:all:
    desc: Seed sample data in MLflow and OpenMetadata (requires port-forward)
    cmds:
      - task: mlops:mlflow:seed
      - task: mlops:openmetadata:seed