version: '3'

vars:
  CLUSTER_NAME: naira-idp
  PORTAL_DIR: ../../naira-openmfp-portal
  PORTAL_IMAGE: portal:local
  PORTAL_NAMESPACE: idp-system
  PORTAL_MANIFEST: infra/kubernetes/portal.yaml
  PORTAL_SERVICE: svc/portal
  PORTAL_LOCAL_PORT: '3000'
  PORTAL_REMOTE_PORT: '3000'
  KEYCLOAK_MODE: local # or platform-mesh if you want to work with the shared cluster (or your local Platform Mesh cluster)
  KEYCLOAK_REALM: naira
  KEYCLOAK_NAMESPACE: keycloak
  KEYCLOAK_LOCAL_PORT: '8080'
  KEYCLOAK_REMOTE_PORT: '8080'

tasks:
  image:build:
    desc: Build the portal Docker image
    cmds:
      - docker build -t {{.PORTAL_IMAGE}} {{.PORTAL_DIR}}

  image:load:
    desc: Load the portal image into kind
    deps: [image:build]
    cmds:
      - kind load docker-image {{.PORTAL_IMAGE}} --name {{.CLUSTER_NAME}}

  deploy:
    desc: Deploy the portal to kind
    cmds:
      - task: image:load
      - task: :keycloak:deploy
      - |
        if [ "{{.KEYCLOAK_MODE}}" != "local" ]; then
          kubectl create configmap platform-mesh-ca -n {{.PORTAL_NAMESPACE}} \
            --from-literal=ca.crt="$(kubectl get secret domain-certificate -n platform-mesh-system -o jsonpath='{.data.ca\.crt}' | base64 -d)" \
            --dry-run=client -o yaml | kubectl apply -f -
        fi
      - |
        if [ "{{.KEYCLOAK_MODE}}" = "local" ]; then
          AUTH_SERVER_URL="http://localhost:{{.KEYCLOAK_LOCAL_PORT}}/realms/{{.KEYCLOAK_REALM}}/protocol/openid-connect/auth"
          TOKEN_URL="http://keycloak.{{.KEYCLOAK_NAMESPACE}}.svc.cluster.local:{{.KEYCLOAK_REMOTE_PORT}}/realms/{{.KEYCLOAK_REALM}}/protocol/openid-connect/token"
        else
          AUTH_SERVER_URL="https://portal.localhost:8443/keycloak/realms/{{.KEYCLOAK_REALM}}/protocol/openid-connect/auth"
          TOKEN_URL="https://portal.localhost:8443/keycloak/realms/{{.KEYCLOAK_REALM}}/protocol/openid-connect/token"
        fi
        sed -e "s|__AUTH_SERVER_URL_KEYCLOAK__|${AUTH_SERVER_URL}|" \
            -e "s|__TOKEN_URL_KEYCLOAK__|${TOKEN_URL}|" \
            {{.PORTAL_MANIFEST}} | kubectl apply -f -
      - kubectl -n {{.PORTAL_NAMESPACE}} rollout status deploy/portal --timeout=180s
      - kubectl -n {{.PORTAL_NAMESPACE}} get pods

  undeploy:
    desc: Remove the portal from kind
    cmds:
      - kubectl delete -f {{.PORTAL_MANIFEST}} --ignore-not-found

  port-forward:
    desc: Expose the portal on localhost:3000
    cmds:
      - kubectl -n {{.PORTAL_NAMESPACE}} port-forward {{.PORTAL_SERVICE}} {{.PORTAL_LOCAL_PORT}}:{{.PORTAL_REMOTE_PORT}}