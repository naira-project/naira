# Default values for the Naira Portal chart.

replicaCount: 1

image:
  repository: ghcr.io/naira-project/naira-portal
  pullPolicy: IfNotPresent
  tag: "0.1.0"

containerName: portal
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

env:
  # -- Port on which the Portal listens.
  PORT: "3000"
  # -- Browser-facing URL of the Naira UI.
  NAIRA_UI_BASE_URL: http://localhost:3001

podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  port: 3000

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 20
  periodSeconds: 20
readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

volumes: []
volumeMounts: []
nodeSelector: {}
tolerations: []
affinity: {}
