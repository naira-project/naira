{{- if .Values.mcpMock.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-mock
  namespace: {{ .Values.mcpMock.namespace }}
  labels:
    {{- include "naira-core.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.mcpMock.replicaCount }}
  selector:
    matchLabels:
      app: mcp-mock
  template:
    metadata:
      labels:
        app: mcp-mock
    spec:
      containers:
        - name: mcp-mock
          image: "{{ .Values.mcpMock.image.repository }}:{{ .Values.mcpMock.image.tag | default .Values.tag }}"
          imagePullPolicy: {{ .Values.mcpMock.image.pullPolicy }}
          env:
            - name: PORT
              value: {{ .Values.mcpMock.service.port | quote }}
            - name: MCP_MOCK_SERVER_NAME
              value: {{ .Values.mcpMock.serverName }}
          ports:
            - containerPort: {{ .Values.mcpMock.service.port }}
              name: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            {{- toYaml .Values.mcpMock.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-mock
  namespace: {{ .Values.mcpMock.namespace }}
  labels:
    {{- include "naira-core.labels" . | nindent 4 }}
spec:
  selector:
    app: mcp-mock
  ports:
    - name: http
      port: {{ .Values.mcpMock.service.port }}
      targetPort: http
  type: ClusterIP
{{- end }}
