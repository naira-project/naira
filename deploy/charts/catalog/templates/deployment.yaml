apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "catalog.fullname" . }}
  labels:
    {{- include "catalog.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "catalog.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "catalog.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if or .Values.serviceAccount.create .Values.serviceAccount.name }}
      serviceAccountName: {{ include "catalog.serviceAccountName" . }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        {{- range $key := list "litellm" "mlflow" "deplCallsSvc" "deplUsesLitellm" "fluxcd" "openmetadata" }}
        {{- $plugin := index $.Values.plugins $key }}
        {{- if $plugin.enabled }}
        - name: plugin-{{ $plugin.name }}
          image: "{{ $plugin.image.repository }}:{{ $plugin.image.tag }}"
          imagePullPolicy: {{ $plugin.image.pullPolicy }}
          restartPolicy: Always
          env:
            - name: PORT
              value: {{ $plugin.port | quote }}
            {{- with $plugin.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- if eq $key "litellm" }}
            - name: LITELLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ required "existingSecret is required when the LiteLLM plugin is enabled" $.Values.existingSecret }}
                  key: {{ $.Values.secretKeys.litellmApiKey }}
            {{- end }}
            {{- if eq $key "openmetadata" }}
            - name: OPENMETADATA_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ required "existingSecret is required when the OpenMetadata plugin is enabled" $.Values.existingSecret }}
                  key: {{ $.Values.secretKeys.openmetadataAdminPassword }}
            {{- end }}
          {{- with $plugin.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- end }}
        {{- end }}
      containers:
        - name: {{ .Values.containerName | default .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- $addresses := list }}
            {{- range $key := list "litellm" "mlflow" "deplCallsSvc" "deplUsesLitellm" "fluxcd" "openmetadata" }}
            {{- $plugin := index $.Values.plugins $key }}
            {{- if $plugin.enabled }}
            {{- $addresses = append $addresses (printf "%s=localhost:%v" $plugin.name $plugin.port) }}
            {{- end }}
            {{- end }}
            - name: PLUGIN_ADDRESSES
              value: {{ join "," $addresses | quote }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
