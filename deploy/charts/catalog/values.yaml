# Default values for the Naira Catalog chart.

replicaCount: 1

image:
  repository: ghcr.io/naira-project/naira-catalog
  pullPolicy: IfNotPresent
  tag: "0.1.0"

containerName: catalog
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

rbac:
  create: true
  appIdentities:
    create: true
    name: ""
  deplCallsSvc:
    create: true
    name: ""
  deplUsesLitellm:
    create: true
    name: ""
  fluxcd:
    create: true
    name: ""

# -- Existing Secret containing credentials consumed by Catalog plugins.
existingSecret: catalog-secrets
secretKeys:
  # -- Key containing the LiteLLM API key.
  litellmApiKey: LITELLM_API_KEY
  # -- Key containing the OpenMetadata administrator password.
  openmetadataAdminPassword: OPENMETADATA_ADMIN_PASSWORD

plugins:
  litellm:
    enabled: true
    name: litellm
    image:
      repository: ghcr.io/naira-project/naira-plugin-litellm
      pullPolicy: IfNotPresent
      tag: "0.1.0"
    port: 50051
    env:
      - name: LITELLM_BASE_URL
        value: http://litellm.litellm.svc.cluster.local:4000
    resources: &pluginResources
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
  mlflow:
    enabled: true
    name: mlflow
    image:
      repository: ghcr.io/naira-project/naira-plugin-mlflow
      pullPolicy: IfNotPresent
      tag: "0.1.0"
    port: 50052
    env:
      - name: MLFLOW_BASE_URL
        value: http://mlflow.mlflow.svc.cluster.local:5000
    resources: *pluginResources
  deplCallsSvc:
    enabled: true
    name: depl-calls-svc
    image:
      repository: ghcr.io/naira-project/naira-plugin-depl-calls-svc
      pullPolicy: IfNotPresent
      tag: "0.1.0"
    port: 50053
    env:
      - name: DEPL_CALLS_SVC_KUBECONFIG
        value: ""
    resources: *pluginResources
  deplUsesLitellm:
    enabled: true
    name: depl-uses-litellm
    image:
      repository: ghcr.io/naira-project/naira-plugin-depl-uses-litellm
      pullPolicy: IfNotPresent
      tag: "sha-8420753"
    port: 50054
    env:
      - name: DEPL_USES_LITELLM_KUBECONFIG
        value: ""
      - name: DEPL_USES_LITELLM_NAMED_HOSTS
        value: litellm=http://litellm.litellm:4000
    resources: *pluginResources
  fluxcd:
    enabled: true
    name: fluxcd
    image:
      repository: ghcr.io/naira-project/naira-plugin-fluxcd
      pullPolicy: IfNotPresent
      tag: "0.1.0"
    port: 50055
    env: []
    resources: *pluginResources
  openmetadata:
    enabled: true
    name: openmetadata
    image:
      repository: ghcr.io/naira-project/naira-plugin-openmetadata
      pullPolicy: IfNotPresent
      tag: "sha-8420753"
    port: 50056
    env:
      - name: OPENMETADATA_BASE_URL
        value: http://openmetadata.openmetadata.svc.cluster.local:8585
      - name: OPENMETADATA_ADMIN_EMAIL
        value: admin@open-metadata.org
    resources: *pluginResources

podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  port: 8090

env:
  - name: PORT
    value: "8090"

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 15
  periodSeconds: 20
readinessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

volumes: []
volumeMounts: []
nodeSelector: {}
tolerations: []
affinity: {}
