# Default values for components: the third-party pieces Naira's platform
# depends on but doesn't own (see CONTEXT.md's "Component" entry).
#
# openmetadata and monitoring are real upstream Helm charts (see
# docs/adr/0001-two-flat-charts-with-a-dependency-exception.md) — everything
# else here is a flat template gated by <name>.enabled.
#
# IMPORTANT: the openmetadata chart has no namespace override of its own, so
# it deploys into whatever namespace this release is installed into. Install
# this chart with `--namespace {{ .Values.openmetadata.namespace }} --create-namespace`
# (default: openmetadata) so it lands where it always has. Every other
# component sets its own explicit namespace and is unaffected by the release
# namespace; monitoring redirects itself via kube-prometheus-stack's own
# namespaceOverride.

keycloak:
  enabled: true
  namespace: keycloak
  image: quay.io/keycloak/keycloak:26.6.4
  realm: naira
  hostname: http://localhost:8080
  admin:
    username: admin
    password: admin
  resources:
    requests: { cpu: 200m, memory: 512Mi }
    limits: { cpu: 1000m, memory: 1Gi }

postgres:
  enabled: true
  namespace: litellm-db
  image: postgres:16-alpine
  database: litellm
  user: litellm
  password: litellm-local-password
  storage: 5Gi
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }

litellm:
  enabled: true
  namespace: litellm
  image: docker.litellm.ai/berriai/litellm:v1.97.0
  # LITELLM_MASTER_KEY: normally Secret-sourced (masterKeyFromSecret: true).
  # A scenario can flip this to false to get a plain container-env value
  # instead — needed by scenarios asserting on Secret-sourced-env discovery
  # (see e2e/litellm_chatbot_to_catalog_api's depl_uses_litellm plugin: it
  # must NOT also flag litellm's own pod as "using" its own models).
  masterKey: sk-local-litellm
  masterKeyFromSecret: true
  databaseUrl: postgresql://litellm:litellm-local-password@postgres.litellm-db.svc.cluster.local:5432/litellm
  # Arbitrary env-var-name: value map, merged into litellm-secrets and
  # referenced from modelList below via os.environ/<KEY>.
  apiKeys:
    OPENAI_API_KEY: change-me
    ANTHROPIC_API_KEY: change-me
    GEMINI_API_KEY: change-me
    OPENROUTER_API_KEY: change-me
  # Passed through verbatim as config.yaml's model_list — a scenario that
  # only needs a couple of models replaces this wholesale.
  modelList:
    - model_name: idp-gpt-4o-mini
      litellm_params: { model: openai/gpt-4o-mini, api_key: os.environ/OPENAI_API_KEY }
    - model_name: idp-claude-sonnet
      litellm_params: { model: anthropic/claude-3-5-sonnet-latest, api_key: os.environ/ANTHROPIC_API_KEY }
    - model_name: idp-gemini-flash
      litellm_params: { model: gemini/gemini-2.0-flash, api_key: os.environ/GEMINI_API_KEY }
    - model_name: idp-embedding-small
      litellm_params: { model: openai/text-embedding-3-small, api_key: os.environ/OPENAI_API_KEY }
    - model_name: openrouter-gpt-3.5-turbo
      litellm_params: { model: openrouter/openai/gpt-3.5-turbo, api_key: os.environ/OPENROUTER_API_KEY }
  mcpServers:
    mock_kb:
      url: http://mcp-mock.mcp-mock.svc.cluster.local:8080/mcp
      transport: http
      description: Mock MCP server for local development
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: 1, memory: 2Gi }

llamacpp:
  enabled: true
  namespace: llamacpp
  storage: 3Gi
  models:
    - name: llama-qwen25-05b
      modelFile: qwen2.5-0.5b-instruct-q4_k_m.gguf
      downloadUrl: https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf
      contextSize: "512"
      threads: "2"
      readinessDelay: 2
      resources:
        requests: { memory: 256Mi, cpu: 300m }
        limits: { memory: 1Gi, cpu: "2" }
    - name: llama-dummy-model
      modelFile: tiny-llama3-test-q2_k.gguf
      downloadUrl: https://huggingface.co/tensorblock/tiny-llama3-test-GGUF/resolve/main/tiny-llama3-test-Q2_K.gguf
      readinessDelay: 1
      resources:
        requests: { memory: 64Mi, cpu: 50m }
        limits: { memory: 128Mi, cpu: 200m }

vllm:
  # Off by default — llama.cpp uses less RAM for the same local-dev purpose.
  enabled: false
  namespace: vllm
  image: vllm/vllm-openai-cpu:latest
  model: facebook/opt-125m
  servedModelName: opt-125m
  resources:
    requests: { memory: 1Gi, cpu: 500m }
    limits: { memory: 4Gi, cpu: "1" }

mlflow:
  enabled: true
  namespace: mlflow
  image: ghcr.io/mlflow/mlflow:v3.1.4
  storage: 10Gi
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: 1, memory: 1Gi }

# openmetadata + openmetadata-dependencies: real upstream charts (see header).
openmetadata:
  enabled: true
  namespace: openmetadata
  mysqlPassword: openmetadata_password
  airflowPassword: admin
  config:
    pipelineServiceClientConfig:
      enabled: false

openmetadata-dependencies:
  airflow:
    enabled: false

# monitoring: kube-prometheus-stack, aliased — see header for namespaceOverride.
# kube-prometheus-stack's own top-level namespaceOverride only covers ITS
# OWN templates (prometheus, the operator) — grafana, kube-state-metrics and
# node-exporter are nested subcharts that each check their own
# namespaceOverride, so it's repeated at every level (all anchored to the
# same value so they can't drift). Nobody turns monitoring on in e2e today;
# if a scenario ever does, extend create-environment.sh's runtime overlay
# to override all four of these to ${NAMESPACE}, not just the top one.
monitoring:
  enabled: true
  namespaceOverride: &monitoringNamespace monitoring
  prometheus:
    prometheusSpec:
      serviceMonitorSelectorNilUsesHelmValues: false
      retention: 7d
      resources:
        requests: { cpu: 200m, memory: 256Mi }
        limits: { cpu: 500m, memory: 1Gi }
      storageSpec:
        volumeClaimTemplate:
          spec:
            accessModes: ["ReadWriteOnce"]
            resources:
              requests: { storage: 10Gi }
    ingress:
      enabled: false
    service:
      type: ClusterIP
  grafana:
    enabled: true
    namespaceOverride: *monitoringNamespace
    adminPassword: admin
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 200m, memory: 256Mi }
    ingress:
      enabled: false
    service:
      type: ClusterIP
  kubeStateMetrics:
    enabled: true
  "kube-state-metrics":
    namespaceOverride: *monitoringNamespace
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { cpu: 100m, memory: 256Mi }
  nodeExporter:
    enabled: true
  "prometheus-node-exporter":
    namespaceOverride: *monitoringNamespace
    resources:
      requests: { cpu: 25m, memory: 32Mi }
      limits: { cpu: 50m, memory: 64Mi }
  prometheusOperator:
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { cpu: 100m, memory: 128Mi }
  alertmanager:
    enabled: false
  prometheusAdapter:
    enabled: false
  thanos:
    enabled: false
  windows:
    enabled: false
