{{- if .Values.openmetadata.enabled }}
{{- /*
No Namespace resource here: this chart is installed with
`--namespace {{ .Values.openmetadata.namespace }} --create-namespace`
(see values.yaml header) since the openmetadata subchart has no namespace
override of its own — Helm already creates/owns that namespace via the
install flag, so templating it here too would conflict on first install.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secrets
  namespace: {{ .Values.openmetadata.namespace }}
  labels:
    {{- include "components.labels" . | nindent 4 }}
type: Opaque
stringData:
  openmetadata-mysql-password: {{ .Values.openmetadata.mysqlPassword }}
---
apiVersion: v1
kind: Secret
metadata:
  name: airflow-secrets
  namespace: {{ .Values.openmetadata.namespace }}
  labels:
    {{- include "components.labels" . | nindent 4 }}
type: Opaque
stringData:
  openmetadata-airflow-password: {{ .Values.openmetadata.airflowPassword }}
{{- end }}
