# Every optional field switched on (pod placement, pull Secrets, NetworkPolicy),
# so lint, kubeconform and the render tests see them rendered. Not a
# production recommendation.
imagePullSecrets:
  - name: regcred
catalog:
  secret:
    existingSecret: catalog-secrets
  podAnnotations: {example.com/scrape: "false"}
  priorityClassName: system-cluster-critical
  nodeSelector: {kubernetes.io/os: linux}
  tolerations:
    - {key: dedicated, operator: Equal, value: naira, effect: NoSchedule}
  podSecurityContext: {fsGroup: 65532}
  networkPolicy:
    enabled: true
    extraIngress:
      - from:
          - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: ingress-nginx}}
        ports:
          - {protocol: TCP, port: 8090}
portal:
  oidc:
    secret:
      existingSecret: portal-oidc
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - {key: kubernetes.io/arch, operator: In, values: [amd64, arm64]}
