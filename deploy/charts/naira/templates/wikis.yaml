{{- /*
One Deployment and Service per enabled entry of `wikis`, and the ConfigMap the
list is read from. validate.yaml runs first and rejects bad entries.
*/}}
{{- $enabled := list }}
{{- range .Values.wikis }}
{{- if include "naira.wikiEnabled" . }}
{{- $enabled = append $enabled . }}
{{- end }}
{{- end }}
{{- range $wiki := $enabled }}
{{- $name := printf "wiki-%s" (toString $wiki.id) }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "naira.labels" $ | nindent 4 }}
    {{- include "naira.selector" (dict "root" $ "name" $name) | nindent 4 }}
    app.kubernetes.io/component: wiki
spec:
  replicas: {{ $.Values.wikiDefaults.replicas }}
  selector:
    matchLabels:
      {{- include "naira.selector" (dict "root" $ "name" $name) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "naira.labels" $ | nindent 8 }}
        {{- include "naira.selector" (dict "root" $ "name" $name) | nindent 8 }}
        app.kubernetes.io/component: wiki
    spec:
      # Wiki code must not reach the Kubernetes API, and not as the catalog's ServiceAccount.
      automountServiceAccountToken: false
      {{- include "naira.podSpec" (dict "root" $ "name" $name "cfg" $.Values.wikiDefaults) | trim | nindent 6 }}
      containers:
        - name: wiki
          # The digest-pinned reference as given; naira.image would build repo:tag.
          image: {{ $wiki.image | quote }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          # No runAsUser: the image contract says non-root, not which uid.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile: {type: RuntimeDefault}
          # 8080 and /naira-wiki.json are part of the wiki image contract.
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /naira-wiki.json, port: http}
            periodSeconds: 10
          resources:
            {{- toYaml $.Values.wikiDefaults.resources | nindent 12 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 16Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "naira.labels" $ | nindent 4 }}
    {{- include "naira.selector" (dict "root" $ "name" $name) | nindent 4 }}
    app.kubernetes.io/component: wiki
spec:
  type: ClusterIP
  selector:
    {{- include "naira.selector" (dict "root" $ "name" $name) | nindent 4 }}
  ports:
    - {name: http, port: 8080, targetPort: http}
{{- end }}
{{- /* Primary first, then order, then id. The key sorts as text, so order is shifted and padded. */}}
{{- $byKey := dict }}
{{- range $enabled }}
{{- $primary := eq (toString .primary) "true" }}
{{- $_ := set $byKey (printf "%s|%07d|%s" (ternary "0" "1" $primary) (add 1000000 (int .order)) (toString .id)) . }}
{{- end }}
{{- $entries := list }}
{{- range $key := keys $byKey | sortAlpha }}
{{- $wiki := get $byKey $key }}
{{- $id := toString $wiki.id }}
{{- $entry := dict "id" $id "label" ($wiki.label | default $id) "primary" (eq (toString $wiki.primary) "true") "order" (int $wiki.order) "url" (include "naira.wikiUrl" (dict "root" $ "id" $id)) }}
{{- with $wiki.owner }}{{ $_ := set $entry "owner" . }}{{ end }}
{{- with $wiki.source }}{{ $_ := set $entry "source" . }}{{ end }}
{{- $entries = append $entries $entry }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: wikis
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "naira.labels" . | nindent 4 }}
data:
  wikis.json: |
    {{- toPrettyJson $entries | nindent 4 }}
