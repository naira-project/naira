{{- if and .Values.catalog.enabled .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "naira.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "naira.labels" . | nindent 4 }}
    app.kubernetes.io/component: catalog
{{- end }}
