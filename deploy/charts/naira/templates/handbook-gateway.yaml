{{- /*
The handbook gateway: one Envoy that serves every enabled handbook on its own address,
<id>.<handbookGateway.domain>. envoy.yaml is generated from handbooks, handbookGateway and
keycloak; validate.yaml runs first and rejects bad values.
*/}}

{{- /* Contact line of the degraded page, as HTML: the owner and a link to the source. */}}
{{- define "naira.handbookContact" -}}
{{- $parts := list -}}
{{- if .owner }}{{ $parts = append $parts (printf "Owner: %s." (html (toString .owner))) }}{{ end -}}
{{- if and .source (regexMatch "^https?://\\S+$" (toString .source)) }}
{{- $parts = append $parts (printf "<a href=\"%s\">Source repository</a>." (html (toString .source))) }}
{{- end -}}
{{- if $parts }}{{ join " " $parts }}{{ else }}Contact the owner of this handbook.{{ end -}}
{{- end -}}

{{- /* Per-route JWT check. Usage: include "naira.handbookGatewayJwt" "cookie"; "" turns the check off. */}}
{{- define "naira.handbookGatewayJwt" -}}
typed_per_filter_config:
  envoy.filters.http.jwt_authn:
    "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.PerRouteConfig
    {{- if . }}
    requirement_name: {{ . }}
    {{- else }}
    disabled: true
    {{- end }}
{{- end -}}

{{- /*
A route to a handbook. The cookie is the gateway's own, so the handbook never sees it.
Usage: include "naira.handbookGatewayProxy" (dict "cluster" "handbook-x" "label" "X" "contact" "...")
*/}}
{{- define "naira.handbookGatewayProxy" -}}
metadata:
  filter_metadata:
    naira.handbook: {label: {{ .label | quote }}, contact: {{ .contact | quote }}}
request_headers_to_remove: [cookie]
route: {cluster: {{ .cluster | quote }}}
{{- end -}}

{{- define "naira.handbookGatewayConfig" -}}
{{- $gw := .Values.handbookGateway -}}
{{- $kc := .Values.keycloak -}}
{{- /* Empty for a bad baseUrl, which validate.yaml then rejects. */}}
{{- $kcEnd := include "naira.keycloakEndpoint" . | fromJson -}}
{{- $jwks := printf "%s/realms/%s/protocol/openid-connect/certs" (trimSuffix "/" (toString $kc.baseUrl)) (toString $kc.realm) -}}
{{- /* Over http (kind) browsers differ on Secure cookies, so the attribute follows the scheme. */}}
{{- $cookie := ternary "naira_handbook=%REQ(x-naira-token)%; HttpOnly; Secure; SameSite=Lax; Path=/" "naira_handbook=%REQ(x-naira-token)%; HttpOnly; SameSite=Lax; Path=/" (eq (toString $gw.scheme) "https") -}}
{{- $port := int $gw.port -}}
{{- $enabled := dict -}}
{{- range .Values.handbooks -}}
{{- if include "naira.handbookEnabled" . -}}{{- $_ := set $enabled (toString .id) . -}}{{- end -}}
{{- end -}}
{{- $ids := keys $enabled | sortAlpha -}}
# Generated by the naira chart from handbooks, handbookGateway and keycloak.
# Only /_naira/bootstrap.html and /_naira/assets/ are open. /_naira/session reads the token from a header.
admin:
  address: {socket_address: {address: 127.0.0.1, port_value: 9901}}
static_resources:
  listeners:
    - name: handbook
      address: {socket_address: {address: 0.0.0.0, port_value: 8080}}
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: handbook
                # The route and JWT rules see the normalized path, so /_naira/assets/../x gets the cookie check.
                normalize_path: true
                merge_slashes: true
                path_with_escaped_slashes_action: UNESCAPE_AND_REDIRECT
                # Keeps Envoy from naming itself; the handbook's own Server header is removed on the route config.
                server_header_transformation: PASS_THROUGH
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                local_reply_config:
                  mappers:
                    - filter:
                        status_code_filter:
                          comparison: {op: EQ, value: {default_value: 401, runtime_key: naira.handbook.unauthorized}}
                      body_format_override:
                        content_type: text/html; charset=utf-8
                        text_format_source:
                          inline_string: {{ .Files.Get "files/handbook-gateway/unauthorized.html" | quote }}
                      headers_to_add:
                        - {header: {key: cache-control, value: no-store}}
                    - filter:
                        response_flag_filter: {flags: [UH, UF, UC]}
                      status_code: 503
                      body_format_override:
                        content_type: text/html; charset=utf-8
                        text_format_source:
                          inline_string: {{ .Files.Get "files/handbook-gateway/unavailable.html" | quote }}
                      headers_to_add:
                        - {header: {key: cache-control, value: no-store}}
                http_filters:
                  - name: envoy.filters.http.jwt_authn
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.JwtAuthentication
                      providers:
                        keycloak_header:
                          issuer: {{ $kc.issuer | quote }}
                          # Kept so the Set-Cookie value can be built from the header.
                          forward: true
                          from_headers: [{name: x-naira-token}]
                          remote_jwks:
                            http_uri: {uri: {{ $jwks | quote }}, cluster: keycloak-jwks, timeout: 5s}
                            cache_duration: 600s
                        keycloak_cookie:
                          issuer: {{ $kc.issuer | quote }}
                          from_cookies: [naira_handbook]
                          remote_jwks:
                            http_uri: {uri: {{ $jwks | quote }}, cluster: keycloak-jwks, timeout: 5s}
                            cache_duration: 600s
                      requirement_map:
                        header: {provider_name: keycloak_header}
                        cookie: {provider_name: keycloak_cookie}
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                      suppress_envoy_headers: true
                route_config:
                  name: handbooks
                  response_headers_to_remove: [server]
                  virtual_hosts:
{{- range $id := $ids }}
{{- $handbook := get $enabled $id }}
{{- $host := printf "%s.%s" $id $gw.domain }}
{{- $proxy := dict "cluster" (printf "handbook-%s" $id) "label" (html (toString ($handbook.label | default $id))) "contact" (include "naira.handbookContact" $handbook) }}
                    - name: handbook-{{ $id }}
                      domains: [{{ $host | quote }}, {{ printf "%s:%d" $host $port | quote }}]
                      response_headers_to_add:
                        - header: {key: content-security-policy, value: {{ printf "frame-ancestors %s" $gw.portalOrigin | quote }}}
                          append_action: OVERWRITE_IF_EXISTS_OR_ADD
                      routes:
                        - match:
                            path: /_naira/session
                            headers: [{name: ":method", string_match: {exact: POST}}]
                          {{- include "naira.handbookGatewayJwt" "header" | nindent 26 }}
                          direct_response: {status: 204}
                          response_headers_to_add:
                            - header: {key: set-cookie, value: {{ $cookie | quote }}}
                        - match: {path: /_naira/session}
                          {{- include "naira.handbookGatewayJwt" "" | nindent 26 }}
                          direct_response: {status: 405}
                          response_headers_to_add:
                            - header: {key: allow, value: POST}
                        - match: {path: /_naira/bootstrap.html}
                          {{- include "naira.handbookGatewayJwt" "" | nindent 26 }}
                          {{- include "naira.handbookGatewayProxy" $proxy | nindent 26 }}
                        - match: {prefix: /_naira/assets/}
                          {{- include "naira.handbookGatewayJwt" "" | nindent 26 }}
                          {{- include "naira.handbookGatewayProxy" $proxy | nindent 26 }}
                        - match: {prefix: /}
                          {{- include "naira.handbookGatewayJwt" "cookie" | nindent 26 }}
                          {{- include "naira.handbookGatewayProxy" $proxy | nindent 26 }}
{{- end }}
                    - name: default
                      domains: ["*"]
                      routes:
                        - match: {prefix: /}
                          {{- include "naira.handbookGatewayJwt" "" | nindent 26 }}
                          direct_response: {status: 404, body: {inline_string: "not found\n"}}
  clusters:
    - name: keycloak-jwks
      type: STRICT_DNS
      connect_timeout: 2s
      load_assignment:
        cluster_name: keycloak-jwks
        endpoints:
          - lb_endpoints:
              - endpoint: {address: {socket_address: {address: {{ $kcEnd.host | quote }}, port_value: {{ int $kcEnd.port }} }}}
{{- if $kcEnd.tls }}
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
          sni: {{ $kcEnd.host | quote }}
          common_tls_context:
            validation_context:
              trusted_ca: {filename: /etc/ssl/certs/ca-certificates.crt}
              match_typed_subject_alt_names:
                - san_type: DNS
                  matcher: {exact: {{ $kcEnd.host | quote }}}
{{- end }}
{{- range $id := $ids }}
    - name: handbook-{{ $id }}
      type: STRICT_DNS
      connect_timeout: 2s
      # Without this Envoy sends traffic to unhealthy hosts once none is healthy.
      common_lb_config: {healthy_panic_threshold: {value: 0}}
      health_checks:
        - timeout: 2s
          interval: 5s
          # A cluster nobody has used yet is otherwise checked every 60 s.
          no_traffic_interval: 5s
          unhealthy_threshold: 2
          healthy_threshold: 1
          http_health_check: {path: /naira-handbook.json}
      load_assignment:
        cluster_name: handbook-{{ $id }}
        endpoints:
          - lb_endpoints:
              - endpoint: {address: {socket_address: {address: handbook-{{ $id }}.{{ $.Release.Namespace }}.svc.cluster.local, port_value: 8080}}}
{{- end }}
{{- end -}}

{{- if include "naira.hasHandbooks" . }}
{{- $gw := .Values.handbookGateway }}
{{- $img := $gw.image | default dict }}
{{- $name := include "naira.handbookGatewayName" . }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "naira.labels" . | nindent 4 }}
data:
  envoy.yaml: |
    {{- include "naira.handbookGatewayConfig" . | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "naira.labels" . | nindent 4 }}
    {{- include "naira.selector" (dict "root" . "name" $name) | nindent 4 }}
spec:
  replicas: {{ $gw.replicas }}
  selector:
    matchLabels:
      {{- include "naira.selector" (dict "root" . "name" $name) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "naira.labels" . | nindent 8 }}
        {{- include "naira.selector" (dict "root" . "name" $name) | nindent 8 }}
      annotations:
        checksum/config: {{ include "naira.handbookGatewayConfig" . | sha256sum }}
        {{- with $gw.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      # The gateway needs no Kubernetes API access.
      automountServiceAccountToken: false
      {{- include "naira.podSpec" (dict "root" . "name" $name "cfg" $gw) | trim | nindent 6 }}
      containers:
        - name: envoy
          # The digest-pinned reference as given; naira.image would build repo:tag.
          image: {{ printf "%s@%s" (toString $img.repository) (toString $img.digest) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Two workers are enough for static sites; the default is one per CPU of the node.
          args: ["-c", "/etc/envoy/envoy.yaml", "--concurrency", "2"]
          {{- with $gw.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - {name: http, containerPort: 8080}
          # The admin interface is on loopback, which kubelet probes (pod IP) cannot reach.
          readinessProbe:
            tcpSocket: {port: http}
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: http}
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml $gw.resources | nindent 12 }}
          volumeMounts:
            - {name: config, mountPath: /etc/envoy, readOnly: true}
      volumes:
        - name: config
          configMap: {name: {{ $name }}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "naira.labels" . | nindent 4 }}
    {{- include "naira.selector" (dict "root" . "name" $name) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "naira.selector" (dict "root" . "name" $name) | nindent 4 }}
  ports:
    - {name: http, port: 8080, targetPort: http}
{{- end }}
