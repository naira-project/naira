{{- if .Values.catalog.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "naira.labels" . | nindent 4 }}
    {{- include "naira.selector" (dict "root" . "name" "catalog") | nindent 4 }}
spec:
  replicas: {{ .Values.catalog.replicas }}
  selector:
    matchLabels:
      {{- include "naira.selector" (dict "root" . "name" "catalog") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "naira.labels" . | nindent 8 }}
        {{- include "naira.selector" (dict "root" . "name" "catalog") | nindent 8 }}
      annotations:
        checksum/plugin-config: {{ include (print $.Template.BasePath "/plugin-configmaps.yaml") . | sha256sum }}
    spec:
      serviceAccountName: catalog
      initContainers:
        {{- range $name, $p := .Values.catalog.plugins }}
        {{- if $p.enabled }}
        - name: plugin-{{ $name }}
          image: {{ include "naira.image" (dict "root" $ "image" $p.image) | quote }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          restartPolicy: Always
          env:
            - name: PORT
              value: {{ $p.port | quote }}
            {{- with $p.pathPrefix }}
            - name: PATH_PREFIX
              value: {{ . | quote }}
            {{- end }}
            {{- include "naira.env" (dict "root" $ "env" $p.env) | nindent 12 }}
          {{- if $p.config }}
          volumeMounts:
            - name: plugin-{{ $name }}-config
              mountPath: {{ $p.config.mountPath }}
              readOnly: true
          {{- end }}
          resources:
            {{- include "naira.pluginResources" (dict "root" $ "plugin" $p) | nindent 12 }}
        {{- end }}
        {{- end }}
      containers:
        - name: catalog
          image: {{ include "naira.image" (dict "root" $ "image" .Values.catalog.image) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          volumeMounts:
            - {name: plugin-config, mountPath: /etc/catalog/plugins.yaml, subPath: plugins.yaml, readOnly: true}
          env:
            - name: PORT
              value: {{ .Values.catalog.port | quote }}
            - name: KEYCLOAK_BASE_URL
              value: {{ .Values.dependencies.keycloak.baseUrl | quote }}
            - name: KEYCLOAK_REALM
              value: {{ .Values.dependencies.keycloak.realm | quote }}
            - name: KEYCLOAK_ISSUER
              value: {{ .Values.dependencies.keycloak.issuer | quote }}
          ports:
            - {name: http, containerPort: {{ .Values.catalog.port }}}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.catalog.resources | nindent 12 }}
      volumes:
        - name: plugin-config
          configMap: {name: catalog-plugin-config}
        {{- range $name, $p := .Values.catalog.plugins }}
        {{- if and $p.enabled $p.config }}
        - name: plugin-{{ $name }}-config
          configMap:
            name: {{ $p.config.existingConfigMap | default (printf "plugin-%s-config" $name) }}
        {{- end }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: catalog
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "naira.labels" . | nindent 4 }}
    {{- include "naira.selector" (dict "root" . "name" "catalog") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "naira.selector" (dict "root" . "name" "catalog") | nindent 4 }}
  ports:
    - {name: http, port: {{ .Values.catalog.port }}, targetPort: http}
{{- end }}
