{{- /* Development only. Every other path supplies these Secrets (RFC-009 P4). */}}
{{- if and .Values.catalog.enabled .Values.catalog.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "naira.catalogSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "naira.labels" . | nindent 4 }}
    {{- include "naira.selector" (dict "root" . "name" "catalog") | nindent 4 }}
  annotations:
    naira.io/warning: "Generated from chart values. Development only."
type: Opaque
stringData:
  {{- toYaml .Values.catalog.secret.data | nindent 2 }}
{{- end }}
{{- if and .Values.portal.enabled .Values.portal.oidc.secret.create }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "naira.portalSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "naira.labels" . | nindent 4 }}
    {{- include "naira.selector" (dict "root" . "name" "portal") | nindent 4 }}
  annotations:
    naira.io/warning: "Generated from chart values. Development only."
type: Opaque
stringData:
  {{ .Values.portal.oidc.secret.key }}: {{ .Values.portal.oidc.secret.value | quote }}
{{- end }}
