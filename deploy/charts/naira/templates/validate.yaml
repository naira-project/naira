{{- /*
Renders no objects; fails the render on invalid values. Must not be a `_*.tpl`
partial: Helm never executes a partial's top-level content, so `fail` there
silently does nothing.
*/}}
{{- if and .Values.catalog.secret.existingSecret .Values.catalog.secret.create }}
{{- fail "catalog.secret: set existingSecret or create, not both" }}
{{- end }}
{{- if and .Values.portal.oidc.secret.existingSecret .Values.portal.oidc.secret.create }}
{{- fail "portal.oidc.secret: set existingSecret or create, not both" }}
{{- end }}
{{- if and .Values.catalog.secret.create (not .Values.catalog.secret.data) }}
{{- fail "catalog.secret.create is true but catalog.secret.data is empty" }}
{{- end }}
{{- if and .Values.portal.oidc.secret.create (not .Values.portal.oidc.secret.value) }}
{{- fail "portal.oidc.secret.create is true but portal.oidc.secret.value is empty" }}
{{- end }}
{{- $ports := dict (toString .Values.catalog.port) "catalog" }}
{{- range $name, $p := .Values.catalog.plugins }}
{{- if $p.enabled }}
{{- $port := toString $p.port }}
{{- if hasKey $ports $port }}
{{- fail (printf "catalog.plugins: %s and %s both use port %s" (get $ports $port) $name $port) }}
{{- end }}
{{- $_ := set $ports $port $name }}
{{- if gt (len (printf "plugin-%s" $name)) 63 }}
{{- fail (printf "catalog.plugins.%s: name too long; the sidecar name plugin-%s exceeds 63 characters" $name $name) }}
{{- end }}
{{- if and $p.config (not $p.config.existingConfigMap) (not $p.config.data) }}
{{- fail (printf "catalog.plugins.%s.config: set existingConfigMap or data" $name) }}
{{- end }}
{{- range $var, $v := $p.env }}
{{- if and (kindIs "map" $v) (not $v.secretKeyRef.key) }}
{{- fail (printf "catalog.plugins.%s.env.%s: secretKeyRef.key is required" $name $var) }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- /*
No Secret source. Without these the render succeeds and the pod sits in
CreateContainerConfigError; fail here with the fix instead.
*/}}
{{- $s := .Values.catalog.secret }}
{{- if and .Values.catalog.enabled (not $s.existingSecret) (not $s.create) }}
{{- range $name, $p := .Values.catalog.plugins }}
{{- if $p.enabled }}
{{- range $var, $v := $p.env }}
{{- if and (kindIs "map" $v) (not $v.secretKeyRef.name) }}
{{- fail (printf "catalog.plugins.%s reads %s from the catalog Secret: set catalog.secret.existingSecret or catalog.secret.create" $name $var) }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- $o := .Values.portal.oidc.secret }}
{{- if and .Values.portal.enabled (not $o.existingSecret) (not $o.create) }}
{{- fail "portal reads its OIDC client secret: set portal.oidc.secret.existingSecret or portal.oidc.secret.create" }}
{{- end }}
{{- /* PostgreSQL and db-init. */}}
{{- if and .Values.postgresql.enabled .Values.database.host }}
{{- fail "database.host: leave empty while postgresql.enabled (the subchart's Service is used)" }}
{{- end }}
{{- $admin := .Values.database.admin.secret }}
{{- if and .Values.postgresql.enabled (ne (toString .Values.postgresql.auth.existingSecret) (include "naira.dbAdminSecretName" .)) }}
{{- fail (printf "postgresql.auth.existingSecret must equal the database.admin Secret %q" (include "naira.dbAdminSecretName" .)) }}
{{- end }}
{{- $dbs := 0 }}
{{- range $name, $db := .Values.database.databases }}
{{- if $db.enabled }}
{{- $dbs = add1 $dbs }}
{{- if not (regexMatch "^[a-z]([a-z0-9-]*[a-z0-9])?$" $name) }}
{{- fail (printf "database.databases.%s: name must match ^[a-z]([a-z0-9-]*[a-z0-9])?$" $name) }}
{{- end }}
{{- $s := $db.secret | default dict }}
{{- if and $s.existingSecret $s.create }}
{{- fail (printf "database.databases.%s.secret: set existingSecret or create, not both" $name) }}
{{- end }}
{{- if and $s.create (not $s.password) }}
{{- fail (printf "database.databases.%s.secret.create is true but password is empty" $name) }}
{{- end }}
{{- if and (not $s.existingSecret) (not $s.create) }}
{{- fail (printf "database.databases.%s: set secret.existingSecret or secret.create" $name) }}
{{- end }}
{{- end }}
{{- end }}
{{- if and $dbs (not .Values.postgresql.enabled) (not .Values.database.host) }}
{{- fail "postgresql.enabled is false: set database.host to the external server" }}
{{- end }}
{{- if or .Values.postgresql.enabled $dbs }}
{{- if and $admin.existingSecret $admin.create }}
{{- fail "database.admin.secret: set existingSecret or create, not both" }}
{{- end }}
{{- if and $admin.create (not $admin.password) }}
{{- fail "database.admin.secret.create is true but password is empty" }}
{{- end }}
{{- if and (not $admin.existingSecret) (not $admin.create) }}
{{- fail "database.admin.secret: set existingSecret or create" }}
{{- end }}
{{- end }}
