{{- /*
Renders no objects; fails the render on invalid values. Must not be a `_*.tpl`
partial: Helm never executes a partial's top-level content, so `fail` there
silently does nothing.
*/}}
{{- if and .Values.catalog.secret.existingSecret .Values.catalog.secret.create }}
{{- fail "catalog.secret: set existingSecret or create, not both" }}
{{- end }}
{{- if and .Values.portal.oidc.secret.existingSecret .Values.portal.oidc.secret.create }}
{{- fail "portal.oidc.secret: set existingSecret or create, not both" }}
{{- end }}
{{- if and .Values.catalog.secret.create (not .Values.catalog.secret.data) }}
{{- fail "catalog.secret.create is true but catalog.secret.data is empty" }}
{{- end }}
{{- if and .Values.portal.oidc.secret.create (not .Values.portal.oidc.secret.value) }}
{{- fail "portal.oidc.secret.create is true but portal.oidc.secret.value is empty" }}
{{- end }}
{{- $ports := dict (toString .Values.catalog.port) "catalog" }}
{{- range $name, $p := .Values.catalog.plugins }}
{{- if $p.enabled }}
{{- $port := toString $p.port }}
{{- if hasKey $ports $port }}
{{- fail (printf "catalog.plugins: %s and %s both use port %s" (get $ports $port) $name $port) }}
{{- end }}
{{- $_ := set $ports $port $name }}
{{- if gt (len (printf "plugin-%s" $name)) 63 }}
{{- fail (printf "catalog.plugins.%s: name too long; the sidecar name plugin-%s exceeds 63 characters" $name $name) }}
{{- end }}
{{- if and $p.config (not $p.config.existingConfigMap) (not $p.config.data) }}
{{- fail (printf "catalog.plugins.%s.config: set existingConfigMap or data" $name) }}
{{- end }}
{{- range $var, $v := $p.env }}
{{- if and (kindIs "map" $v) (not $v.secretKeyRef.key) }}
{{- fail (printf "catalog.plugins.%s.env.%s: secretKeyRef.key is required" $name $var) }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- /*
No Secret source. Without these the render succeeds and the pod sits in
CreateContainerConfigError; fail here with the fix instead.
*/}}
{{- $s := .Values.catalog.secret }}
{{- if and .Values.catalog.enabled (not $s.existingSecret) (not $s.create) }}
{{- range $name, $p := .Values.catalog.plugins }}
{{- if $p.enabled }}
{{- range $var, $v := $p.env }}
{{- if and (kindIs "map" $v) (not $v.secretKeyRef.name) }}
{{- fail (printf "catalog.plugins.%s reads %s from the catalog Secret: set catalog.secret.existingSecret or catalog.secret.create" $name $var) }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- $o := .Values.portal.oidc.secret }}
{{- if and .Values.portal.enabled (not $o.existingSecret) (not $o.create) }}
{{- fail "portal reads its OIDC client secret: set portal.oidc.secret.existingSecret or portal.oidc.secret.create" }}
{{- end }}
{{- /* PostgreSQL and db-init. */}}
{{- if and .Values.postgresql.enabled .Values.database.host }}
{{- fail "database.host: leave empty while postgresql.enabled (the subchart's Service is used)" }}
{{- end }}
{{- $admin := .Values.database.admin.secret }}
{{- if and .Values.postgresql.enabled (ne (toString .Values.postgresql.auth.existingSecret) (include "naira.dbAdminSecretName" .)) }}
{{- fail (printf "postgresql.auth.existingSecret must equal the database.admin Secret %q" (include "naira.dbAdminSecretName" .)) }}
{{- end }}
{{- $dbs := 0 }}
{{- range $name, $db := .Values.database.databases }}
{{- if $db.enabled }}
{{- $dbs = add1 $dbs }}
{{- if not (regexMatch "^[a-z]([a-z0-9-]*[a-z0-9])?$" $name) }}
{{- fail (printf "database.databases.%s: name must match ^[a-z]([a-z0-9-]*[a-z0-9])?$" $name) }}
{{- end }}
{{- /* db-init would reset these roles' passwords or take over these databases. */}}
{{- if has $name (list "postgres" "template0" "template1" $.Values.database.admin.username) }}
{{- fail (printf "database.databases.%s: reserved name (built-in database or database.admin.username)" $name) }}
{{- end }}
{{- $s := $db.secret | default dict }}
{{- if and $s.existingSecret $s.create }}
{{- fail (printf "database.databases.%s.secret: set existingSecret or create, not both" $name) }}
{{- end }}
{{- if and $s.create (not $s.password) }}
{{- fail (printf "database.databases.%s.secret.create is true but password is empty" $name) }}
{{- end }}
{{- if and (not $s.existingSecret) (not $s.create) }}
{{- fail (printf "database.databases.%s: set secret.existingSecret or secret.create" $name) }}
{{- end }}
{{- end }}
{{- end }}
{{- if and $dbs (not .Values.postgresql.enabled) (not .Values.database.host) }}
{{- fail "postgresql.enabled is false: set database.host to the external server" }}
{{- end }}
{{- if or .Values.postgresql.enabled $dbs }}
{{- if and $admin.existingSecret $admin.create }}
{{- fail "database.admin.secret: set existingSecret or create, not both" }}
{{- end }}
{{- if and $admin.create (not $admin.password) }}
{{- fail "database.admin.secret.create is true but password is empty" }}
{{- end }}
{{- if and (not $admin.existingSecret) (not $admin.create) }}
{{- fail "database.admin.secret: set existingSecret or create" }}
{{- end }}
{{- end }}
{{- /*
Handbooks. An entry's id is checked whether or not it is enabled, the rest only for
enabled entries: a parked entry may be unfinished. Any failure stops the whole
render, so the previous release keeps running.
*/}}
{{- $ids := dict }}
{{- $primaries := list }}
{{- range $i, $w := .Values.handbooks }}
{{- if not (kindIs "map" $w) }}
{{- fail (printf "handbooks[%d]: must be a map" $i) }}
{{- end }}
{{- $id := toString (default "" $w.id) }}
{{- if not $id }}
{{- fail (printf "handbooks[%d]: id is required" $i) }}
{{- end }}
{{- if not (regexMatch "^[a-z0-9]([-a-z0-9]{0,40}[a-z0-9])?$" $id) }}
{{- fail (printf "handbooks[%d]: invalid id %q: use lowercase letters, digits and \"-\", at most 42 characters, not starting or ending with \"-\"" $i $id) }}
{{- end }}
{{- if hasKey $ids $id }}
{{- fail (printf "handbooks[%s]: duplicate id (entries %d and %d)" $id (int (get $ids $id)) $i) }}
{{- end }}
{{- $_ := set $ids $id $i }}
{{- if eq (printf "handbook-%s" $id) (include "naira.handbookGatewayName" $) }}
{{- fail (printf "handbooks[%s]: id is reserved, it would name the same objects as the handbook gateway" $id) }}
{{- end }}
{{- if include "naira.handbookEnabled" $w }}
{{- $contract := toString (default "" $w.contract) }}
{{- if ne $contract "naira.handbook/v1alpha1" }}
{{- fail (printf "handbooks[%s]: unsupported contract %q; supported: naira.handbook/v1alpha1" $id $contract) }}
{{- end }}
{{- $image := toString (default "" $w.image) }}
{{- if not $image }}
{{- fail (printf "handbooks[%s]: image is required, as name@sha256:<digest>" $id) }}
{{- end }}
{{- if not (regexMatch "^[^@[:space:]]+@sha256:[a-f0-9]{64}$" $image) }}
{{- fail (printf "handbooks[%s]: image must be pinned by digest, as name@sha256:<64 lowercase hex digits>, got %q" $id $image) }}
{{- end }}
{{- $registries := default (list) $.Values.handbookGateway.allowedRegistries }}
{{- if not $registries }}
{{- fail (printf "handbooks[%s]: handbookGateway.allowedRegistries is empty, so no handbook image is allowed" $id) }}
{{- end }}
{{- $allowed := false }}
{{- range $registries }}
{{- if hasPrefix (printf "%s/" (trimSuffix "/" (toString .))) $image }}
{{- $allowed = true }}
{{- end }}
{{- end }}
{{- if not $allowed }}
{{- fail (printf "handbooks[%s]: image %q is not from an allowed registry (handbookGateway.allowedRegistries: %s)" $id $image (join ", " $registries)) }}
{{- end }}
{{- if hasKey $w "order" }}
{{- $o := $w.order }}
{{- if not (and (or (kindIs "float64" $o) (kindIs "int64" $o)) (eq (float64 $o) (floor (float64 $o))) (ge (float64 $o) -100000.0) (le (float64 $o) 100000.0)) }}
{{- fail (printf "handbooks[%s]: order must be a whole number from -100000 to 100000, got %v" $id $o) }}
{{- end }}
{{- end }}
{{- if eq (toString $w.primary) "true" }}
{{- $primaries = append $primaries $id }}
{{- end }}
{{- end }}
{{- end }}
{{- if gt (len $primaries) 1 }}
{{- fail (printf "handbooks: more than one primary handbook (%s); set primary on one handbook only" (join ", " $primaries)) }}
{{- end }}
{{- /* The address is built from these, so they are checked once a handbook is enabled. */}}
{{- if include "naira.hasHandbooks" . }}
{{- $gw := .Values.handbookGateway }}
{{- if not (regexMatch "^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?)*$" (toString (default "" $gw.domain))) }}
{{- fail (printf "handbookGateway.domain: %q is not a host name; use lowercase letters, digits, \"-\" and \".\", without scheme, port or path" (toString (default "" $gw.domain))) }}
{{- end }}
{{- if not (has (toString (default "" $gw.scheme)) (list "http" "https")) }}
{{- fail (printf "handbookGateway.scheme: must be http or https, got %q" (toString (default "" $gw.scheme))) }}
{{- end }}
{{- $p := $gw.port }}
{{- if not (and (or (kindIs "float64" $p) (kindIs "int64" $p)) (eq (float64 $p) (floor (float64 $p))) (ge (float64 $p) 1.0) (le (float64 $p) 65535.0)) }}
{{- fail (printf "handbookGateway.port: must be a whole number from 1 to 65535, got %v" $p) }}
{{- end }}
{{- /* The gateway's Envoy config is built from these. */}}
{{- $img := $gw.image | default dict }}
{{- if not $img.repository }}
{{- fail "handbookGateway.image.repository is required" }}
{{- end }}
{{- if not (regexMatch "^sha256:[a-f0-9]{64}$" (toString (default "" $img.digest))) }}
{{- fail (printf "handbookGateway.image.digest: must be sha256:<64 lowercase hex digits>, got %q" (toString (default "" $img.digest))) }}
{{- end }}
{{- /* The origin is written into a Content-Security-Policy header, so nothing else may ride along. */}}
{{- if not (regexMatch "^https?://[a-z0-9]([-a-z0-9.]*[a-z0-9])?(:[0-9]{1,5})?$" (toString (default "" $gw.portalOrigin))) }}
{{- fail (printf "handbookGateway.portalOrigin: must be an origin, scheme://host[:port], got %q" (toString (default "" $gw.portalOrigin))) }}
{{- end }}
{{- if not (include "naira.keycloakEndpoint" .) }}
{{- fail (printf "keycloak.baseUrl: must be an http or https URL with a host, got %q" (toString (default "" .Values.keycloak.baseUrl))) }}
{{- end }}
{{- if not .Values.keycloak.issuer }}
{{- fail "keycloak.issuer is required" }}
{{- end }}
{{- if not .Values.keycloak.realm }}
{{- fail "keycloak.realm is required" }}
{{- end }}
{{- end }}
