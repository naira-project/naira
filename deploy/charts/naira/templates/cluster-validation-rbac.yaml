{{- if and .Values.catalog.enabled .Values.catalog.clusterValidation.credentialSecrets }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: catalog-cluster-validation
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "naira.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames:
      {{- range .Values.catalog.clusterValidation.credentialSecrets }}
      - {{ .name | quote }}
      {{- end }}
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: catalog-cluster-validation
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "naira.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: catalog
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: catalog-cluster-validation
{{- end }}