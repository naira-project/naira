{{- if and .Values.catalog.enabled .Values.catalog.secret.create }}
{{- if .Values.catalog.secret.existingSecret }}
{{- fail "catalog.secret: set existingSecret OR create, not both" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "naira.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "naira.labels" . | nindent 4 }}
  annotations:
    naira.io/warning: "Generated from chart values. Development only — real environments use an ExternalSecret."
type: Opaque
stringData:
  {{- toYaml .Values.catalog.secret.data | nindent 2 }}
{{- end }}
{{- if and .Values.portal.enabled .Values.portal.oidc.secret.create }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "naira.fullname" . }}-portal-oidc
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "naira.labels" . | nindent 4 }}
  annotations:
    naira.io/warning: "Generated from chart values. Development only — real environments use an ExternalSecret."
type: Opaque
stringData:
  {{ .Values.portal.oidc.secret.key }}: {{ .Values.portal.oidc.secret.value | quote }}
{{- end }}
