{{- if and .Values.catalog.enabled .Values.catalog.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: catalog
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "naira.labels" . | nindent 4 }}
    {{- include "naira.selector" (dict "root" . "name" "catalog") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "naira.selector" (dict "root" . "name" "catalog") | nindent 6 }}
  policyTypes: [Ingress]
  {{- if or .Values.ui.enabled .Values.catalog.networkPolicy.extraIngress }}
  ingress:
    {{- if .Values.ui.enabled }}
    - from:
        - podSelector:
            matchLabels:
              {{- include "naira.selector" (dict "root" . "name" "ui") | nindent 14 }}
      ports:
        - {protocol: TCP, port: {{ .Values.catalog.port }}}
    {{- end }}
    {{- with .Values.catalog.networkPolicy.extraIngress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
{{- end }}
{{- if and .Values.wikiGateway.networkPolicy.enabled (include "naira.hasWikis" .) }}
{{- $gateway := dict "root" . "name" (include "naira.wikiGatewayName" .) }}
{{- $wikis := dict "app.kubernetes.io/instance" .Release.Name "app.kubernetes.io/component" "wiki" }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: wiki-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "naira.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- toYaml $wikis | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "naira.selector" $gateway | nindent 14 }}
      ports:
        - {protocol: TCP, port: 8080}
---
{{- /* Without a `to`, a rule admits any address on its ports. */}}
{{- $keycloak := urlParse .Values.keycloak.baseUrl }}
{{- $keycloakPort := regexFind ":[0-9]+$" (toString (get $keycloak "host")) | trimPrefix ":" }}
{{- if not $keycloakPort }}
{{- $keycloakPort = ternary "443" "80" (eq (get $keycloak "scheme") "https") }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: wiki-gateway-egress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "naira.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "naira.selector" $gateway | nindent 6 }}
  policyTypes: [Egress]
  egress:
    - ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - podSelector:
            matchLabels:
              {{- toYaml $wikis | nindent 14 }}
      ports:
        - {protocol: TCP, port: 8080}
    - ports:
        - {protocol: TCP, port: {{ int $keycloakPort }}}
{{- end }}
