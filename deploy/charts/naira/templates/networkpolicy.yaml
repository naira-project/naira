{{- if and .Values.catalog.enabled .Values.catalog.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: catalog
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "naira.labels" . | nindent 4 }}
    {{- include "naira.selector" (dict "root" . "name" "catalog") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "naira.selector" (dict "root" . "name" "catalog") | nindent 6 }}
  policyTypes: [Ingress]
  {{- if or .Values.ui.enabled .Values.catalog.networkPolicy.extraIngress }}
  ingress:
    {{- if .Values.ui.enabled }}
    - from:
        - podSelector:
            matchLabels:
              {{- include "naira.selector" (dict "root" . "name" "ui") | nindent 14 }}
      ports:
        - {protocol: TCP, port: {{ .Values.catalog.port }}}
    {{- end }}
    {{- with .Values.catalog.networkPolicy.extraIngress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
{{- end }}
