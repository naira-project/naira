# Naira — first-party components only (RFC-009 §1). Keycloak, LiteLLM, MLflow,
# OpenMetadata and MCP servers come from the test-dependencies chart or the
# operator's own; the chart only needs their addresses, set in `keycloak` and
# in each plugin's `env`.

image:
  # Chart-local, not a Helm global. Empty for images loaded into kind.
  registry: ghcr.io/naira-project
  # Empty -> .Chart.AppVersion. A per-image tag wins over this one.
  tag: ""
  pullPolicy: IfNotPresent

# Pull Secrets for every workload, e.g. [{name: regcred}].
imagePullSecrets: []

# Identity provider. Not installed by this chart. Defaults match the
# test-dependencies chart installed into namespace naira-deps.
keycloak:
  baseUrl: http://keycloak.naira-deps.svc.cluster.local:8080
  realm: naira
  # Browser-facing. Differs from baseUrl wherever the browser cannot resolve
  # cluster DNS, i.e. every environment reached by port-forward.
  issuer: http://localhost:8080/realms/naira
  authUrl: http://localhost:8080/realms/naira/protocol/openid-connect/auth
  baseDomain: localhost

catalog:
  enabled: true
  replicas: 1
  image: {repository: naira-catalog, tag: ""}
  port: 8090

  # Pod placement and security, same keys on ui and portal. Empty values render
  # nothing.
  podAnnotations: {}
  priorityClassName: ""
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podSecurityContext: {}
  # The catalog and plugin images run as distroless nonroot (uid 65532), so
  # this meets Pod Security "restricted".
  securityContext:
    allowPrivilegeEscalation: false
    capabilities: {drop: [ALL]}
    runAsNonRoot: true
    runAsUser: 65532
    seccompProfile: {type: RuntimeDefault}
  # Timing only; the probe is the /healthz check. The pod is not Ready and the
  # liveness probe does not run until it passes.
  startupProbe: {periodSeconds: 2, failureThreshold: 30}
  # Ingress to the catalog from the ui pods, plus extraIngress (complete
  # NetworkPolicy ingress rules) for other callers. Egress is not restricted.
  networkPolicy: {enabled: false, extraIngress: []}

  # Secret `catalog-secrets` (or existingSecret) holding LITELLM_API_KEY and
  # OPENMETADATA_ADMIN_PASSWORD. Supplied by the operator; create is for kind.
  secret:
    existingSecret: ""
    create: false
    data: {}

  rbac:
    rules:
      - apiGroups: ["naira.io"]
        resources: ["appidentities"]
        verbs: ["get", "list"]

  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: 500m, memory: 256Mi}

  pluginDefaults:
    resources:
      requests: {cpu: 50m, memory: 64Mi}
      limits: {cpu: 200m, memory: 128Mi}
    securityContext:
      allowPrivilegeEscalation: false
      capabilities: {drop: [ALL]}
      runAsNonRoot: true
      runAsUser: 65532
      seccompProfile: {type: RuntimeDefault}
    # No probes: the plugins listen on loopback only, which kubelet probes
    # (pod IP) cannot reach.

  # Plugin sidecars (ADR-005), keyed by name so an overlay changes one field.
  # One entry drives: the sidecar, its line in plugins.yaml, its RBAC and its
  # config ConfigMap. The catalog connects to every enabled plugin at startup
  # and exits if one is unreachable.
  #
  #   image       naira-plugin-<name>; built from plugins/cmd/<name, - as _>
  #   port        unique within the pod
  #   schedule    cron; omit for manual trigger only
  #   env         NAME: "value, tpl-rendered" | NAME: {secretKeyRef: {name?, key}}
  #               (secretKeyRef.name defaults to the catalog Secret)
  #   resources, securityContext
  #               merged over the same keys of pluginDefaults
  #   rbac.rules  ClusterRole rules, only for plugins that read the cluster
  #   config      {mountPath, existingConfigMap | data}: files mounted as a directory
  plugins:
    litellm:
      enabled: true
      image: {repository: naira-plugin-litellm, tag: ""}
      port: 50051
      schedule: "0 0 * * *"
      pathPrefix: litellm
      env:
        LITELLM_BASE_URL: http://litellm.naira-deps.svc.cluster.local:4000
        LITELLM_API_KEY: {secretKeyRef: {key: LITELLM_API_KEY}}

    mlflow:
      enabled: true
      image: {repository: naira-plugin-mlflow, tag: ""}
      port: 50052
      schedule: "0 0 * * *"
      pathPrefix: mlflow
      env:
        MLFLOW_BASE_URL: http://mlflow.naira-deps.svc.cluster.local:5000

    depl-calls-svc:
      enabled: true
      image: {repository: naira-plugin-depl-calls-svc, tag: ""}
      port: 50053
      schedule: "0 * * * *"
      env:
        DEPL_CALLS_SVC_KUBECONFIG: ""
      rbac:
        rules:
          - apiGroups: [""]
            resources: ["namespaces", "services"]
            verbs: ["get", "list"]
          - apiGroups: ["apps"]
            resources: ["deployments"]
            verbs: ["get", "list"]

    depl-uses-litellm:
      # Off by default: cluster-wide get/list on Secrets, on the ServiceAccount
      # shared by the catalog and every sidecar.
      enabled: false
      image: {repository: naira-plugin-depl-uses-litellm, tag: ""}
      port: 50054
      schedule: "0 * * * *"
      env:
        DEPL_USES_LITELLM_KUBECONFIG: ""
        DEPL_USES_LITELLM_NAMED_HOSTS: "litellm=http://litellm.naira-deps.svc.cluster.local:4000"
      rbac:
        rules:
          - apiGroups: [""]
            resources: ["namespaces", "secrets"]
            verbs: ["get", "list"]
          - apiGroups: ["apps"]
            resources: ["deployments"]
            verbs: ["get", "list"]

    fluxcd:
      enabled: true
      image: {repository: naira-plugin-fluxcd, tag: ""}
      port: 50055
      schedule: "*/1 * * * *"
      rbac:
        rules:
          - apiGroups: ["apps"]
            resources: ["deployments"]
            verbs: ["get", "list"]
          - apiGroups: ["kustomize.toolkit.fluxcd.io"]
            resources: ["kustomizations"]
            verbs: ["get", "list"]
          - apiGroups: ["helm.toolkit.fluxcd.io"]
            resources: ["helmreleases"]
            verbs: ["get", "list"]
          - apiGroups: ["source.toolkit.fluxcd.io"]
            resources: ["gitrepositories"]
            verbs: ["get", "list"]

    openmetadata:
      enabled: true
      image: {repository: naira-plugin-openmetadata, tag: ""}
      port: 50056
      pathPrefix: openmetadata
      env:
        OPENMETADATA_BASE_URL: http://openmetadata.naira-deps.svc.cluster.local:8585
        OPENMETADATA_ADMIN_EMAIL: admin@open-metadata.org
        OPENMETADATA_ADMIN_PASSWORD: {secretKeyRef: {key: OPENMETADATA_ADMIN_PASSWORD}}

    tech-radar:
      # Off by default: it needs a radar file (config.data or existingConfigMap).
      enabled: false
      image: {repository: naira-plugin-tech-radar, tag: ""}
      port: 50057
      env:
        TECH_RADAR_CONFIG_PATH: /etc/naira/techradar/radar.yaml
      config:
        mountPath: /etc/naira/techradar
        existingConfigMap: ""
        data: {}

    mcp-servers:
      enabled: true
      image: {repository: naira-plugin-mcp-servers, tag: ""}
      port: 50058
      pathPrefix: mcp
      env:
        MCP_ENDPOINTS: mock-knowledge-base=http://mcp-mock.naira-deps.svc.cluster.local:8080/mcp

    github:
      # Off by default: GITHUB_TOKEN is required. Add it to the catalog Secret
      # (key GITHUB_TOKEN) before enabling.
      enabled: false
      image: {repository: naira-plugin-github, tag: ""}
      port: 50059
      env:
        GITHUB_ORG: naira-project
        GITHUB_TOKEN: {secretKeyRef: {key: GITHUB_TOKEN}}
      rbac:
        rules:
          - apiGroups: [""]
            resources: ["namespaces"]
            verbs: ["get", "list"]
          - apiGroups: ["apps"]
            resources: ["deployments"]
            verbs: ["get", "list"]

    openai-api-models:
      enabled: true
      image: {repository: naira-plugin-openai-api-models, tag: ""}
      port: 50060
      schedule: "0 0 * * *"
      # Note: using the same pathPrefix and BASE_URL as with the litellm plugin
      # showcases how data from different plugins accessing the same API can be
      # merged into a single node in the catalog.
      pathPrefix: litellm
      env:
        OPENAI_API_MODELS_BASE_URL: http://litellm.naira-deps.svc.cluster.local:4000
        OPENAI_API_MODELS_API_KEY: {secretKeyRef: {key: LITELLM_API_KEY}}

    bedrock:
      # Off by default: AWS_ACCESS_KEY_ID etc. are required. Add them to the
      # catalog Secret under proper keys before enabling.
      enabled: false
      image: {repository: naira-plugin-bedrock, tag: ""}
      port: 50061
      schedule: "0 0 * * *"
      pathPrefix: bedrock
      env:
        REGIONS: "us-east-1 eu-central-1"
        AWS_ACCESS_KEY_ID: {secretKeyRef: {key: AWS_ACCESS_KEY_ID}}
        AWS_SECRET_ACCESS_KEY: {secretKeyRef: {key: AWS_SECRET_ACCESS_KEY}}
        METRICS_LOOKBACK: "24h"

    thalamus:
      # Off by default: THALAMUS_BASE_URL and THALAMUS_BEARER_TOKEN are
      # required. Add them to the catalog Secret under proper keys before
      # enabling.
      enabled: false
      image: {repository: naira-plugin-thalamus, tag: ""}
      port: 50062
      schedule: "0 0 * * *"
      pathPrefix: thalamus
      env:
        THALAMUS_BASE_URL: {secretKeyRef: {key: THALAMUS_BASE_URL}}
        THALAMUS_BEARER_TOKEN: {secretKeyRef: {key: THALAMUS_BEARER_TOKEN}}
        HTTP_TIMEOUT: "5s"
      rbac:
        rules:
          - apiGroups: ["thalamus.cloud"]
            resources: ["models"]
            verbs: ["get", "list"]

    depl-uses-thalamus:
      # Off by default: THALAMUS_BASE_URL and THALAMUS_BEARER_TOKEN are
      # required. Add them to the catalog Secret under proper keys before
      # enabling.
      enabled: false
      image: {repository: naira-plugin-thalamus, tag: ""}
      port: 50063
      schedule: "0 0 * * *"
      pathPrefix: thalamus
      env:
        THALAMUS_BASE_URL: {secretKeyRef: {key: THALAMUS_BASE_URL}}
        THALAMUS_BEARER_TOKEN: {secretKeyRef: {key: THALAMUS_BEARER_TOKEN}}
        HTTP_TIMEOUT: "5s"
      rbac:
        rules:
          - apiGroups: [""]
            resources: ["namespaces"]
            verbs: ["get", "list"]
          - apiGroups: ["apps"]
            resources: ["deployments"]
            verbs: ["get", "list"]

ui:
  enabled: true
  replicas: 1
  image: {repository: naira-ui, tag: ""}
  port: 80
  # Empty -> http://catalog.<release namespace>.svc.cluster.local:<catalog.port>
  catalogUpstream: ""
  # Prometheus the UI proxies /prometheus/ to for the metric dashboards.
  # Empty -> the image default, http://prometheus-operated.monitoring.svc.cluster.local:9090
  prometheusUpstream: ""
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 200m, memory: 128Mi}
  podAnnotations: {}
  priorityClassName: ""
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podSecurityContext: {}
  # The image is nginx:alpine and runs as root, so no runAsNonRoot and no
  # capability drop (nginx needs SETUID/SETGID/CHOWN/NET_BIND_SERVICE). Not
  # Pod Security "restricted" until the image is unprivileged.
  securityContext:
    allowPrivilegeEscalation: false
    seccompProfile: {type: RuntimeDefault}
  startupProbe: {periodSeconds: 2, failureThreshold: 30}

portal:
  enabled: true
  replicas: 1
  image: {repository: naira-portal, tag: ""}
  port: 3000
  uiBaseUrl: http://localhost:3001
  oidc:
    clientId: naira-portal
    # Secret `portal-oidc` (or existingSecret). Supplied by the operator;
    # create is for kind.
    secret:
      existingSecret: ""
      create: false
      key: client-secret
      value: ""
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: 500m, memory: 256Mi}
  podAnnotations: {}
  priorityClassName: ""
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podSecurityContext: {}
  # The image is node:alpine and runs as root, so no runAsNonRoot. Not Pod
  # Security "restricted" until the image sets a non-root user.
  securityContext:
    allowPrivilegeEscalation: false
    seccompProfile: {type: RuntimeDefault}
  startupProbe: {periodSeconds: 2, failureThreshold: 30}

# PostgreSQL: the cloudpirates/postgres subchart. For an external server set
# enabled=false and database.host.
postgresql:
  enabled: true
  fullnameOverride: postgres
  auth:
    # Must equal the database.admin Secret (validate.yaml). Without it the
    # subchart generates a new random password on every `helm template`.
    existingSecret: postgres-admin
  image:
    imagePullPolicy: IfNotPresent   # the tag is digest-pinned
  persistence:
    size: 8Gi
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: 500m, memory: 512Mi}

# Roles and databases, created by the db-init Job. Idempotent: it reruns when
# its spec, script or values change, and works on an existing volume. Delete the
# Job to rerun it by hand, e.g. after changing a password in an existing Secret.
database:
  # Empty -> postgres.<release namespace>.svc.cluster.local (the subchart).
  host: ""
  port: 5432
  # libpq sslmode for db-init. The subchart serves no TLS; set require or
  # stricter for an external server.
  sslmode: prefer
  # Admin for db-init: a superuser, or a role with CREATEROLE and CREATEDB (e.g.
  # on a managed service). Secret `postgres-admin` (or existingSecret), key
  # postgres-password. Supplied by the operator; create is for kind.
  admin:
    username: postgres
    secret:
      existingSecret: ""
      create: false
      password: ""
  # Keyed by name; database and its owner role share it. Each reads its password
  # from Secret `<name>-db` (or existingSecret), keys username and password.
  # Supplied by the operator; create is for kind.
  databases:
    catalog:
      enabled: true
      secret:
        existingSecret: ""
        create: false
        password: ""
  init:
    # Same image as the subchart's server.
    image: docker.io/postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    backoffLimit: 6
    # A server that never answers fails the Job instead of hanging it.
    waitRetries: 60
    activeDeadlineSeconds: 900
    resources:
      requests: {cpu: 10m, memory: 32Mi}
      limits: {cpu: 100m, memory: 64Mi}
