# kind + Tilt (N5). The only values file in this repo that creates Secrets.

image:
  # Tilt builds the images and loads them into kind under their plain names.
  registry: ""
catalog:
  secret:
    create: true
    data:
      # Equals test-dependencies values-dev.yaml secrets.litellmMasterkey.value.
      LITELLM_API_KEY: sk-local-litellm
      OPENMETADATA_ADMIN_PASSWORD: admin
  plugins:
    depl-uses-litellm:
      enabled: true
    openmetadata:
      # OpenMetadata is off in test-dependencies values-dev.yaml.
      enabled: false
    tech-radar:
      enabled: true
      config:
        data:
          radar.yaml: |+
            schema_version: 1            # required; only 1 accepted
            radar:
              id: naira                  # optional, default "default"
              title: Naira Tech Radar    # required
              edition: 2026-09           # required; free-form edition label
              owner: platform-team       # required
            quadrants:                   # required; exactly 4; order = display order
              - id: models
                name: Models
              - id: agentic
                name: Agentic Patterns
              - id: knowledge
                name: Knowledge Techniques
              - id: others
                name: Others
            rings:                       # required; 1-6; order = innermost to outermost
              - id: adopt
                name: Adopt
                description: Proven; default choice for new work.
              - id: trial
                name: Trial
                description: Worth pursuing on projects that can absorb risk.
              - id: assess
                name: Assess
                description: Explore to understand impact.
              - id: hold
                name: Hold
                description: Do not start new work with this.
            entries:
              - id: claude-sonnet
                name: Claude Sonnet
                quadrant: models         # must match a quadrant id
                ring: adopt              # must match a ring id
                moved: in                # in | out | none; default none
                owner: ml-platform
                rationale: >
                  Default general-purpose model; served through the central gateway.
              - id: react-agents
                name: ReAct Agents
                quadrant: agentic
                ring: trial
                owner: ai-board
                rationale: >
                  Promising for tool-using workflows; evaluate on internal projects first.
              - id: hybrid-retrieval
                name: Hybrid Retrieval
                quadrant: knowledge
                ring: assess
                moved: in
                owner: ai-board
                rationale: >
                  Combines dense and sparse retrieval; explore impact on answer quality.
              - id: naive-rag
                name: Naive RAG
                quadrant: knowledge
                ring: hold
                moved: out
                owner: ai-board
                rationale: >
                  Superseded by hybrid retrieval; migrate existing pipelines.
    langfuse:
      # Off while tags.langfuse is false in test-dependencies values-dev.yaml;
      # enable both together. The key pair equals its secrets.langfuseInit, and
      # project_id and the trace names its seed.langfuse.apps.
      enabled: false
      secret:
        data:
          config.yaml: |
            schema_version: 1
            projects:
              - id: naira-demo
                host: http://langfuse-web.naira-deps.svc.cluster.local:3000
                # The Tiltfile forwards langfuse-web to 3003; a browser cannot
                # reach the in-cluster address the plugin calls.
                ui_host: http://localhost:3003
                project_id: naira-demo
                public_key: pk-lf-naira-dev
                secret_key: sk-lf-naira-dev
                window: 24h
                score_name: user_feedback
                observes:
                  - kind: deployment
                    namespace: naira-deps
                    name: triage-agent
                    trace_name: triage-agent
                  - kind: deployment
                    namespace: naira-deps
                    name: escalation-agent
                    trace_name: escalation-agent
    bedrock:
      enabled: false
      env:
        REGIONS: "eu-central-1"

portal:
  oidc:
    secret:
      create: true
      value: naira-local-dev-secret

ui:
  # Endpoint "View Logs" links: Grafana and Loki from test-dependencies
  # (Tiltfile forwards Grafana to localhost:3002). Schema: ui/src/lib/runtimeConfig.ts.
  config:
    logs:
      explorerUrl: http://localhost:3002
      datasource: {type: loki, uid: loki}
      orgId: "1"
      timeRange: {from: now-1h, to: now}
      defaultNamespace: naira-deps
      serviceQuery: '{namespace="{{namespace}}", app="{{name}}"}'
      proxyQuery: '{namespace="{{namespace}}", app=~"litellm.*"} |= {{model}}'

database:
  admin:
    secret:
      create: true
      password: postgres-local-admin-password
  databases:
    catalog:
      secret:
        create: true
        password: catalog-local-password
    # LiteLLM from test-dependencies uses this server. Equals test-dependencies
    # values-dev.yaml secrets.litellmDatabase.password.
    litellm:
      enabled: true
      secret:
        create: true
        password: litellm-local-password
    # OpenMetadata from test-dependencies (tags.openmetadata). Equals its
    # values-dev.yaml secrets.openmetadataDatabase.password.
    openmetadata:
      enabled: true
      secret:
        create: true
        password: openmetadata-local-password
    # Langfuse from test-dependencies (tags.langfuse). Equals its
    # values-dev.yaml secrets.langfuseDatabase.password
    langfuse:
      enabled: true
      secret:
        create: true
        password: langfuse-local-password
