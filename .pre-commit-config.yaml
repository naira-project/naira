default_install_hook_types: [commit-msg]

repos:
  - repo: local
    hooks:
      - id: conventional-commit-title
        name: Validate Conventional Commit title
        language: system
        stages: [commit-msg]
        entry: >-
          bash -c 'pattern="^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\\([^)[:space:]]+\\))?!?: .+$";
          title=$(head -n 1 "$1");
          if [[ ! "$title" =~ $pattern ]]; then
            echo "Commit title must use an approved Conventional Commit type (build, chore, ci, docs, feat, fix, perf, refactor, revert, style, test), e.g. \"feat(catalog): add model search\"." >&2;
            exit 1;
          fi' --
