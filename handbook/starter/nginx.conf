worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Everything nginx writes at runtime goes to /tmp, so the root filesystem can be read-only.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        error_page 404 /404.html;
        error_page 403 =404 /404.html;

        # Build output under /assets/ is content-hashed and never changes under the same name.
        location ^~ /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Pages, naira-handbook.json and the /_naira/ files change with every image.
        location / {
            add_header Cache-Control "no-store";
            try_files $uri $uri.html $uri/ =404;
        }
    }
}
