apiVersion: apps/v1
kind: Deployment
metadata:
  name: dataset-catalog-controller
  namespace: naira-system
  labels:
    app.kubernetes.io/name: dataset-catalog-controller
    app.kubernetes.io/part-of: naira
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dataset-catalog-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dataset-catalog-controller
        app.kubernetes.io/part-of: naira
    spec:
      serviceAccountName: dataset-catalog-controller
      containers:
        - name: manager
          image: ghcr.io/naira-project/naira/dataset-catalog-controller:latest
          args:
            - --leader-elect
            - --metrics-bind-address=:8080
            - --health-probe-bind-address=:8081
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
            - name: healthz
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: healthz
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: healthz
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 200m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 10
