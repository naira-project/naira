model
  schema 1.1

type user

type role
      relations
        define assignee: [user]

type naira_io_model
      relations
        define owner: [user, role#assignee]
        define member: [user, role#assignee] or owner
        define viewer: [user, role#assignee] or member

        define get: viewer
        define list: member
        define watch: member
        
        define can_list_litellm: viewer
        define can_list_mlflow: viewer
        define can_update_mlflow: owner
        define can_update_litellm: owner