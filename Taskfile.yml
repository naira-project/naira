version: '3'

vars:
  DEV_TASKFILE: ./deploy/dev/Taskfile.yml
  CATALOG_DIR: ./catalog

tasks:
  check:
    desc: Verify required local tools exist
    cmds:
      - task --taskfile {{.DEV_TASKFILE}} check

  platform:deploy:
    desc: Deploy the platform to kind
    cmds:
      - task --taskfile {{.DEV_TASKFILE}} platform:deploy

  forward:all:
    desc: Port-forward the main developer-facing services
    cmds:
      - task --taskfile {{.DEV_TASKFILE}} forward:all

  cluster:delete:
    desc: Remove the cluster
    cmds:
      - task --taskfile {{.DEV_TASKFILE}} cluster:delete

  portal:install:
    desc: Install naira-openmfp-portal dependencies
    cmds:
      - task --taskfile {{.DEV_TASKFILE}} portal:install

  portal:start:
    deps:
      - portal:install
    desc: Start the portal (frontend :4300, backend :3000). 
    cmds:
      - task --taskfile {{.DEV_TASKFILE}} portal:start

  portal:build:
    desc: Build the portal, for production
    cmds:
      - task --taskfile {{.DEV_TASKFILE}} portal:build

  catalog:test:
    desc: Run catalog unit tests
    cmds:
      - cd {{.CATALOG_DIR}} && go test -race ./...