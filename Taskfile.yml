version: '3'

vars:
  DEV_TASKFILE: ./deploy/dev/Taskfile.yml
  PROTO_DIR: ./plugins/pkg/pluginapi/proto

tasks:
  # Tool versions are managed via mise (https://mise.jdx.dev).
  # See mise.toml in the repo root.
  # Exit 127 here usually means mise is not activated in this shell.
  check:
    desc: Verify required local tools exist
    cmds:
      - kind version
      - kubectl version --client
      - helm version
      - tilt version
      - task --version
      - go version
      - buf --version
      - golangci-lint --version
      - shellcheck --version
      - ct version
      - yamllint --version
      - yamale --help > /dev/null
      - kubeconform -v
      - yq --version
      - python3 --version
      - docker version

  platform:deploy:
    desc: Deploy core (catalog, plugins, ui) + LLM Inference stack (llama.cpp, litellm, monitoring) to kind
    cmds:
      - task --taskfile {{.DEV_TASKFILE}} platform:deploy

  platform:undeploy:
    desc: Remove the full platform from kind
    cmds:
      - task --taskfile {{.DEV_TASKFILE}} platform:undeploy

  forward:all:
    desc: Port-forward all developer-facing services
    cmds:
      - task --taskfile {{.DEV_TASKFILE}} forward:all

  cluster:delete:
    desc: Remove the cluster
    cmds:
      - kind delete cluster --name naira-idp

  proto:generate:
    desc: Generate protobuf stubs of pluginapi
    cmds:
      - cd {{.PROTO_DIR}} && go generate

  proto:lint:
    desc: Lint proto of pluginapi
    cmds:
      - cd {{.PROTO_DIR}} && buf lint

  go:test:
    desc: Run unit and integration tests
    cmds:
      - go test -race ./...

  go:unit-test:
    desc: Run unit tests
    cmds:
      - go test -race ./... -short

  go:lint:
    desc: Lint go files
    cmds:
      - golangci-lint run

  chart:check:
    desc: Run the Helm chart checks CI runs (render tests, ct lint, kubeconform)
    cmds:
      - helm dependency build deploy/charts/naira
      - deploy/charts/naira/tests/render-test.sh
      # ct does not look next to its binary, where mise puts chart_schema.yaml and lintconf.yaml.
      - |
        d="$(dirname "$(command -v ct)")/etc"
        if [ -z "${CT_CONFIG_DIR:-}" ] && [ -f "$d/chart_schema.yaml" ]; then export CT_CONFIG_DIR="$d"; fi
        ct lint --config ct.yaml --target-branch main
      - deploy/charts/naira/tests/kubeconform.sh

  shell:lint:
    desc: Lint shell scripts with ShellCheck
    cmds:
      # git ls-files only returns tracked files, so gitignored dirs (.claude,
      # node_modules) never show up here — no need to exclude them.
      - git ls-files '*.sh' | xargs shellcheck
