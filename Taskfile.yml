version: '3'

vars:
  DEV_TASKFILE: ./deploy/dev/Taskfile.yml
  CATALOG_DIR: ./catalog
  PROTO_DIR: ./plugins/pkg/pluginapi/proto

tasks:
  # Tool versions are managed via mise (https://mise.jdx.dev).
  # See mise.toml in the repo root.
  check:
    desc: Verify required local tools exist
    cmds:
      - task --taskfile {{.DEV_TASKFILE}} check

  # ── Full platform ─────────────────────────────────────────────────────

  platform:deploy:
    desc: Deploy the full platform (core + mlops + llm-inference) to kind
    cmds:
      - task --taskfile {{.DEV_TASKFILE}} platform:deploy

  platform:undeploy:
    desc: Remove the full platform from kind
    cmds:
      - task --taskfile {{.DEV_TASKFILE}} platform:undeploy

  # ── Stack combinations ────────────────────────────────────────────────

  platform:deploy:core-mlops:
    desc: Deploy core + mlops stacks (Portal, Catalog, UI, MLflow, OpenMetadata)
    cmds:
      - task --taskfile {{.DEV_TASKFILE}} platform:deploy:core-mlops

  platform:deploy:core-llm-inference:
    desc: Deploy core + llm-inference stacks (Portal, Catalog, UI, LiteLLM, vLLM, Monitoring)
    cmds:
      - task --taskfile {{.DEV_TASKFILE}} platform:deploy:core-llm-inference

  platform:deploy:core-mlops-litellm:
    desc: Deploy core + mlops + LiteLLM only (Portal, Catalog, UI, MLflow, OpenMetadata, LiteLLM)
    cmds:
      - task --taskfile {{.DEV_TASKFILE}} platform:deploy:core-mlops-litellm

  # ── Port-forwarding ───────────────────────────────────────────────────

  forward:all:
    desc: Port-forward the main developer-facing services
    cmds:
      - task --taskfile {{.DEV_TASKFILE}} forward:all

  # ── Cluster management ────────────────────────────────────────────────

  cluster:delete:
    desc: Remove the cluster
    cmds:
      - task --taskfile {{.DEV_TASKFILE}} cluster:delete

  # ── Proto ─────────────────────────────────────────────────────────────

  proto:generate:
    desc: Generate protobuf stubs of pluginapi
    cmds:
      - cd {{.PROTO_DIR}} && go generate

  proto:lint:
    desc: Lint proto of pluginapi
    cmds:
      - cd {{.PROTO_DIR}} && buf lint

  # ── Catalog ───────────────────────────────────────────────────────────

  catalog:test:
    desc: Run catalog unit tests
    cmds:
      - cd {{.CATALOG_DIR}} && go test -race ./...