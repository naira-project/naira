version: '3'

vars:
  DEV_TASKFILE: ./deploy/dev/Taskfile.yml
  CATALOG_DIR: ./catalog
  PROTO_DIR: ./plugins/pkg/pluginapi/proto

tasks:
  # Tool versions are managed via mise (https://mise.jdx.dev).
  # See mise.toml in the repo root.
  check:
    desc: Verify required local tools exist
    cmds:
      - task --taskfile {{.DEV_TASKFILE}} check

  # ── Full platform ─────────────────────────────────────────────────────

  platform:deploy:
    desc: Deploy the full platform (core + mlops + llm-inference) to kind
    cmds:
      - task --taskfile {{.DEV_TASKFILE}} platform:deploy

  platform:undeploy:
    desc: Remove the full platform from kind
    cmds:
      - task --taskfile {{.DEV_TASKFILE}} platform:undeploy

  # ── Individual stacks ─────────────────────────────────────────────────

  core:deploy:
    desc: Deploy only the core stack (cluster, catalog, portal, ui)
    cmds:
      - task --taskfile {{.DEV_TASKFILE}} core:deploy

  core:undeploy:
    desc: Remove only the core stack from kind
    cmds:
      - task --taskfile {{.DEV_TASKFILE}} core:undeploy

  mlops:deploy:
    desc: Deploy only the MLOps stack (mlflow, openmetadata)
    cmds:
      - task --taskfile {{.DEV_TASKFILE}} mlops:deploy

  mlops:undeploy:
    desc: Remove only the MLOps stack from kind
    cmds:
      - task --taskfile {{.DEV_TASKFILE}} mlops:undeploy

  llm-inference:deploy:
    desc: Deploy only the LLM Inference stack (postgres, litellm, vllm, monitoring)
    cmds:
      - task --taskfile {{.DEV_TASKFILE}} llm-inference:deploy

  llm-inference:undeploy:
    desc: Remove only the LLM Inference stack from kind
    cmds:
      - task --taskfile {{.DEV_TASKFILE}} llm-inference:undeploy

  # ── Port-forwarding (modular) ─────────────────────────────────────────

  forward:all:
    desc: Port-forward all developer-facing services
    cmds:
      - task --taskfile {{.DEV_TASKFILE}} forward:all

  forward:core:
    desc: Port-forward core services (catalog, portal, ui)
    cmds:
      - task --taskfile {{.DEV_TASKFILE}} forward:core

  forward:mlops:
    desc: Port-forward MLOps services (mlflow, openmetadata)
    cmds:
      - task --taskfile {{.DEV_TASKFILE}} forward:mlops

  forward:llm-inference:
    desc: Port-forward LLM Inference services (litellm, inference, monitoring)
    cmds:
      - task --taskfile {{.DEV_TASKFILE}} forward:llm-inference

  # ── Cluster management ────────────────────────────────────────────────

  cluster:delete:
    desc: Remove the cluster
    cmds:
      - task --taskfile {{.DEV_TASKFILE}} cluster:delete

  # ── Proto ─────────────────────────────────────────────────────────────

  proto:generate:
    desc: Generate protobuf stubs of pluginapi
    cmds:
      - cd {{.PROTO_DIR}} && go generate

  proto:lint:
    desc: Lint proto of pluginapi
    cmds:
      - cd {{.PROTO_DIR}} && buf lint

  # ── Catalog ───────────────────────────────────────────────────────────

  catalog:test:
    desc: Run catalog unit tests
    cmds:
      - cd {{.CATALOG_DIR}} && go test -race ./...
