apiVersion: v1
kind: Namespace
metadata:
  name: naira-discovery-test
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: reader
  namespace: naira-discovery-test
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: no-services
  namespace: naira-discovery-test
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: no-access
  namespace: naira-discovery-test
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: naira-test-reader
rules:
  - apiGroups: [""]
    resources: [namespaces, services]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: naira-test-no-services
rules:
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: naira-test-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: naira-test-reader
subjects:
  - kind: ServiceAccount
    name: reader
    namespace: naira-discovery-test
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: naira-test-no-services
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: naira-test-no-services
subjects:
  - kind: ServiceAccount
    name: no-services
    namespace: naira-discovery-test
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: example-api
  namespace: naira-discovery-test
spec:
  # Only API objects are needed for read-access tests; no workload image is pulled.
  replicas: 0
  selector:
    matchLabels:
      app: example-api
  template:
    metadata:
      labels:
        app: example-api
    spec:
      containers:
        - name: api
          image: nginx:alpine
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: example-api
  namespace: naira-discovery-test
spec:
  selector:
    app: example-api
  ports:
    - port: 80
      targetPort: 8080