name: Release Pipeline
on:
  push:
    branches:
      - main

permissions: {}

jobs:
  # ── 1. Release Generation & Tagging ───────────────────────────────────────
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      # Export the tag name so downstream build jobs know if they should run
      target_tag: ${{ steps.set_tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Required to push tags later
          persist-credentials: false

      - name: Run Release Please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Check for Silent RC Release
        id: check_release
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          # 1. Check if the commit is a Release Please PR merge
          if echo "$COMMIT_MESSAGE" | grep -qE "chore\(.*\):.*release"; then
            
            # 2. Extract the newly merged version from the manifest
            VERSION=$(jq -r '."."' .release-please-manifest.json)
            
            # 3. ONLY trigger our custom manual tag logic if it is an RC version
            if [[ "$VERSION" == *-rc* ]]; then
              echo "is_release=true" >> "$GITHUB_OUTPUT"
              echo "version=$VERSION" >> "$GITHUB_OUTPUT"
              echo "RC release detected: $VERSION. Proceeding with manual tag and label cleanup."
            else
              echo "Stable release detected: $VERSION. Skipping manual tag and letting Release Please handle it natively."
            fi      
          fi

      - name: Push Git Tag and Update Labels
        if: steps.check_release.outputs.is_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.check_release.outputs.version }}
        run: |
          # Push the tag (this will NOT trigger downstream 'on: push: tags' workflows)
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f "ref=refs/tags/v${RELEASE_VERSION}" \
            -f "sha=${GITHUB_SHA}"

          # Find any merged Release Please PRs that are stuck in pending
          mapfile -t MERGED_PRS < <(gh pr list --state merged --label "autorelease: pending" --json number --jq '.[].number')
          # Transition the labels to satisfy the Release Please state machine
          for PR in "${MERGED_PRS[@]}"; do
            echo "Updating labels for PR #$PR"
            gh pr edit "$PR" --remove-label "autorelease: pending" --add-label "autorelease: tagged"
          done

      - name: Export Target Tag
        id: set_tag
        env:
          IS_RC_RELEASE: ${{ steps.check_release.outputs.is_release }}
          RC_VERSION: ${{ steps.check_release.outputs.version }}
          STABLE_RELEASE_CREATED: ${{ steps.release.outputs.release_created }}
          STABLE_TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          if [[ "$IS_RC_RELEASE" == 'true' ]]; then
            # Output the RC tag we just manually pushed
            echo "tag=v${RC_VERSION}" >> "$GITHUB_OUTPUT"
          elif [[ "$STABLE_RELEASE_CREATED" == 'true' ]]; then
            # Output the Stable tag Release Please natively created
            echo "tag=${STABLE_TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi

  # ── 2. Build & Push Artifacts (Only runs if a release tag was created) ────
  container-publish-catalog:
    name: Publish · Catalog.
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    needs: release-please
    # Only run if the release-please job successfully output a tag
    if: needs.release-please.outputs.target_tag != ''
    uses: naira-project/naira-github-workflows/.github/workflows/reusable-container-build.yml@8c67a4db452f8f3f4d7aa45d62740632e3bf0d2d # main
    with:
      image-name: "naira-catalog"
      dockerfile: "catalog/Dockerfile"
      context: "."
      platforms: "linux/amd64,linux/arm64"
      image-tag: ${{ needs.release-please.outputs.target_tag }}
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}

  sbom-catalog:
    name: SBOM · Catalog
    permissions:
      contents: write
      packages: write
      id-token: write
    needs: [release-please, container-publish-catalog]
