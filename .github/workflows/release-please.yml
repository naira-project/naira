  # ── 5. Gate: fail the run loudly if any image/SBOM didn't publish ─────────
  # release-please already created the tag + GitHub Release by this point, so
  # this can't stop that — but it turns a silently-cancelled build (e.g. a
  # job timeout) into a red run instead of a release that looks complete.
  all-published:
    name: All Images Published
    needs:
      - release-please
      - container-publish-catalog
      - sbom-catalog
      - container-publish-ui
      - sbom-ui
      - container-publish-portal
      - sbom-portal
      - container-publish-plugin-mlflow
      - sbom-plugin-mlflow
      - container-publish-plugin-litellm
      - sbom-plugin-litellm
      - container-publish-plugin-depl-calls-svc
      - sbom-plugin-depl-calls-svc
      - container-publish-plugin-fluxcd
      - sbom-plugin-fluxcd
      - container-publish-plugin-tech-radar
      - sbom-plugin-tech-radar
      - container-publish-plugin-openmetadata
      - sbom-plugin-openmetadata
      - container-publish-plugin-mcp-servers
      - sbom-plugin-mcp-servers
      - container-publish-plugin-depl-uses-litellm
      - sbom-plugin-depl-uses-litellm
    if: always() && needs.release-please.outputs.target_tag != ''
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        env:
          RESULTS_JSON: ${{ toJSON(needs) }}
        run: |
          FAILED=$(echo "$RESULTS_JSON" | jq -r 'to_entries[] | select(.key != "release-please") | select(.value.result != "success") | "\(.key): \(.value.result)"')
          if [ -n "$FAILED" ]; then
            echo "::error::One or more publish/SBOM jobs did not succeed for release ${{ needs.release-please.outputs.target_tag }}:"
            echo "$FAILED" | while read -r line; do echo "::error::  $line"; done
            exit 1
          fi
          echo "All images and SBOMs published for ${{ needs.release-please.outputs.target_tag }}."
