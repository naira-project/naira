name: Release Pipeline
on:
  push:
    branches:
      - main

permissions: {}

jobs:
  # ── 1. Release Generation & Tagging ───────────────────────────────────────
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      # Export the tag name so downstream build jobs know if they should run
      target_tag: ${{ steps.set_tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Required to push tags later
          persist-credentials: false

      - name: Run Release Please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Check for Silent RC Release
        id: check_release
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          # 1. Check if the commit is a Release Please PR merge
          if echo "$COMMIT_MESSAGE" | grep -qE "chore\(.*\):.*release"; then
            
            # 2. Extract the newly merged version from the manifest
            VERSION=$(jq -r '."."' .release-please-manifest.json)
            
            # 3. ONLY trigger our custom manual tag logic if it is an RC version
            if [[ "$VERSION" == *-rc* ]]; then
              echo "is_release=true" >> "$GITHUB_OUTPUT"
              echo "version=$VERSION" >> "$GITHUB_OUTPUT"
              echo "RC release detected: $VERSION. Proceeding with manual tag and label cleanup."
            else
              echo "Stable release detected: $VERSION. Skipping manual tag and letting Release Please handle it natively."
            fi      
          fi

      - name: Push Git Tag and Update Labels
        if: steps.check_release.outputs.is_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.check_release.outputs.version }}
        run: |
          # Push the tag (this will NOT trigger downstream 'on: push: tags' workflows)
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f "ref=refs/tags/v${RELEASE_VERSION}" \
            -f "sha=${GITHUB_SHA}"

          # Find any merged Release Please PRs that are stuck in pending
          mapfile -t MERGED_PRS < <(gh pr list --state merged --label "autorelease: pending" --json number --jq '.[].number')
          # Transition the labels to satisfy the Release Please state machine
          for PR in "${MERGED_PRS[@]}"; do
            echo "Updating labels for PR #$PR"
            gh pr edit "$PR" --remove-label "autorelease: pending" --add-label "autorelease: tagged"
          done

      - name: Export Target Tag
        id: set_tag
        env:
          IS_RC_RELEASE: ${{ steps.check_release.outputs.is_release }}
          RC_VERSION: ${{ steps.check_release.outputs.version }}
          STABLE_RELEASE_CREATED: ${{ steps.release.outputs.release_created }}
          STABLE_TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          if [[ "$IS_RC_RELEASE" == 'true' ]]; then
            # Output the RC tag we just manually pushed
            echo "tag=v${RC_VERSION}" >> "$GITHUB_OUTPUT"
          elif [[ "$STABLE_RELEASE_CREATED" == 'true' ]]; then
            # Output the Stable tag Release Please natively created
            echo "tag=${STABLE_TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi

  # ── 2. Build & Push Artifacts + SBOMs (only if a release tag was created) ─
  # Add a new image by adding one entry below; no other copy-pasting needed.
  publish:
    name: Publish · ${{ matrix.name }}
    needs: release-please
    if: needs.release-please.outputs.target_tag != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Catalog
            image-name: "naira-catalog"
            dockerfile: "catalog/Dockerfile"
            context: "."
          - name: UI
            image-name: "naira-ui"
            dockerfile: "ui/Dockerfile"
            context: "ui"
          - name: Portal
            image-name: "naira-portal"
            dockerfile: "naira-openmfp-portal/Dockerfile"
            context: "naira-openmfp-portal"
          - name: Plugin MLflow
            image-name: "naira-plugin-mlflow"
            dockerfile: "plugins/cmd/mlflow/Dockerfile"
            context: "."
          - name: Plugin LiteLLM
            image-name: "naira-plugin-litellm"
            dockerfile: "plugins/cmd/litellm/Dockerfile"
            context: "."
          - name: Plugin Depl Calls Svc
            image-name: "naira-plugin-depl-calls-svc"
            dockerfile: "plugins/cmd/depl_calls_svc/Dockerfile"
            context: "."
          - name: Plugin FluxCD
            image-name: "naira-plugin-fluxcd"
            dockerfile: "plugins/cmd/fluxcd/Dockerfile"
            context: "."
          - name: Plugin Tech Radar
            image-name: "naira-plugin-tech-radar"
            dockerfile: "plugins/cmd/tech_radar/Dockerfile"
            context: "."
          - name: Plugin OpenMetadata
            image-name: "naira-plugin-openmetadata"
            dockerfile: "plugins/cmd/openmetadata/Dockerfile"
            context: "."
          - name: Plugin MCP Servers
            image-name: "naira-plugin-mcp-servers"
            dockerfile: "plugins/cmd/mcp_servers/Dockerfile"
            context: "."
          - name: Plugin Depl Uses LiteLLM
            image-name: "naira-plugin-depl-uses-litellm"
            dockerfile: "plugins/cmd/depl_uses_litellm/Dockerfile"
            context: "."
          - name: Plugin OpenAI API Models
            image-name: "naira-plugin-openai-api-models"
            dockerfile: "plugins/cmd/openai_api_models/Dockerfile"
            context: "."
    # Each matrix entry calls a nested reusable workflow that chains its own
    # build -> SBOM jobs, rather than matrixing build and SBOM separately:
    # a matrix job's outputs only expose one arbitrary instance's values to
    # dependents, which would risk pairing one plugin's SBOM with another
    # plugin's digest.
    uses: ./.github/workflows/reusable-publish-and-sbom.yml
    with:
      image-name: ${{ matrix.image-name }}
      dockerfile: ${{ matrix.dockerfile }}
      context: ${{ matrix.context }}
      platforms: "linux/amd64,linux/arm64"
      release-tag: ${{ needs.release-please.outputs.target_tag }}
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}

  # ── 3. Helm chart ──────────────────────────────────────────────────────────
  # Packaged from the release tag and pushed as an OCI artifact. The chart
  # version is the release version. appVersion is the image tag (with the "v"),
  # so the chart's default image tag exists in the registry: the build workflow
  # only adds the plain semver tag on git tag refs, and this one builds from main.
  chart-publish:
    name: Publish · Helm Chart
    permissions:
      contents: read
      packages: write
    needs: release-please
    if: needs.release-please.outputs.target_tag != ''
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.release-please.outputs.target_tag }}
      CHART_REGISTRY: oci://ghcr.io/naira-project/charts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.target_tag }}
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0
      - name: Log in to ghcr.io
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$REGISTRY_PASSWORD" | helm registry login ghcr.io --username "$REGISTRY_USER" --password-stdin
      - name: Package and push
        run: |
          helm package deploy/charts/naira --version "${TAG#v}" --app-version "$TAG"
          helm push "naira-${TAG#v}.tgz" "$CHART_REGISTRY"
      - name: Verify the pushed chart
        run: helm show chart "${CHART_REGISTRY}/naira" --version "${TAG#v}" | grep -E '^(version|appVersion):'

  # ── 4. Gate: fail the run loudly if any image/SBOM didn't publish ─────────
  # release-please already created the tag + GitHub Release by this point, so
  # this can't stop that — but it turns a silently-cancelled build (e.g. a
  # job timeout) into a red run instead of a release that looks complete.
  all-published:
    name: All Images Published
    needs:
      - release-please
      - chart-publish
      - publish
    if: always() && needs.release-please.outputs.target_tag != ''
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        env:
          RESULTS_JSON: ${{ toJSON(needs) }}
        run: |
          FAILED=$(echo "$RESULTS_JSON" | jq -r 'to_entries[] | select(.key != "release-please") | select(.value.result != "success") | "\(.key): \(.value.result)"')
          if [ -n "$FAILED" ]; then
            echo "::error::One or more publish/SBOM jobs did not succeed for release ${{ needs.release-please.outputs.target_tag }}:"
            echo "$FAILED" | while read -r line; do echo "::error::  $line"; done
            exit 1
          fi
          echo "All images, SBOMs and the chart published for ${{ needs.release-please.outputs.target_tag }}."
