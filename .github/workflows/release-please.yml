    with:
      image-name: ${{ needs.container-publish-catalog.outputs.image-name }}
      image-digest: ${{ needs.container-publish-catalog.outputs.image-digest }}
      release-tag: ${{ needs.release-please.outputs.target_tag }}
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}

