    needs: release-please
    # Only run if the release-please job successfully output a tag
    if: needs.release-please.outputs.target_tag != ''
    uses: naira-project/naira-github-workflows/.github/workflows/reusable-container-build.yml@de9bdb0d30bec81f6730a82d28f7b7acf481609f
    with:
      image-name: "naira-portal"
      dockerfile: "naira-openmfp-portal/Dockerfile"
      context: "naira-openmfp-portal"
      platforms: "linux/amd64,linux/arm64"
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}

  # ── 4. Plugins ─────────────────────────────────────────────────────────────
  container-publish-plugin-mlflow:
    name: Publish · Plugin MLflow
    permissions:
      contents: read
