name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write
  
jobs:
  # ── 1. Build & push catalog image ─────────────────────────────────────────
  container-publish-catalog:
    name: Publish · Catalog
    uses: naira-project/naira-github-workflows/.github/workflows/reusable-container-build.yml@dddb3537f34394a6d3187fbf17df84882dd586f7
    with:
      image-name: "naira-catalog"
      dockerfile: "catalog/Dockerfile"
      context: "catalog"
      platforms: "linux/amd64,linux/arm64"
      push: true
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}

  # ── 2. Build & push UI image ───────────────────────────────────────────────
  container-publish-ui:
    name: Publish · UI
    uses: naira-project/naira-github-workflows/.github/workflows/reusable-container-build.yml@dddb3537f34394a6d3187fbf17df84882dd586f7
    with:
      image-name: "naira-ui"
      dockerfile: "ui-poc/Dockerfile"
      context: "ui-poc"
      platforms: "linux/amd64,linux/arm64"
      push: true
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}

  # ── 3. Verify signatures ───────────────────────────────────────────────────
  verify-catalog:
    name: Verify · Catalog Signature
    needs: [container-publish-catalog]
    uses: naira-project/naira-github-workflows/.github/workflows/reusable-container-verify.yml@254b226c9bda693b536c026f9f49ab907a260b24
    with:
      image-ref: "ghcr.io/naira-project/naira-catalog@${{ needs.container-publish-catalog.outputs.image-digest }}"

  verify-ui:
    name: Verify · UI Signature
    needs: [container-publish-ui]
    uses: naira-project/naira-github-workflows/.github/workflows/reusable-container-verify.yml@254b226c9bda693b536c026f9f49ab907a260b24
    with:
      image-ref: "ghcr.io/naira-project/naira-ui@${{ needs.container-publish-ui.outputs.image-digest }}"

  # ── Gate: surfaces overall release status as a single check ───────────────
  release-complete:
    name: Release Complete
    needs: [container-publish-catalog, container-publish-ui, verify-catalog, verify-ui]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check all results
        run: |
          for r in \
            "${{ needs.container-publish-catalog.result }}" \
            "${{ needs.container-publish-ui.result }}" \
            "${{ needs.verify-catalog.result }}" \
            "${{ needs.verify-ui.result }}"; do
            if [[ "$r" != "success" ]]; then
              echo "::error::Step failed: $r"
              exit 1
            fi
          done