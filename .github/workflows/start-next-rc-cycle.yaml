name: Start Next RC Cycle
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'The stable release tag just published (e.g., v1.2.0)'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  reset-to-rc:
    runs-on: ubuntu-latest
    env:
      TAG_NAME: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Revert Config to Prerelease & Silent
        run: |
          # Remove "release-as" and inject all prerelease, silent, and changelog-skipping settings back
          jq '
            del(.packages["."]."release-as") | 
            .packages["."].versioning = "prerelease" | 
            .packages["."].prerelease = true | 
            .packages["."]."prerelease-type" = "rc" | 
            .packages["."]."skip-github-release" = true
          ' release-please-config.json > tmp.json
          mv tmp.json release-please-config.json
          
      - name: Create Reset PR (signed commit via GitHub API)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Branch name based on tag
          BRANCH_NAME="chore/start-next-rc-${TAG_NAME}"

          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must have the form v1.2.3"
            exit 1
          fi

          # Point the branch at current main (create, or force-reset if it exists)
          BASE_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" -X POST \
            -f ref="refs/heads/${BRANCH_NAME}" -f sha="$BASE_SHA" 2>/dev/null || \
          gh api "repos/${GITHUB_REPOSITORY}/git/refs/heads/${BRANCH_NAME}" -X PATCH \
            -f sha="$BASE_SHA" -F force=true

          # Commit via the Contents API so GitHub signs it; main requires signed commits.
          FILE_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/contents/release-please-config.json?ref=${BRANCH_NAME}" --jq '.sha')
          gh api "repos/${GITHUB_REPOSITORY}/contents/release-please-config.json" -X PUT \
            -f message="chore: start next release candidate cycle after ${TAG_NAME}" \
            -f branch="$BRANCH_NAME" \
            -f sha="$FILE_SHA" \
            -f content="$(base64 -w0 release-please-config.json)"

          # Create PR, ignoring failure if one is already open
          gh pr create \
            --title "chore: start next release candidate cycle after ${TAG_NAME}" \
            --body "Merging this PR will re-enable prerelease configuration and silence the changelog so Release Please starts generating silent RC builds for the next version." \
            --base main --head "$BRANCH_NAME" || true
