#
# Deploys the litellm_chatbot_to_catalog_api scenario (see e2e/README.md)
# into an isolated namespace on a throwaway kind cluster and runs its
# assertions against it.
#
# Runs on every PR, but the job targets the `e2e` GitHub environment, which
# requires manual approval from a reviewer (Settings → Environments → e2e).
# Until someone approves, the job — and the required "E2E" status check —
# stays pending, so the PR can't be merged. Every new push needs a fresh
# approval, since the approver should review the code that is about to run.
#
# Deliberately `pull_request` (not `pull_request_target`): PR code runs with
# a read-only token and no secrets.
#
# No `paths:` filter: a required check that is skipped never reports, which
# would block unrelated PRs forever.
name: E2E

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CLUSTER_NAME: naira-idp-e2e

jobs:
  e2e:
    name: E2E · litellm_chatbot_to_catalog_api
    runs-on: ubuntu-latest
    environment: e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"

      # kind/kubectl/helm versions come from mise.toml — the same source of
      # truth used for local dev — instead of a second, separately hardcoded
      # set of versions here that could drift from it.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: kind kubectl helm

      # Computed once, here, rather than inside create-environment.sh: if that
      # script fails before it would derive an ID itself, the destroy step at
      # the bottom (if: always()) still knows what to tear down.
      - name: Compute environment ID
        run: echo "ENV_ID=pr-${{ github.event.pull_request.number }}-${{ github.run_id }}" >> "$GITHUB_ENV"

      - name: Create kind cluster
        run: kind create cluster --config e2e/base/kind-config.yaml

      - name: Create E2E environment
        run: |
          ./e2e/scripts/create-environment.sh \
            --scenario litellm_chatbot_to_catalog_api \
            --env-id "${ENV_ID}" \
            --tag "${{ github.sha }}" \
            --cluster-name "${CLUSTER_NAME}"

      - name: Port-forward catalog
        run: |
          kubectl -n "${ENV_ID}" port-forward svc/catalog 8090:8090 &
          echo $! > /tmp/catalog-port-forward.pid
          # Retry for up to 30 seconds while the port-forward and readiness
          # probe settle.
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:8090/healthz >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "::error::catalog not reachable via port-forward after 30s" >&2
          exit 1

      # The catalog API requires a Bearer token (Keycloak auth integration).
      # E2E tests fetch their own token via KEYCLOAK_URL — see authToken() in
      # e2e/litellm_chatbot_to_catalog_api/assert/assert_test.go.
      - name: Port-forward keycloak
        run: |
          kubectl -n "${ENV_ID}" port-forward svc/keycloak 8080:8080 &
          echo $! > /tmp/keycloak-port-forward.pid
          # The keycloak Service only exposes the http port (8080), not the
          # management/health port (9000) — check a realm endpoint instead of
          # /health/ready, which isn't reachable through this forward.
          # Retry for up to 30 seconds while the port-forward and readiness
          # probe settle.
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:8080/realms/naira/.well-known/openid-configuration >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "::error::keycloak not reachable via port-forward after 30s" >&2
          exit 1

      # -timeout bounds a single hung HTTP call (e.g. a stuck port-forward)
      # from stalling the whole job; go test's own default is 10m.
      - name: Run E2E tests
        env:
          CATALOG_URL: http://localhost:8090
          KEYCLOAK_URL: http://localhost:8080
        run: go test -tags e2e -v -timeout=5m ./e2e/litellm_chatbot_to_catalog_api/assert/...

      - name: Stop port-forwards
        if: always()
        run: |
          kill "$(cat /tmp/catalog-port-forward.pid)" || true
          kill "$(cat /tmp/keycloak-port-forward.pid)" || true

      - name: Collect diagnostics
        if: always()
        run: |
          kubectl get pods,services -n "${ENV_ID}" -o wide || true
          kubectl logs -n "${ENV_ID}" -l app=catalog --all-containers --tail=-1 --prefix=true || true
          kubectl get events -n "${ENV_ID}" --sort-by=.lastTimestamp || true
          kubectl describe pods -n "${ENV_ID}" || true

      # Deletes the namespace and the cluster-scoped resources it leaves
      # behind. No Cleanup Job, no GC sweeper — nothing else outlives this.
      - name: Destroy environment
        if: always()
        run: |
          ./e2e/scripts/destroy-environment.sh \
            --env-id "${ENV_ID}" \
            --cluster-name "${CLUSTER_NAME}"
