#
# Deploys the litellm_chatbot_to_catalog_api and the handbook_sites scenarios (see
# e2e/README.md), each into an isolated namespace on its own throwaway kind
# cluster, and runs their assertions against it.
#
# Opt-in: runs on PRs labeled `run-e2e` that touch what the scenario builds,
# after approval via the `e2e` environment. No manual dispatch: a dispatched
# run executes PR code in the default branch context, where it could poison
# the default branch's Actions cache.
name: E2E

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - catalog/**
      - plugins/**
      - deploy/charts/**
      - naira-openmfp-portal/**
      - handbook/**
      - e2e/**
      - go.mod
      - go.sum
      - mise.toml
      - .github/workflows/e2e.yml

permissions:
  contents: read

concurrency:
  # Per PR, so runs for different PRs don't cancel each other.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CLUSTER_NAME: naira-idp-e2e

jobs:
  e2e:
    name: E2E · litellm_chatbot_to_catalog_api
    runs-on: ubuntu-latest
    # Evaluated before the environment gate, so a skipped job asks no one.
    if: ${{ contains(github.event.pull_request.labels.*.name, 'run-e2e') }}
    # Requires reviewer approval before running PR code.
    environment: e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"

      # kind/kubectl/helm versions come from mise.toml — the same source of
      # truth used for local dev — instead of a second, separately hardcoded
      # set of versions here that could drift from it.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: kind kubectl helm

      # Computed once, here, rather than inside create-environment.sh: if that
      # script fails before it would derive an ID itself, the destroy step at
      # the bottom (if: always()) still knows what to tear down.
      - name: Compute environment ID
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: echo "ENV_ID=pr-${PR_NUMBER}-${GITHUB_RUN_ID}" >> "$GITHUB_ENV"

      - name: Create kind cluster
        run: kind create cluster --config e2e/base/kind-config.yaml

      - name: Create E2E environment
        run: |
          ./e2e/scripts/create-environment.sh \
            --scenario litellm_chatbot_to_catalog_api \
            --env-id "${ENV_ID}" \
            --tag "${{ github.sha }}" \
            --cluster-name "${CLUSTER_NAME}"

      - name: Port-forward catalog
        run: |
          kubectl -n "${ENV_ID}" port-forward svc/catalog 8090:8090 &
          echo $! > /tmp/catalog-port-forward.pid
          # Retry for up to 30 seconds while the port-forward and readiness
          # probe settle.
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:8090/healthz >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "::error::catalog not reachable via port-forward after 30s" >&2
          exit 1

      # The catalog API requires a Bearer token (Keycloak auth integration).
      # E2E tests fetch their own token via KEYCLOAK_URL — see authToken() in
      # e2e/litellm_chatbot_to_catalog_api/assert/assert_test.go.
      - name: Port-forward keycloak
        run: |
          kubectl -n "${ENV_ID}" port-forward svc/keycloak 8080:8080 &
          echo $! > /tmp/keycloak-port-forward.pid
          # The keycloak Service only exposes the http port (8080), not the
          # management/health port (9000) — check a realm endpoint instead of
          # /health/ready, which isn't reachable through this forward.
          # Retry for up to 30 seconds while the port-forward and readiness
          # probe settle.
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:8080/realms/naira/.well-known/openid-configuration >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "::error::keycloak not reachable via port-forward after 30s" >&2
          exit 1

      # -timeout bounds a single hung HTTP call (e.g. a stuck port-forward)
      # from stalling the whole job; go test's own default is 10m.
      - name: Run E2E tests
        env:
          CATALOG_URL: http://localhost:8090
          KEYCLOAK_URL: http://localhost:8080
        run: go test -tags e2e -v -timeout=5m ./e2e/litellm_chatbot_to_catalog_api/assert/...

      - name: Stop port-forwards
        if: always()
        run: |
          kill "$(cat /tmp/catalog-port-forward.pid)" || true
          kill "$(cat /tmp/keycloak-port-forward.pid)" || true

      - name: Collect diagnostics
        if: always()
        run: |
          kubectl get pods,services -n "${ENV_ID}" -o wide || true
          kubectl logs -n "${ENV_ID}" -l app=catalog --all-containers --tail=-1 --prefix=true || true
          kubectl get events -n "${ENV_ID}" --sort-by=.lastTimestamp || true
          kubectl describe pods -n "${ENV_ID}" || true

      # Deletes the namespace and the cluster-scoped resources it leaves
      # behind. No Cleanup Job, no GC sweeper — nothing else outlives this.
      - name: Destroy environment
        if: always()
        run: |
          ./e2e/scripts/destroy-environment.sh \
            --env-id "${ENV_ID}" \
            --cluster-name "${CLUSTER_NAME}"

  e2e-handbook-sites:
    name: E2E · handbook_sites
    runs-on: ubuntu-latest
    # Evaluated before the environment gate, so a skipped job asks no one.
    if: ${{ contains(github.event.pull_request.labels.*.name, 'run-e2e') }}
    # Requires reviewer approval before running PR code.
    environment: e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: kind kubectl helm

      - name: Compute environment ID
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: echo "ENV_ID=pr-${PR_NUMBER}-${GITHUB_RUN_ID}" >> "$GITHUB_ENV"

      - name: Create kind cluster
        run: kind create cluster --config e2e/base/kind-config.yaml

      - name: Create E2E environment
        run: |
          ./e2e/scripts/create-environment.sh \
            --scenario handbook_sites \
            --env-id "${ENV_ID}" \
            --tag "${{ github.sha }}" \
            --cluster-name "${CLUSTER_NAME}"

      # The tests reach the gateway by Host header, Keycloak for a token and the
      # portal for its service-provider output.
      - name: Port-forward gateway, keycloak and portal
        run: |
          kubectl -n "${ENV_ID}" port-forward svc/handbook-gateway 8083:8080 &
          echo $! > /tmp/gateway-port-forward.pid
          kubectl -n "${ENV_ID}" port-forward svc/keycloak 8080:8080 &
          echo $! > /tmp/keycloak-port-forward.pid
          kubectl -n "${ENV_ID}" port-forward svc/portal 3000:3000 &
          echo $! > /tmp/portal-port-forward.pid
          # Retry for up to 30 seconds while the port-forwards settle. The
          # gateway answers 404 to a host that is no handbook's.
          for _ in $(seq 1 30); do
            if curl -s -o /dev/null -H 'Host: probe' http://localhost:8083/ \
              && curl -sf http://localhost:8080/realms/naira/.well-known/openid-configuration >/dev/null \
              && curl -sf http://localhost:3000/rest/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "::error::gateway, keycloak or portal not reachable via port-forward after 30s" >&2
          exit 1

      # -timeout bounds the whole run: the stopped-handbook test waits for the
      # gateway to notice, twice.
      - name: Run E2E tests
        env:
          HANDBOOK_GATEWAY_URL: http://localhost:8083
          KEYCLOAK_URL: http://localhost:8080
          PORTAL_URL: http://localhost:3000
          E2E_NAMESPACE: ${{ env.ENV_ID }}
        run: go test -tags e2e -v -timeout=10m ./e2e/handbook_sites/assert/...

      - name: Stop port-forwards
        if: always()
        run: |
          kill "$(cat /tmp/gateway-port-forward.pid)" || true
          kill "$(cat /tmp/keycloak-port-forward.pid)" || true
          kill "$(cat /tmp/portal-port-forward.pid)" || true

      - name: Collect diagnostics
        if: always()
        run: |
          kubectl get pods,services -n "${ENV_ID}" -o wide || true
          kubectl logs -n "${ENV_ID}" -l app.kubernetes.io/name=handbook-gateway --all-containers --tail=-1 --prefix=true || true
          kubectl logs -n "${ENV_ID}" -l app=portal --all-containers --tail=-1 --prefix=true || true
          kubectl get events -n "${ENV_ID}" --sort-by=.lastTimestamp || true
          kubectl describe pods -n "${ENV_ID}" || true

      - name: Destroy environment
        if: always()
        run: |
          ./e2e/scripts/destroy-environment.sh \
            --env-id "${ENV_ID}" \
            --cluster-name "${CLUSTER_NAME}"
