name: Dev Publish

on:
  workflow_dispatch:

# No workflow-level permissions block, on purpose. A job that calls the
# reusable build workflow can only narrow the workflow-level grant, so a
# `contents: read` block here made GitHub reject every run at startup
# (startup_failure, no jobs created), and a wide block trips the
# excessive-permissions audit. Every job declares its own instead.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Build & push catalog image ─────────────────────────────────────────
  container-publish-catalog:
    name: Publish · Catalog
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: naira-project/naira-github-workflows/.github/workflows/reusable-container-build.yml@de9bdb0d30bec81f6730a82d28f7b7acf481609f
    with:
      image-name: "naira-catalog"
      dockerfile: "catalog/Dockerfile"
      context: "."
      platforms: "linux/amd64,linux/arm64"
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}

  # ── 2. Build & push UI image ───────────────────────────────────────────────
  container-publish-ui:
    name: Publish · UI
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: naira-project/naira-github-workflows/.github/workflows/reusable-container-build.yml@de9bdb0d30bec81f6730a82d28f7b7acf481609f
    with:
      image-name: "naira-ui"
      dockerfile: "ui/Dockerfile"
      context: "ui"
      platforms: "linux/amd64,linux/arm64"
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}

  # ── 3. Build & push Portal image ───────────────────────────────────────────
  container-publish-portal:
    name: Publish · Portal
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: naira-project/naira-github-workflows/.github/workflows/reusable-container-build.yml@de9bdb0d30bec81f6730a82d28f7b7acf481609f
    with:
      image-name: "naira-portal"
      dockerfile: "naira-openmfp-portal/Dockerfile"
      context: "naira-openmfp-portal"
      platforms: "linux/amd64,linux/arm64"
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}

  # ── 4. Plugins ─────────────────────────────────────────────────────────────
  container-publish-plugin-mlflow:
    name: Publish · Plugin MLflow
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: naira-project/naira-github-workflows/.github/workflows/reusable-container-build.yml@de9bdb0d30bec81f6730a82d28f7b7acf481609f
    with:
      image-name: "naira-plugin-mlflow"
      dockerfile: "plugins/cmd/mlflow/Dockerfile"
      context: "."
      platforms: "linux/amd64,linux/arm64"
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}

  container-publish-plugin-litellm:
    name: Publish · Plugin LiteLLM
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: naira-project/naira-github-workflows/.github/workflows/reusable-container-build.yml@de9bdb0d30bec81f6730a82d28f7b7acf481609f
    with:
      image-name: "naira-plugin-litellm"
      dockerfile: "plugins/cmd/litellm/Dockerfile"
      context: "."
      platforms: "linux/amd64,linux/arm64"
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}

  container-publish-plugin-depl-calls-svc:
    name: Publish · Plugin Depl Calls Svc
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: naira-project/naira-github-workflows/.github/workflows/reusable-container-build.yml@de9bdb0d30bec81f6730a82d28f7b7acf481609f
    with:
      image-name: "naira-plugin-depl-calls-svc"
      dockerfile: "plugins/cmd/depl_calls_svc/Dockerfile"
      context: "."
      platforms: "linux/amd64,linux/arm64"
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}

  container-publish-plugin-fluxcd:
    name: Publish · Plugin FluxCD
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: naira-project/naira-github-workflows/.github/workflows/reusable-container-build.yml@de9bdb0d30bec81f6730a82d28f7b7acf481609f
    with:
      image-name: "naira-plugin-fluxcd"
      dockerfile: "plugins/cmd/fluxcd/Dockerfile"
      context: "."
      platforms: "linux/amd64,linux/arm64"
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}

  container-publish-plugin-depl-uses-litellm:
    name: Publish · Plugin Depl Uses LiteLLM
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: naira-project/naira-github-workflows/.github/workflows/reusable-container-build.yml@de9bdb0d30bec81f6730a82d28f7b7acf481609f
    with:
      image-name: "naira-plugin-depl-uses-litellm"
      dockerfile: "plugins/cmd/depl_uses_litellm/Dockerfile"
      context: "."
      platforms: "linux/amd64,linux/arm64"
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}

  container-publish-plugin-openmetadata:
    name: Publish · Plugin OpenMetadata
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: naira-project/naira-github-workflows/.github/workflows/reusable-container-build.yml@de9bdb0d30bec81f6730a82d28f7b7acf481609f
    with:
      image-name: "naira-plugin-openmetadata"
      dockerfile: "plugins/cmd/openmetadata/Dockerfile"
      context: "."
      platforms: "linux/amd64,linux/arm64"
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}

  container-publish-plugin-mcp-servers:
    name: Publish · Plugin MCP Servers
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: naira-project/naira-github-workflows/.github/workflows/reusable-container-build.yml@de9bdb0d30bec81f6730a82d28f7b7acf481609f
    with:
      image-name: "naira-plugin-mcp-servers"
      dockerfile: "plugins/cmd/mcp_servers/Dockerfile"
      context: "."
      platforms: "linux/amd64,linux/arm64"
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}

  container-publish-plugin-tech-radar:
    name: Publish · Plugin Tech Radar
    uses: naira-project/naira-github-workflows/.github/workflows/reusable-container-build.yml@de9bdb0d30bec81f6730a82d28f7b7acf481609f
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    with:
      image-name: "naira-plugin-tech-radar"
      dockerfile: "plugins/cmd/tech_radar/Dockerfile"
      context: "."
      platforms: "linux/amd64,linux/arm64"
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}

  container-publish-plugin-github:
    name: Publish · Plugin GitHub
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: naira-project/naira-github-workflows/.github/workflows/reusable-container-build.yml@de9bdb0d30bec81f6730a82d28f7b7acf481609f
    with:
      image-name: "naira-plugin-github"
      dockerfile: "plugins/cmd/github/Dockerfile"
      context: "."
      platforms: "linux/amd64,linux/arm64"
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}

  # ── Gate: surfaces overall publish status as a single check ───────────────
  all-published:
    name: All Images Published
    needs:
      - container-publish-catalog
      - container-publish-ui
      - container-publish-portal
      - container-publish-plugin-mlflow
      - container-publish-plugin-litellm
      - container-publish-plugin-depl-calls-svc
      - container-publish-plugin-fluxcd
      - container-publish-plugin-depl-uses-litellm
      - container-publish-plugin-openmetadata
      - container-publish-plugin-mcp-servers
      - container-publish-plugin-tech-radar
      - container-publish-plugin-github
    if: always()
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          RESULTS=(
            "${{ needs.container-publish-catalog.result }}"
            "${{ needs.container-publish-ui.result }}"
            "${{ needs.container-publish-portal.result }}"
            "${{ needs.container-publish-plugin-mlflow.result }}"
            "${{ needs.container-publish-plugin-litellm.result }}"
            "${{ needs.container-publish-plugin-depl-calls-svc.result }}"
            "${{ needs.container-publish-plugin-fluxcd.result }}"
            "${{ needs.container-publish-plugin-depl-uses-litellm.result }}"
            "${{ needs.container-publish-plugin-openmetadata.result }}"
            "${{ needs.container-publish-plugin-mcp-servers.result }}"
            "${{ needs.container-publish-plugin-tech-radar.result }}"
            "${{ needs.container-publish-plugin-github.result }}"
          )
          for r in "${RESULTS[@]}"; do
            if [[ "$r" != "success" ]]; then
              echo "::error::One or more publish jobs did not succeed: $r"
              exit 1
            fi
          done
          echo "All images published successfully."
