name: Dev Publish

on:
  workflow_dispatch:

# No workflow-level permissions block; every job declares its own, as
# release-please.yml does. A job without one inherits the workflow-level grant,
# and the reusable build workflow requests more than `contents: read`, which
# GitHub rejects at startup (startup_failure, no jobs created).

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Build & push all container images ──────────────────────────────────────
  # Add a new image by adding one entry below; no other copy-pasting needed.
  container-publish:
    name: Publish · ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Catalog
            image-name: "naira-catalog"
            dockerfile: "catalog/Dockerfile"
            context: "."
          - name: UI
            image-name: "naira-ui"
            dockerfile: "ui/Dockerfile"
            context: "ui"
          - name: Portal
            image-name: "naira-portal"
            dockerfile: "naira-openmfp-portal/Dockerfile"
            context: "naira-openmfp-portal"
          - name: Plugin MLflow
            image-name: "naira-plugin-mlflow"
            dockerfile: "plugins/cmd/mlflow/Dockerfile"
            context: "."
          - name: Plugin LiteLLM
            image-name: "naira-plugin-litellm"
            dockerfile: "plugins/cmd/litellm/Dockerfile"
            context: "."
          - name: Plugin Depl Calls Svc
            image-name: "naira-plugin-depl-calls-svc"
            dockerfile: "plugins/cmd/depl_calls_svc/Dockerfile"
            context: "."
          - name: Plugin FluxCD
            image-name: "naira-plugin-fluxcd"
            dockerfile: "plugins/cmd/fluxcd/Dockerfile"
            context: "."
          - name: Plugin Depl Uses LiteLLM
            image-name: "naira-plugin-depl-uses-litellm"
            dockerfile: "plugins/cmd/depl_uses_litellm/Dockerfile"
            context: "."
          - name: Plugin OpenMetadata
            image-name: "naira-plugin-openmetadata"
            dockerfile: "plugins/cmd/openmetadata/Dockerfile"
            context: "."
          - name: Plugin MCP Servers
            image-name: "naira-plugin-mcp-servers"
            dockerfile: "plugins/cmd/mcp_servers/Dockerfile"
            context: "."
          - name: Plugin Tech Radar
            image-name: "naira-plugin-tech-radar"
            dockerfile: "plugins/cmd/tech_radar/Dockerfile"
            context: "."
          - name: Plugin GitHub
            image-name: "naira-plugin-github"
            dockerfile: "plugins/cmd/github/Dockerfile"
            context: "."
          - name: Plugin OpenAI API Models
            image-name: "naira-plugin-openai-api-models"
            dockerfile: "plugins/cmd/openai_api_models/Dockerfile"
            context: "."
          - name: Plugin Bedrock
            image-name: "naira-plugin-bedrock"
            dockerfile: "plugins/cmd/bedrock/Dockerfile"
            context: "."
          - name: Plugin Thalamus
            image-name: "naira-plugin-thalamus"
            dockerfile: "plugins/cmd/thalamus/Dockerfile"
            context: "."
          - name: Plugin Depl Uses Thalamus
            image-name: "naira-plugin-depl-uses-thalamus"
            dockerfile: "plugins/cmd/depl_uses_thalamus/Dockerfile"
            context: "."
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: naira-project/naira-github-workflows/.github/workflows/reusable-container-build.yml@de9bdb0d30bec81f6730a82d28f7b7acf481609f
    with:
      image-name: ${{ matrix.image-name }}
      dockerfile: ${{ matrix.dockerfile }}
      context: ${{ matrix.context }}
      platforms: "linux/amd64,linux/arm64"
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}

  # ── Gate: surfaces overall publish status as a single check ───────────────
  all-published:
    name: All Images Published
    needs:
      - container-publish
    if: always()
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Check result
        run: |
          if [[ "${{ needs.container-publish.result }}" != "success" ]]; then
            echo "::error::One or more publish jobs did not succeed: ${{ needs.container-publish.result }}"
            exit 1
          fi
          echo "All images published successfully."
