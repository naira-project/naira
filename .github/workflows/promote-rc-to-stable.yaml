name: Promote RC to Stable
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  artifact-metadata: write

jobs:
  trigger-promotion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Update Release Please Config & Manifest
        run: |
          # Compute the stable target from the manifest (strip -rc.* suffix).
          # The manifest is intentionally left unchanged so the existing git tag
          # (e.g. v0.12.0-rc) remains a valid changelog boundary for Release Please.
          CURRENT=$(jq -r '."."' .release-please-manifest.json)
          STABLE_VERSION=${CURRENT%%-rc*}

          # Strip only the flags that gate RC behaviour; keep versioning:prerelease
          # so Release Please can recognise bare -rc versions and graduate them correctly.
          jq --arg rv "$STABLE_VERSION" '
            del(
              .packages["."]."prerelease-type",
              .packages["."]."skip-github-release",
              .packages["."]."skip-changelog",
              .packages["."]."release-as"
            ) |
            .packages["."].prerelease = false |
            .packages["."]["release-as"] = $rv
          ' release-please-config.json > tmp-config.json
          mv tmp-config.json release-please-config.json

      - name: Create Promotion PR (signed commit via GitHub API)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME="chore/promote-to-stable"

          # Point the branch at current main (create, or force-reset if it exists)
          BASE_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" -X POST \
            -f ref="refs/heads/${BRANCH_NAME}" -f sha="$BASE_SHA" 2>/dev/null || \
          gh api "repos/${GITHUB_REPOSITORY}/git/refs/heads/${BRANCH_NAME}" -X PATCH \
            -f sha="$BASE_SHA" -F force=true

          # Commit via the Contents API so GitHub signs it; main requires signed commits.
          # 'fix:' prefix wakes Release Please and squashes the RC changelog into one stable entry.
          FILE_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/contents/release-please-config.json?ref=${BRANCH_NAME}" --jq '.sha')
          gh api "repos/${GITHUB_REPOSITORY}/contents/release-please-config.json" -X PUT \
            -f message="fix: finalize stable release promotion" \
            -f branch="$BRANCH_NAME" \
            -f sha="$FILE_SHA" \
            -f content="$(base64 -w0 release-please-config.json)"

          # Create the PR without the override footer
          gh pr create \
            --title "fix: finalize stable release promotion" \
            --body "Merging this PR updates the baseline configuration to trigger a stable release. Release Please will naturally squash the RC changelog." \
            --base main --head "$BRANCH_NAME" || true
