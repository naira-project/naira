name: PR Validation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Pull request title ─────────────────────────────────────────────────
  pr-title:
    name: Validate · PR Title
    runs-on: ubuntu-latest
    steps:
      - name: Validate Conventional Commit title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([^)[:space:]]+\))?!?: [^[:space:]].*$'
          if [[ ! "$PR_TITLE" =~ $pattern ]]; then
            echo "::error::PR title must use an approved Conventional Commit type (build, chore, ci, docs, feat, fix, perf, refactor, revert, style, test), e.g. 'feat(catalog): add model search'."
            exit 1
          fi

  # ── 2. GitHub Actions workflow security ──────────────────────────────────
  workflow-security:
    name: Validate · Workflow Security
    permissions:
      contents: read
    uses: naira-project/naira-github-workflows/.github/workflows/reusable-workflow-security.yml@8c67a4db452f8f3f4d7aa45d62740632e3bf0d2d

  # ── 3. Go unit tests ──────────────────────────────────────────────────────
  go-test:
    name: Test
    uses: naira-project/naira-github-workflows/.github/workflows/reusable-go-test.yml@15a3b4703cbb9ba357c17d4d61a6d2c9f7ca466f
    with:
      go-version: "1.26"
      working-directory: "."
      run-race-detector: true
      # Threshold is 0 (informational only) until a baseline is established;
      # revisit once the test suite reaches meaningful coverage.
      coverage-threshold: 0

  # ── 4. Go formatting, linting ───────────────────────────
  backend-check:
    name: Check · Go
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Check gofmt
        run: |
          gofmt_output=$(gofmt -l .)
          if [[ -n "$gofmt_output" ]]; then
            echo "The following files are not formatted with gofmt:"
            echo "$gofmt_output"
            exit 1
          fi

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2

  # ── 5. UI checks (TypeScript and Biome) ───────────────────────────────────
  ui-check:
    name: Check · UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: |
          set -o pipefail
          npx tsc -b
          # biome reports paths relative to this job's working-directory (ui/), but
          # GitHub Actions resolves annotation `file=` paths relative to the repo
          # root, so prefix them to make inline PR annotations line up correctly.
          npx biome ci --reporter=github . | sed -E 's/(file=)/\1ui\//'

  # ── 6. Container build — catalog (build-only, no push on PRs) ─────────────
  container-build-catalog:
    name: Container Build · Catalog
    uses: naira-project/naira-github-workflows/.github/workflows/reusable-container-build-only.yml@9d11293b6fdfb550b5b8d43ae551639591bcf468
    with:
      image-name: "naira-catalog"
      dockerfile: "catalog/Dockerfile"
      context: "."
      platforms: "linux/amd64,linux/arm64"

  # ── 7. Container build — ui (build-only, no push on PRs) ──────────────────
  container-build-ui:
    name: Container Build · UI
    uses: naira-project/naira-github-workflows/.github/workflows/reusable-container-build-only.yml@9d11293b6fdfb550b5b8d43ae551639591bcf468
    with:
      image-name: "naira-ui"
      dockerfile: "ui/Dockerfile"
      context: "ui"
      platforms: "linux/amd64,linux/arm64"

  # ── 7. Helm chart ─────────────────────────────────────────────────────────
  helm-chart:
    name: Check · Helm Chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # ct lint diffs against the target branch
          persist-credentials: false
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Set up chart-testing
        uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # v2.8.0
      - name: helm lint
        run: |
          helm lint deploy/charts/naira -f deploy/charts/naira/ci/default-values.yaml
          helm lint deploy/charts/naira -f deploy/charts/naira/values-dev.yaml
      - name: Render tests
        run: deploy/charts/naira/tests/render-test.sh
      - name: ct lint
        env:
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: ct lint --config ct.yaml --target-branch "$TARGET_BRANCH"
      - name: Set up kubeconform
        env:
          KUBECONFORM_VERSION: v0.8.0
          KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
        run: |
          curl -sSLo kubeconform.tar.gz "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tar.gz" | sha256sum -c -
          tar -xzf kubeconform.tar.gz kubeconform
          sudo mv kubeconform /usr/local/bin/kubeconform
      - name: kubeconform
        # Validates the rendered manifests against the Kubernetes API schemas;
        # helm lint does not see wrong field names or types. One run per values
        # file the chart supports (bare defaults do not render by design).
        env:
          KUBERNETES_VERSION: "1.36.1" # keep in sync with e2e/base/kind-config.yaml
        run: |
          for values in ci/default-values.yaml values-dev.yaml; do
            helm template naira deploy/charts/naira --namespace idp-system -f "deploy/charts/naira/${values}" \
              | kubeconform -strict -summary -kubernetes-version "${KUBERNETES_VERSION}"
          done

  # ── 8. Helm chart — install on kind ──────────────────────────────────────
  # The chart and its dependency tier on a throwaway cluster, then the same
  # functional probe a developer runs locally: every plugin registers with the
  # catalog and a run of every plugin succeeds. Images are built from this PR's
  # tree, so unpublished plugin images are no obstacle.
  helm-chart-install:
    name: Check · Helm Chart Install
    needs: helm-chart
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout test-dependencies
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: naira-project/test-dependencies
          # Pinned commit of the test-dependencies chart this PR is verified against.
          ref: 0b1d86e6c46a416cc86fd35f765ca6d6a53e2ed6
          path: test-dependencies
          persist-credentials: false
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0
      - name: Create kind cluster
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          cluster_name: naira-ci
      - name: Build images
        # Same names and tag the chart's values-dev.yaml expects; loaded into
        # the node, never pushed.
        run: |
          docker build -q -t naira-catalog:0.1.0 -f catalog/Dockerfile .
          for p in depl-calls-svc depl-uses-litellm fluxcd litellm mcp-servers mlflow tech-radar; do
            docker build -q -t "naira-plugin-${p}:0.1.0" -f "plugins/cmd/${p//-/_}/Dockerfile" .
          done
          docker build -q -t naira-ui:0.1.0 ui
          docker build -q -t naira-portal:0.1.0 naira-openmfp-portal
          kind load docker-image --name naira-ci \
            naira-catalog:0.1.0 naira-ui:0.1.0 naira-portal:0.1.0 \
            naira-plugin-depl-calls-svc:0.1.0 naira-plugin-depl-uses-litellm:0.1.0 \
            naira-plugin-fluxcd:0.1.0 naira-plugin-litellm:0.1.0 naira-plugin-mcp-servers:0.1.0 \
            naira-plugin-mlflow:0.1.0 naira-plugin-tech-radar:0.1.0
      - name: Install test-dependencies
        # No --wait: the LiteLLM migrations Job is garbage-collected after 120s
        # and Helm then fails a healthy release.
        run: |
          # Helm 4 does not fetch from an unregistered HTTP repository.
          helm repo add community-charts https://community-charts.github.io/helm-charts
          helm repo add open-metadata https://helm.open-metadata.org
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm dependency build test-dependencies/charts/test-dependencies
          helm install test-dependencies test-dependencies/charts/test-dependencies \
            --namespace naira-deps --create-namespace \
            -f test-dependencies/charts/test-dependencies/values-dev.yaml
          kubectl -n naira-deps wait --for=condition=Available deployment --all --timeout=12m
          kubectl -n naira-deps wait --for=jsonpath='{.status.readyReplicas}'=1 statefulset --all --timeout=12m
      - name: Install naira
        run: |
          helm install naira deploy/charts/naira \
            --namespace idp-system --create-namespace \
            -f deploy/charts/naira/values-dev.yaml
          kubectl -n idp-system wait --for=condition=Available deployment --all --timeout=5m
      - name: Probe the catalog through its API
        # Token from the dev realm, then: all enabled plugins registered, a
        # run of every plugin reaches SUCCEEDED, the UI proxies /v1 to the catalog.
        run: |
          kubectl -n naira-deps port-forward svc/keycloak 18080:8080 &
          kubectl -n idp-system port-forward svc/catalog 18090:8090 &
          kubectl -n idp-system port-forward svc/ui 13001:80 &
          for _ in $(seq 1 30); do
            curl -sf -o /dev/null localhost:18080/realms/naira && curl -sf -o /dev/null localhost:18090/healthz && break
            sleep 1
          done
          TOKEN=$(curl -sf -H 'Host: localhost:8080' -d grant_type=password -d client_id=naira-portal \
            -d client_secret=naira-local-dev-secret -d username=testuser -d password=testpass \
            localhost:18080/realms/naira/protocol/openid-connect/token | jq -r .access_token)
          AUTH="Authorization: Bearer ${TOKEN}"
          expected=$(helm template naira deploy/charts/naira -n idp-system -f deploy/charts/naira/values-dev.yaml \
            | yq 'select(.kind == "ConfigMap" and .metadata.name == "catalog-plugin-config") | .data["plugins.yaml"]' \
            | yq '.plugins | keys | sort | join(",")')
          got=$(curl -sf -H "${AUTH}" localhost:18090/v1/plugins | jq -r '[.plugins[].name] | sort | join(",")')
          echo "plugins: ${got}"
          [ "${got}" = "${expected}" ] || { echo "::error::registered plugins differ from the chart: expected ${expected}"; exit 1; }
          curl -sf -X POST -H "${AUTH}" 'localhost:18090/v1/plugins:run' -o /dev/null
          for _ in $(seq 1 30); do
            states=$(curl -sf -H "${AUTH}" localhost:18090/v1/operations | jq -r '[.operations[].state] | unique | join(",")')
            [ "${states}" = "SUCCEEDED" ] && break
            sleep 2
          done
          echo "operation states: ${states}"
          [ "${states}" = "SUCCEEDED" ] || { echo "::error::plugin runs did not all succeed"; exit 1; }
          curl -sf -o /dev/null -H "${AUTH}" localhost:13001/v1/plugins || { echo "::error::UI does not proxy /v1 to the catalog"; exit 1; }
      - name: Show state
        if: always()
        run: |
          kubectl -n naira-deps get pods
          kubectl -n idp-system get pods
          kubectl -n idp-system logs deploy/catalog -c catalog --tail=50 || true

  # ── Gate: single required status check for branch protection ──────────────
  all-checks:
    name: All Checks Passed
    needs:
      [
        pr-title,
        workflow-security,
        go-test,
        backend-check,
        ui-check,
        container-build-catalog,
        container-build-ui,
        helm-chart,
        helm-chart-install,
      ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          RESULTS=(
            "${{ needs.pr-title.result }}"
            "${{ needs.workflow-security.result }}"
            "${{ needs.go-test.result }}"
            "${{ needs.backend-check.result }}"
            "${{ needs.ui-check.result }}"
            "${{ needs.container-build-catalog.result }}"
            "${{ needs.container-build-ui.result }}"
            "${{ needs.helm-chart.result }}"
            "${{ needs.helm-chart-install.result }}"
          )
          for r in "${RESULTS[@]}"; do
            if [[ "$r" != "success" ]]; then
              echo "::error::One or more required checks did not succeed: $r"
              exit 1
            fi
          done
          echo "All checks passed."
