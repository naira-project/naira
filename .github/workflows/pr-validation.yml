name: PR Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Go unit tests (catalog service) ────────────────────────────────────
  go-test:
    name: Test · Catalog
    uses: naira-project/naira-github-workflows/.github/workflows/reusable-go-test.yml@dddb3537f34394a6d3187fbf17df84882dd586f7
    with:
      go-version: "1.26"
      working-directory: "catalog"
      run-race-detector: true
      # Threshold is 0 (informational only) until a baseline is established;
      # revisit once the test suite reaches meaningful coverage.
      coverage-threshold: 0

  # ── 2. Container build — catalog (build-only, no push on PRs) ─────────────
  container-build-catalog:
    name: Container Build · Catalog
    uses: naira-project/naira-github-workflows/.github/workflows/reusable-container-build-only.yml@9d11293b6fdfb550b5b8d43ae551639591bcf468
    with:
      image-name: "naira-catalog"
      dockerfile: "catalog/Dockerfile"
      context: "."
      platforms: "linux/amd64,linux/arm64"

  # ── 3. Container build — ui (build-only, no push on PRs) ──────────────────
  container-build-ui:
    name: Container Build · UI
    uses: naira-project/naira-github-workflows/.github/workflows/reusable-container-build-only.yml@9d11293b6fdfb550b5b8d43ae551639591bcf468
    with:
      image-name: "naira-ui"
      dockerfile: "ui-poc/Dockerfile"
      context: "ui-poc"
      platforms: "linux/amd64,linux/arm64"

  # ── Gate: single required status check for branch protection ──────────────
  all-checks:
    name: All Checks Passed
    needs: [go-test, container-build-catalog, container-build-ui]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          RESULTS=(
            "${{ needs.go-test.result }}"
            "${{ needs.container-build-catalog.result }}"
            "${{ needs.container-build-ui.result }}"
          )
          for r in "${RESULTS[@]}"; do
            if [[ "$r" != "success" ]]; then
              echo "::error::One or more required checks did not succeed: $r"
              exit 1
            fi
          done
          echo "All checks passed."
